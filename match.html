<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIP Chat - دردشة عشوائية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --danger: #ef4444;
            --success: #10b981;
            --dark: #0f172a;
            --bg: #050b18;
            --card-bg: #111827;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            background: var(--bg);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ===== شريط التنقل العلوي ===== */
        .navbar {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            height: 56px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid #1e293b;
            flex-shrink: 0;
            z-index: 100;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            font-weight: 800;
            font-size: 1.1rem;
            color: var(--primary);
            letter-spacing: 1px;
        }

        .logo i {
            color: #ffd700;
        }

        .nav-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .icon-btn {
            font-size: 1.1rem;
            color: var(--text-main);
            cursor: pointer;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            transition: 0.3s;
            background: rgba(255, 255, 255, 0.05);
            position: relative;
            border: none;
        }

        .icon-btn:hover {
            background: var(--primary);
            transform: translateY(-2px);
        }

        .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--danger);
            color: white;
            font-size: 0.5rem;
            padding: 1px 5px;
            border-radius: 50%;
            border: 2px solid var(--bg);
            min-width: 16px;
            text-align: center;
        }

        .auth-btn {
            padding: 4px 14px;
            border-radius: 20px;
            border: none;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.3s;
            background: var(--primary);
            color: white;
        }

        .auth-btn:hover {
            transform: scale(1.05);
            background: var(--primary-hover);
        }

        .auth-btn.logout-btn {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .auth-btn.logout-btn:hover {
            background: var(--danger);
            color: white;
        }

        /* ===== حاوية الفيديو (تقسيم عمودي) ===== */
        .video-grid {
            flex: 1;
            display: flex;
            flex-direction: row;
            background: #0a0f1d;
            position: relative;
            overflow: hidden;
            min-height: 0;
        }

        .video-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0d1117;
            position: relative;
            min-width: 0;
            border-left: 1px solid #1e293b;
        }

        .video-wrapper:first-child {
            border-left: none;
        }

        .video-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d1117;
            position: relative;
            overflow: hidden;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #0a0f1d;
        }

        .video-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            background: radial-gradient(circle at center, #1a1f2e, #0a0f1d);
        }

        .video-placeholder i {
            font-size: 3rem;
            margin-bottom: 8px;
            color: var(--primary);
            opacity: 0.5;
        }

        .video-placeholder h3 {
            font-weight: 400;
            font-size: 0.9rem;
        }

        /* ===== تراكب معلومات المستخدم ===== */
        .user-overlay {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            padding: 6px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .user-overlay .username {
            font-weight: 600;
            font-size: 0.8rem;
        }

        .user-overlay .user-id {
            font-family: 'Courier New', monospace;
            font-size: 0.65rem;
            background: var(--primary);
            padding: 1px 8px;
            border-radius: 6px;
            color: white;
        }

        .user-overlay .copy-id {
            cursor: pointer;
            color: var(--text-dim);
            transition: 0.3s;
            font-size: 0.75rem;
        }

        .user-overlay .copy-id:hover {
            color: white;
        }

        .friend-req-btn {
            background: var(--success);
            border: none;
            color: white;
            padding: 2px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.65rem;
            transition: 0.3s;
        }

        .friend-req-btn:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        /* ===== قائمة المستخدمين المتاحين (جانبية) ===== */
        .users-scroll {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-height: 60%;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) transparent;
            padding: 3px;
        }

        .users-scroll::-webkit-scrollbar {
            width: 3px;
        }

        .users-scroll::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        .user-avatar-small-wrapper {
            position: relative;
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            cursor: pointer;
        }

        .user-avatar-small {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: 0.3s;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #4f46e5, #8b5cf6);
            color: white;
            font-weight: bold;
            font-size: 0.7rem;
        }

        .user-avatar-small:hover {
            border-color: var(--primary);
            transform: scale(1.1);
        }

        .user-avatar-small img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-avatar-small .status-dot {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid var(--bg);
        }

        .user-avatar-small .status-dot.online {
            background: var(--success);
        }

        .user-avatar-small .status-dot.offline {
            background: #6b7280;
        }

        .user-avatar-small .status-dot.in-call {
            background: #f59e0b;
        }

        /* ===== رسائل الشات ===== */
        .chat-messages {
            position: absolute;
            top: 12px;
            left: 12px;
            max-width: 250px;
            max-height: 35%;
            overflow-y: auto;
            z-index: 15;
            display: flex;
            flex-direction: column;
            gap: 3px;
            pointer-events: none;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) transparent;
        }

        .chat-messages::-webkit-scrollbar {
            width: 3px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        .chat-msg {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 0.75rem;
            border-right: 3px solid var(--primary);
            pointer-events: all;
            animation: slideUp 0.3s ease;
            max-width: 100%;
            word-wrap: break-word;
        }

        .chat-msg .msg-sender {
            font-weight: 600;
            color: var(--primary);
            font-size: 0.6rem;
            display: block;
            margin-bottom: 1px;
        }

        .chat-msg .msg-text {
            color: #e2e8f0;
        }

        .chat-msg.system {
            border-right-color: var(--text-dim);
            background: rgba(30, 41, 59, 0.8);
        }

        .chat-msg.system .msg-sender {
            color: var(--text-dim);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== عداد الوقت ===== */
        .timer-display {
            color: #ffd700;
            font-size: 0.75rem;
            font-weight: 600;
            font-family: 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.5);
            padding: 2px 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            letter-spacing: 1px;
            position: absolute;
            top: 12px;
            right: 50%;
            transform: translateX(50%);
            z-index: 15;
        }

        /* ===== مودال الهدايا ===== */
        .gift-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1e293b;
            border-radius: 20px;
            padding: 20px;
            z-index: 10000;
            display: none;
            flex-direction: column;
            width: 340px;
            max-width: 92%;
            border: 1px solid #334155;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.8);
        }

        .gift-modal.active {
            display: flex;
            animation: popIn 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .gift-modal h3 {
            margin-bottom: 12px;
            text-align: center;
            color: var(--text-main);
            font-size: 1.1rem;
        }

        .gift-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 14px;
        }

        .gift-item {
            background: #0f172a;
            padding: 10px 6px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            border: 2px solid transparent;
        }

        .gift-item:hover {
            border-color: var(--primary);
            transform: translateY(-3px);
        }

        .gift-item i {
            font-size: 1.6rem;
            display: block;
            margin-bottom: 3px;
        }

        .gift-item .gift-name {
            font-size: 0.65rem;
            color: var(--text-dim);
        }

        .gift-item .gift-price {
            font-size: 0.6rem;
            color: var(--success);
        }

        .gift-modal .close-modal-btn {
            background: var(--danger);
            border: none;
            color: white;
            padding: 8px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .gift-modal .close-modal-btn:hover {
            opacity: 0.8;
        }

        /* ===== منطقة التحكم السفلية ===== */
        .control-bottom {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid #1e293b;
            padding: 8px 16px 10px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 30;
        }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* أزرار التحكم */
        .ctrl-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ctrl-btn:hover {
            background: var(--primary);
            transform: scale(1.05);
        }

        .ctrl-btn.end-call {
            background: var(--danger);
        }

        .ctrl-btn.end-call:hover {
            background: #dc2626;
        }

        .ctrl-btn.muted {
            background: #6b7280;
        }

        .ctrl-btn.gift-btn {
            background: rgba(255, 215, 0, 0.15);
            color: #fbbf24;
        }

        .ctrl-btn.gift-btn:hover {
            background: rgba(255, 215, 0, 0.3);
        }

        /* زر البحث عن شريك */
        .match-btn {
            padding: 8px 24px;
            border-radius: 50px;
            border: none;
            background: linear-gradient(135deg, var(--primary), #6d28d9);
            color: white;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 25px rgba(139, 92, 246, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .match-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 35px rgba(139, 92, 246, 0.6);
        }

        .match-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .match-status {
            color: var(--text-dim);
            font-size: 0.7rem;
            text-align: center;
        }

        /* شريط الدردشة */
        .chat-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            max-width: 600px;
            min-width: 200px;
        }

        .chat-bar input {
            flex: 1;
            padding: 7px 14px;
            border-radius: 30px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            font-size: 0.8rem;
            outline: none;
            transition: 0.3s;
            min-width: 50px;
        }

        .chat-bar input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
        }

        .chat-bar input::placeholder {
            color: var(--text-dim);
        }

        .chat-bar .send-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--primary);
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.3s;
            flex-shrink: 0;
        }

        .chat-bar .send-btn:hover {
            background: var(--primary-hover);
            transform: scale(1.05);
        }

        .chat-bar .chat-gift-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 215, 0, 0.15);
            color: #fbbf24;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.3s;
            flex-shrink: 0;
        }

        .chat-bar .chat-gift-btn:hover {
            background: rgba(255, 215, 0, 0.3);
            transform: scale(1.05);
        }

        /* ===== شريط التنقل السفلي ===== */
        .bottom-nav {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid #1e293b;
            display: flex;
            justify-content: space-around;
            padding: 6px 0 10px;
            flex-shrink: 0;
            z-index: 100;
        }

        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #666;
            font-size: 0.5rem;
            cursor: pointer;
            transition: 0.3s;
            background: none;
            border: none;
            padding: 3px 10px;
            position: relative;
        }

        .bottom-nav .nav-item i {
            font-size: 1rem;
            margin-bottom: 1px;
            transition: 0.3s;
        }

        .bottom-nav .nav-item:hover {
            color: #ffd700;
        }

        .bottom-nav .nav-item.active {
            color: #ffd700;
        }

        .bottom-nav .nav-item .nav-badge {
            position: absolute;
            top: -2px;
            right: 2px;
            background: #ff4757;
            color: #fff;
            font-size: 0.4rem;
            padding: 1px 4px;
            border-radius: 10px;
            min-width: 12px;
            text-align: center;
            font-weight: bold;
            border: 1px solid #0f172a;
        }

        /* ===== إشعار ===== */
        .notification-toast {
            position: fixed;
            top: 65px;
            right: 16px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid #334155;
            z-index: 9999;
            display: none;
            animation: slideInRight 0.3s ease;
            max-width: 300px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .notification-toast .toast-content {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .notification-toast .toast-content i {
            color: var(--primary);
            font-size: 1.1rem;
        }

        .notification-toast .toast-content .toast-text {
            flex: 1;
            font-size: 0.8rem;
            color: var(--text-main);
        }

        .notification-toast .toast-close {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 1.1rem;
            cursor: pointer;
        }

        /* ===== استجابة ===== */
        @media (max-width: 768px) {
            .video-grid {
                flex-direction: column;
            }
            .video-wrapper {
                border-left: none;
                border-bottom: 1px solid #1e293b;
            }
            .video-wrapper:last-child {
                border-bottom: none;
            }
            .video-wrapper {
                height: 50%;
            }
            .users-scroll {
                right: 4px;
                gap: 4px;
            }
            .user-avatar-small-wrapper {
                width: 30px;
                height: 30px;
            }
            .user-avatar-small {
                width: 30px;
                height: 30px;
                font-size: 0.6rem;
            }
            .chat-messages {
                max-width: 180px;
                top: 8px;
                left: 8px;
            }
            .chat-msg {
                font-size: 0.65rem;
                padding: 3px 8px;
            }
            .timer-display {
                font-size: 0.65rem;
                padding: 1px 8px;
                top: 8px;
            }
            .control-row {
                gap: 6px;
            }
            .ctrl-btn {
                width: 34px;
                height: 34px;
                font-size: 0.85rem;
            }
            .match-btn {
                padding: 6px 18px;
                font-size: 0.8rem;
            }
            .chat-bar input {
                font-size: 0.7rem;
                padding: 5px 10px;
            }
            .chat-bar .send-btn,
            .chat-bar .chat-gift-btn {
                width: 32px;
                height: 32px;
                font-size: 0.8rem;
            }
            .gift-modal {
                width: 300px;
                padding: 16px;
            }
            .gift-item i {
                font-size: 1.3rem;
            }
            .logo {
                font-size: 0.95rem;
            }
            .auth-btn {
                font-size: 0.65rem;
                padding: 3px 10px;
            }
            .icon-btn {
                width: 30px;
                height: 30px;
                font-size: 0.95rem;
            }
            .video-placeholder i {
                font-size: 2.2rem;
            }
            .video-placeholder h3 {
                font-size: 0.75rem;
            }
            .user-overlay {
                padding: 4px 8px;
                font-size: 0.65rem;
                gap: 4px;
                bottom: 8px;
                right: 8px;
            }
            .user-overlay .user-id {
                font-size: 0.55rem;
                padding: 1px 6px;
            }
        }

        @media (max-width: 400px) {
            .user-avatar-small-wrapper {
                width: 24px;
                height: 24px;
            }
            .user-avatar-small {
                width: 24px;
                height: 24px;
                font-size: 0.5rem;
            }
            .user-avatar-small .status-dot {
                width: 8px;
                height: 8px;
            }
            .chat-messages {
                max-width: 140px;
            }
            .ctrl-btn {
                width: 30px;
                height: 30px;
                font-size: 0.75rem;
            }
            .match-btn {
                padding: 5px 14px;
                font-size: 0.7rem;
            }
            .chat-bar input {
                font-size: 0.65rem;
                padding: 4px 8px;
            }
            .chat-bar .send-btn,
            .chat-bar .chat-gift-btn {
                width: 28px;
                height: 28px;
                font-size: 0.7rem;
            }
            .gift-modal {
                width: 260px;
                padding: 14px;
            }
            .gift-item {
                padding: 6px 4px;
            }
            .gift-item i {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== شريط التنقل العلوي ===== -->
    <nav class="navbar">
        <div class="logo-section">
            <div class="logo"><i class="fas fa-crown"></i> VIP Chat</div>
        </div>

            <button class="icon-btn" onclick="toggleProfile()" title="الملف الشخصي">
                <i class="fas fa-user-circle"></i>

            <button class="icon-btn" onclick="toggleNotifications()" title="الإشعارات">
                <i class="fas fa-bell"></i>
                <span class="badge" id="notifBadge" style="display:none;">0</span>

            <button class="auth-btn" id="authBtn" onclick="handleAuth()">تسجيل الدخول</button>

    <!-- ===== إشعار ===== -->
    <div id="notificationToast" class="notification-toast">

    <!-- ===== مودال الهدايا ===== -->

        <h3><i class="fas fa-gift" style="color:#fbbf24;"></i> أرسل هدية</h3>

            <div class="gift-item" onclick="sendGift('وردة', 5)">

            <div class="gift-item" onclick="sendGift('قلب', 10)">

                <div class="gift-name">قلب</div>

            <div class="gift-item" onclick="sendGift('نجمة', 15)">

            <div class="gift-item" onclick="sendGift('كعكة', 20)">

                <div class="gift-price">20 EGP</div>
            </div>
            <div class="gift-item" onclick="sendGift('سيارة', 30)">
                <i class="fas fa-car" style="color:#60a5fa;"></i>
                <div class="gift-name">سيارة</div>
                <div class="gift-price">30 EGP</div>
            </div>
            <div class="gift-item" onclick="sendGift('تاج', 50)">
                <i class="fas fa-crown" style="color:#fcd34d;"></i>
                <div class="gift-name">تاج</div>
                <div class="gift-price">50 EGP</div>

        </div>
        <button class="close-modal-btn" onclick="closeGiftModal()">إلغاء</button>
    </div>

    <!-- ===== حاوية الفيديو (تقسيم عمودي) ===== -->
    <div class="video-grid" id="videoGrid">

        <!-- ===== الجانب الأيسر (المستخدم) ===== -->
        <div class="video-wrapper" id="localWrapper">
            <div class="video-container" id="localVideoContainer">
                <video id="localVideo" autoplay muted playsinline></video>
                <div class="video-placeholder" id="localPlaceholder">
                    <i class="fas fa-user-circle"></i>
                    <h3>أنت</h3>
                </div>
            </div>
            <div class="user-overlay" id="localOverlay">
                <span class="username" id="localName">...</span>
                <span class="user-id" id="localId">000000</span>
                <i class="fas fa-copy copy-id" onclick="copyId('localId')" title="نسخ المعرف"></i>
            </div>
        </div>

        <!-- ===== الجانب الأيمن (الشريك) ===== -->
        <div class="video-wrapper" id="remoteWrapper">
            <div class="video-container" id="remoteVideoContainer">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="video-placeholder" id="remotePlaceholder">
                    <i class="fas fa-user-circle"></i>
                    <h3>في انتظار شريك...</h3>
                </div>
            </div>
            <div class="user-overlay" id="remoteOverlay" style="display:none;">
                <span class="username" id="remoteName">شريك</span>
                <span class="user-id" id="remoteId">000000</span>
                <i class="fas fa-copy copy-id" onclick="copyId('remoteId')" title="نسخ المعرف"></i>
                <button class="friend-req-btn" onclick="sendFriendRequest()">➕ طلب صداقة</button>
            </div>
        </div>

        <!-- ===== قائمة المستخدمين المتاحين (جانبية) ===== -->
        <div class="users-scroll" id="usersScroll">
            <!-- سيتم إضافة المستخدمين ديناميكياً -->
        </div>

        <!-- ===== رسائل الشات ===== -->
        <div class="chat-messages" id="chatMessages"></div>

        <!-- ===== عداد الوقت ===== -->
        <div class="timer-display" id="timerDisplay">⏱️ 00:00</div>
    </div>

    <!-- ===== منطقة التحكم السفلية ===== -->
    <div class="control-bottom">
        <!-- الصف الأول: زر البحث + الحالة -->
        <div class="control-row">
            <button class="match-btn" id="matchBtn" onclick="startMatch()">
                <i class="fas fa-random"></i> ابحث عن شريك
            </button>
            <span class="match-status" id="matchStatus">انقر للبحث عن محادثة عشوائية</span>
        </div>

        <!-- الصف الثاني: أزرار التحكم + شريط الدردشة -->
        <div class="control-row">
            <button class="ctrl-btn" id="micBtn" onclick="toggleMic()" title="كتم الميكروفون">
                <i class="fas fa-microphone"></i>
            </button>
            <button class="ctrl-btn" id="camBtn" onclick="toggleCam()" title="إيقاف الكاميرا">
                <i class="fas fa-video"></i>
            </button>
            <button class="ctrl-btn end-call" onclick="endCall()" title="إنهاء المكالمة">
                <i class="fas fa-phone-slash"></i>
            </button>
            <button class="ctrl-btn gift-btn" onclick="openGiftModal()" title="هدية">
                <i class="fas fa-gift"></i>
            </button>

            <div class="chat-bar">
                <button class="chat-gift-btn" onclick="openGiftModal()"><i class="fas fa-gift"></i></button>
                <input type="text" id="chatInput" placeholder="اكتب رسالة..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button class="send-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>

    <!-- ===== شريط التنقل السفلي ===== -->
    <div class="bottom-nav">
        <button class="nav-item active" id="navHome" onclick="showHome()">
            <i class="fas fa-home"></i>
            <span>الغرف</span>
        </button>
        <button class="nav-item" id="navGames" onclick="showGames()">
            <i class="fas fa-gamepad"></i>
            <span>الألعاب</span>
            <span class="nav-badge">جديد</span>
        </button>
        <button class="nav-item" id="navMessages" onclick="showMessages()">
            <i class="fas fa-comment-dots"></i>
            <span>الرسائل</span>
            <span class="nav-badge" id="msgBadge" style="display:none;">0</span>
        </button>
    </div>

    <script>
        // ============================================================
        // 🔥 تكوين Firebase
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAX0jz_yOGagteO5R5ZHji1ZG44fk--Zvs",
            authDomain: "stvipclub.firebaseapp.com",
            databaseURL: "https://stvipclub-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "stvipclub",
            storageBucket: "stvipclub.firebasestorage.app",
            messagingSenderId: "526607326044",
            appId: "1:526607326044:web:6af53db123ae02c7193f99"
        };

        // ============================================================
        // 📦 المتغيرات العامة
        // ============================================================
        let app, db, auth;
        let localStream = null;
        let currentRoom = null;
        let currentPartner = null;
        let isMatching = false;
        let isMicOn = true;
        let isCamOn = true;
        let currentUser = null;
        let isLoggedIn = false;
        let timerInterval = null;
        let callStartTime = null;
        let allAvailableUsers = [];

        // ============================================================
        // 🚀 تهيئة Firebase وجلب بيانات المستخدم مباشرة
        // ============================================================
        async function initFirebase() {
            try {
                if (firebase.apps.length > 0) {
                    await firebase.app().delete();
                }
                app = firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                auth = firebase.auth();

                auth.onAuthStateChanged(async (user) => {
                    if (user) {
                        // جلب بيانات المستخدم من Firebase مباشرة
                        currentUser = await fetchUserFromFirebase(user);
                        if (currentUser) {
                            isLoggedIn = true;
                            updateUI();
                            listenNotifications();
                            document.getElementById('authBtn').textContent = 'تسجيل الخروج';
                            document.getElementById('authBtn').className = 'auth-btn logout-btn';
                            loadAvailableUsers();
                            // تحديث حالة الاتصال
                            if (currentUser.firebaseKey) {
                                db.ref('users/' + currentUser.firebaseKey).update({
                                    isOnline: true,
                                    lastSeen: new Date().toISOString()
                                });
                            }
                        }
                    } else {
                        isLoggedIn = false;
                        currentUser = null;
                        updateUI();
                        document.getElementById('authBtn').textContent = 'تسجيل الدخول';
                        document.getElementById('authBtn').className = 'auth-btn';
                        document.getElementById('matchBtn').disabled = true;
                        document.getElementById('matchStatus').textContent = '🔒 يرجى تسجيل الدخول';
                    }
                });

            } catch (error) {
                console.error('Firebase init error:', error);
                showToast('❌ خطأ في الاتصال بقاعدة البيانات', 'error');
            }
        }

        // ============================================================
        // 👤 جلب بيانات المستخدم من Firebase مباشرة
        // ============================================================
        async function fetchUserFromFirebase(user) {
            try {
                const snapshot = await db.ref('users').orderByChild('uid').equalTo(user.uid).once('value');
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    const key = Object.keys(data)[0];
                    return { ...data[key], firebaseKey: key, uid: user.uid };
                }
                // إنشاء مستخدم جديد
                const newUser = {
                    uid: user.uid,
                    nickname: user.displayName || 'مستخدم_' + Math.floor(Math.random() * 1000),
                    numericId: Math.floor(100000 + Math.random() * 900000),
                    balanceEGP: 0,
                    balanceUSD: 0,
                    createdAt: new Date().toISOString(),
                    isOnline: true,
                    lastSeen: new Date().toISOString()
                };
                const ref = db.ref('users').push();
                await ref.set(newUser);
                return { ...newUser, firebaseKey: ref.key };
            } catch (e) {
                console.error('Fetch user error:', e);
                return null;
            }
        }

        // ============================================================
        // 🎯 تحديث الواجهة
        // ============================================================
        function updateUI() {
            if (isLoggedIn && currentUser) {
                document.getElementById('localName').textContent = currentUser.nickname || 'أنت';
                document.getElementById('localId').textContent = String(currentUser.numericId || '000000').padStart(6, '0');
                document.getElementById('matchBtn').disabled = false;
                document.getElementById('matchStatus').textContent = 'انقر للبحث عن محادثة عشوائية';
            } else {
                document.getElementById('localName').textContent = 'غير مسجل';
                document.getElementById('localId').textContent = '000000';
                document.getElementById('matchBtn').disabled = true;
                document.getElementById('matchStatus').textContent = '🔒 يرجى تسجيل الدخول';
            }
            updateNotifBadge();
        }

        // ============================================================
        // 🔔 الإشعارات
        // ============================================================
        function listenNotifications() {
            if (!currentUser || !db) return;
            const notifRef = db.ref('users/' + currentUser.firebaseKey + '/notifications');
            notifRef.on('value', (snapshot) => {
                let unreadCount = 0;
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    for (const key in data) {
                        if (!data[key].read) unreadCount++;
                    }
                }
                const badge = document.getElementById('notifBadge');
                if (unreadCount > 0) {
                    badge.textContent = unreadCount;
                    badge.style.display = 'block';
                } else {
                    badge.style.display = 'none';
                }
            });
        }

        async function updateNotifBadge() {
            try {
                if (!currentUser || !db) return;
                const notifRef = db.ref('users/' + currentUser.firebaseKey + '/notifications');
                const snapshot = await notifRef.once('value');
                let unreadCount = 0;
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    for (const key in data) {
                        if (!data[key].read) unreadCount++;
                    }
                }
                const badge = document.getElementById('notifBadge');
                if (unreadCount > 0) {
                    badge.textContent = unreadCount;
                    badge.style.display = 'block';
                } else {
                    badge.style.display = 'none';
                }
            } catch (e) {}
        }

        function toggleNotifications() {
            showToast('🔔', 'سيتم عرض الإشعارات هنا قريباً');
        }

        function toggleProfile() {
            if (!isLoggedIn || !currentUser) {
                showToast('⚠️', 'يرجى تسجيل الدخول');
                return;
            }
            showToast('👤', `الاسم: ${currentUser.nickname}\nالمعرف: ${String(currentUser.numericId).padStart(6, '0')}\nEGP: ${currentUser.balanceEGP || 0}\nUSD: ${currentUser.balanceUSD || 0}`);
        }

        // ============================================================
        // 📋 تحميل المستخدمين المتاحين من Firebase
        // ============================================================
        async function loadAvailableUsers() {
            if (!db) return;
            try {
                const snapshot = await db.ref('users').orderByChild('isOnline').equalTo(true).once('value');
                allAvailableUsers = [];
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    for (const key in data) {
                        const user = data[key];
                        if (user.numericId && user.numericId !== currentUser?.numericId) {
                            allAvailableUsers.push({ ...user, firebaseKey: key });
                        }
                    }
                }
                renderAvailableUsers();
            } catch (e) {
                console.error('Error loading users:', e);
            }
        }

        function renderAvailableUsers() {
            const container = document.getElementById('usersScroll');
            if (allAvailableUsers.length === 0) {
                container.innerHTML = '';
                return;
            }
            const displayUsers = allAvailableUsers.slice(0, 7);
            container.innerHTML = displayUsers.map(user => `
                        <div class="user-avatar-small-wrapper" onclick="viewUserProfile('${user.numericId}')" title="${user.nickname || 'مستخدم'}">
                            <div class="user-avatar-small">
                                ${user.avatar ? `<img src="${user.avatar}" alt="">` : (user.nickname ? user.nickname.charAt(0).toUpperCase() : '?')}
                                <div class="status-dot ${user.inCall ? 'in-call' : 'online'}"></div>
                            </div>
                        </div>
                    `).join('');
        }

        async function viewUserProfile(numericId) {
            try {
                const snapshot = await db.ref('users').orderByChild('numericId').equalTo(parseInt(numericId)).once('value');
                if (!snapshot.exists()) {
                    showToast('❌', 'المستخدم غير موجود');
                    return;
                }
                const data = snapshot.val();
                const userId = Object.keys(data)[0];
                const user = data[userId];
                showToast('👤', `الاسم: ${user.nickname || 'مستخدم'}\n🆔: ${user.numericId}\n💰 EGP: ${user.balanceEGP || 0}`);
            } catch (e) {
                showToast('❌', 'حدث خطأ');
            }
        }

        // ============================================================
        // 🎥 التحكم في الكاميرا والميكروفون
        // ============================================================
        async function getMedia() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: true
                });
                return stream;
            } catch (e) {
                console.error('Media error:', e);
                showToast('⚠️', 'تعذر الوصول إلى الكاميرا أو الميكروفون');
                return null;
            }
        }

        async function toggleMic() {
            if (!localStream) return;
            isMicOn = !isMicOn;
            localStream.getAudioTracks().forEach(track => track.enabled = isMicOn);
            document.getElementById('micBtn').innerHTML = isMicOn ? '<i class="fas fa-microphone"></i>' :
                '<i class="fas fa-microphone-slash"></i>';
            document.getElementById('micBtn').classList.toggle('muted', !isMicOn);
        }

        async function toggleCam() {
            if (!localStream) return;
            isCamOn = !isCamOn;
            localStream.getVideoTracks().forEach(track => track.enabled = isCamOn);
            document.getElementById('camBtn').innerHTML = isCamOn ? '<i class="fas fa-video"></i>' :
                '<i class="fas fa-video-slash"></i>';
            document.getElementById('camBtn').classList.toggle('muted', !isCamOn);
        }

        // ============================================================
        // 🔄 المطابقة العشوائية
        // ============================================================
        async function startMatch() {
            if (!isLoggedIn || !currentUser) {
                showToast('⚠️', 'يرجى تسجيل الدخول أولاً');
                return;
            }
            if (isMatching) return;

            const btn = document.getElementById('matchBtn');
            const status = document.getElementById('matchStatus');
            btn.disabled = true;
            isMatching = true;
            status.textContent = '⏳ جاري البحث عن شريك...';

            if (!localStream) {
                localStream = await getMedia();
                if (!localStream) {
                    status.textContent = '❌ تعذر الوصول إلى الكاميرا';
                    btn.disabled = false;
                    isMatching = false;
                    return;
                }
                document.getElementById('localVideo').srcObject = localStream;
                document.getElementById('localPlaceholder').style.display = 'none';
            }

            const roomId = 'room_' + Date.now() + '_' + Math.floor(Math.random() * 1000);

            try {
                const roomRef = db.ref('rooms/' + roomId);
                await roomRef.set({
                    host: currentUser.firebaseKey,
                    hostNickname: currentUser.nickname,
                    hostId: currentUser.numericId,
                    status: 'waiting',
                    createdAt: firebase.database.ServerValue.TIMESTAMP
                });

                roomRef.on('value', async (snapshot) => {
                    const data = snapshot.val();
                    if (data && data.status === 'joined' && data.guest) {
                        const guestRef = db.ref('users/' + data.guest);
                        const guestSnap = await guestRef.once('value');
                        const guestData = guestSnap.val();

                        currentPartner = {
                            firebaseKey: data.guest,
                            nickname: guestData?.nickname || 'شريك',
                            numericId: guestData?.numericId || '000000',
                            avatar: guestData?.avatar || ''
                        };

                        document.getElementById('remoteName').textContent = currentPartner.nickname;
                        document.getElementById('remoteId').textContent = String(currentPartner.numericId).padStart(6,
                        '0');
                        document.getElementById('remoteOverlay').style.display = 'flex';
                        document.getElementById('remotePlaceholder').style.display = 'none';
                        status.textContent = '✅ متصل مع ' + currentPartner.nickname;
                        btn.disabled = false;
                        isMatching = false;
                        currentRoom = roomId;

                        showToast('🎉', 'تم العثور على شريك: ' + currentPartner.nickname);
                        addChatMessage('system', '🎉 بدأت المحادثة مع ' + currentPartner.nickname);
                        startTimer();
                        listenMessages();
                        listenGifts();
                        listenRoomChanges();

                        if (currentUser?.firebaseKey) {
                            db.ref('users/' + currentUser.firebaseKey).update({
                                inCall: true,
                                currentRoom: roomId
                            });
                        }
                    }
                });

                // البحث عن شريك حقيقي
                setTimeout(async () => {
                    if (isMatching) {
                        await findRealPartner(roomId);
                    }
                }, 3000);

                setTimeout(() => {
                    if (isMatching) {
                        status.textContent = '❌ لم يتم العثور على شريك، حاول مرة أخرى';
                        btn.disabled = false;
                        isMatching = false;
                        roomRef.remove();
                        showToast('⏰', 'انتهى وقت البحث، حاول مرة أخرى');
                    }
                }, 30000);

            } catch (error) {
                console.error('Match error:', error);
                status.textContent = '❌ حدث خطأ، حاول مرة أخرى';
                btn.disabled = false;
                isMatching = false;
                showToast('❌', 'حدث خطأ في البحث');
            }
        }

        // ============================================================
        // 🔍 البحث عن شريك حقيقي من Firebase
        // ============================================================
        async function findRealPartner(roomId) {
            try {
                const snapshot = await db.ref('users').orderByChild('isOnline').equalTo(true).once('value');
                let availableUsers = [];

                if (snapshot.exists()) {
                    const data = snapshot.val();
                    for (const key in data) {
                        const user = data[key];
                        if (user.numericId &&
                            user.numericId !== currentUser?.numericId &&
                            !user.inCall) {
                            availableUsers.push({ ...user, firebaseKey: key });
                        }
                    }
                }

                if (availableUsers.length === 0) return;

                const randomIndex = Math.floor(Math.random() * availableUsers.length);
                const partner = availableUsers[randomIndex];

                const roomRef = db.ref('rooms/' + roomId);
                await roomRef.update({
                    guest: partner.firebaseKey,
                    guestNickname: partner.nickname,
                    guestId: partner.numericId,
                    status: 'joined'
                });

                await db.ref('users/' + partner.firebaseKey + '/notifications').push({
                    text: `📞 طلب مكالمة من ${currentUser.nickname}`,
                    date: new Date().toLocaleString('ar-EG'),
                    read: false,
                    type: 'call_request',
                    roomId: roomId
                });

                await db.ref('users/' + partner.firebaseKey).update({
                    inCall: true,
                    currentRoom: roomId
                });

            } catch (error) {
                console.error('Error finding partner:', error);
            }
        }

        // ============================================================
        // ⏱️ عداد الوقت
        // ============================================================
        function startTimer() {
            callStartTime = Date.now();
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
                const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
                const secs = String(elapsed % 60).padStart(2, '0');
                document.getElementById('timerDisplay').textContent = `⏱️ ${mins}:${secs}`;
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            document.getElementById('timerDisplay').textContent = '⏱️ 00:00';
        }

        // ============================================================
        // 📞 إنهاء المكالمة
        // ============================================================
        function endCall() {
            if (currentRoom) {
                const roomRef = db.ref('rooms/' + currentRoom);
                roomRef.update({ status: 'ended' });
                roomRef.off();
                currentRoom = null;
            }

            if (currentUser?.firebaseKey) {
                db.ref('users/' + currentUser.firebaseKey).update({
                    inCall: false,
                    currentRoom: null
                });
            }

            currentPartner = null;
            document.getElementById('remoteOverlay').style.display = 'none';
            document.getElementById('remotePlaceholder').style.display = 'flex';
            document.getElementById('matchBtn').disabled = false;
            document.getElementById('matchStatus').textContent = 'انقر للبحث عن محادثة جديدة';
            document.getElementById('chatMessages').innerHTML = '';
            stopTimer();

            isMicOn = true;
            isCamOn = true;
            document.getElementById('micBtn').innerHTML = '<i class="fas fa-microphone"></i>';
            document.getElementById('micBtn').classList.remove('muted');
            document.getElementById('camBtn').innerHTML = '<i class="fas fa-video"></i>';
            document.getElementById('camBtn').classList.remove('muted');

            showToast('📞', 'تم إنهاء المكالمة');
        }

        // ============================================================
        // 💬 الدردشة
        // ============================================================
        function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text || !currentRoom || !currentPartner) {
                if (!currentRoom) showToast('⚠️', 'لا توجد محادثة نشطة');
                return;
            }

            addChatMessage('local', text);
            const msgRef = db.ref('rooms/' + currentRoom + '/messages').push();
            msgRef.set({
                sender: currentUser.firebaseKey,
                senderName: currentUser.nickname,
                text: text,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });
            input.value = '';
        }

        function addChatMessage(type, text, senderName) {
            const container = document.getElementById('chatMessages');
            const msg = document.createElement('div');
            msg.className = 'chat-msg' + (type === 'system' ? ' system' : '');
            const sender = type === 'local' ? 'أنت' : type === 'system' ? 'نظام' : (senderName || 'شريك');
            msg.innerHTML = `<span class="msg-sender">${sender}</span><span class="msg-text">${text}</span>`;
            container.appendChild(msg);
            container.scrollTop = container.scrollHeight;
            while (container.children.length > 50) {
                container.removeChild(container.firstChild);
            }
        }

        function listenMessages() {
            if (!currentRoom) return;
            const msgRef = db.ref('rooms/' + currentRoom + '/messages');
            msgRef.off();
            msgRef.on('child_added', (snapshot) => {
                const data = snapshot.val();
                if (data && data.sender !== currentUser.firebaseKey) {
                    addChatMessage('remote', data.text, data.senderName);
                }
            });
        }

        // ============================================================
        // 🎁 الهدايا
        // ============================================================
        function openGiftModal() {
            if (!currentRoom || !currentPartner) {
                showToast('⚠️', 'لا توجد محادثة نشطة');
                return;
            }
            document.getElementById('giftModal').classList.add('active');
        }

        function closeGiftModal() {
            document.getElementById('giftModal').classList.remove('active');
        }

        function sendGift(name, price) {
            if (!currentRoom || !currentPartner) {
                showToast('⚠️', 'لا توجد محادثة نشطة');
                closeGiftModal();
                return;
            }

            if (currentUser.balanceEGP < price) {
                showToast('⚠️', 'رصيدك غير كافٍ. تحتاج ' + price + ' EGP');
                closeGiftModal();
                return;
            }

            currentUser.balanceEGP -= price;
            if (currentUser.firebaseKey) {
                db.ref('users/' + currentUser.firebaseKey).update({
                    balanceEGP: currentUser.balanceEGP
                });
            }

            addChatMessage('system', `🎁 أرسل ${name} 🎁`, 'أنت');
            showToast('🎁', `تم إرسال ${name} إلى ${currentPartner.nickname}`);

            const giftRef = db.ref('rooms/' + currentRoom + '/gifts').push();
            giftRef.set({
                from: currentUser.firebaseKey,
                to: currentPartner.firebaseKey,
                name: name,
                price: price,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });

            closeGiftModal();
        }

        function listenGifts() {
            if (!currentRoom) return;
            const giftRef = db.ref('rooms/' + currentRoom + '/gifts');
            giftRef.off();
            giftRef.on('child_added', (snapshot) => {
                const data = snapshot.val();
                if (data && data.from !== currentUser.firebaseKey) {
                    addChatMessage('system', `🎁 تلقيت هدية: ${data.name} 🎁`, 'نظام');
                    showToast('🎁', `تلقيت هدية ${data.name} من ${currentPartner.nickname}`);
                }
            });
        }

        function listenRoomChanges() {
            if (!currentRoom) return;
            const roomRef = db.ref('rooms/' + currentRoom);
            roomRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data || data.status === 'ended') {
                    showToast('📞', 'أنهى الشريك المحادثة');
                    endCall();
                }
            });
        }

        // ============================================================
        // 🎯 طلب صداقة
        // ============================================================
        function sendFriendRequest() {
            if (!currentPartner) {
                showToast('⚠️', 'لا يوجد شريك حالي');
                return;
            }
            showToast('✅', `تم إرسال طلب صداقة إلى ${currentPartner.nickname}`);
        }

        // ============================================================
        // 📋 نسخ المعرف
        // ============================================================
        function copyId(id) {
            const text = document.getElementById(id).textContent;
            navigator.clipboard.writeText(text).then(() => {
                showToast('✅', 'تم نسخ المعرف: ' + text);
            }).catch(() => {
                const textArea = document.createElement('textarea');
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                showToast('✅', 'تم نسخ المعرف');
            });
        }

        // ============================================================
        // 🔔 الإشعارات (Toast)
        // ============================================================
        function showToast(title, message) {
            const toast = document.getElementById('notificationToast');
            document.getElementById('toastMessage').textContent = message || title;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 4000);
        }

        function closeToast() {
            document.getElementById('notificationToast').style.display = 'none';
        }

        // ============================================================
        // 🔐 تسجيل الخروج والدخول
        // ============================================================
        function handleAuth() {
            if (isLoggedIn) {
                logout();
            } else {
                window.location.href = 'login-match.html';
            }
        }

        async function logout() {
            try {
                if (currentRoom) endCall();

                if (currentUser?.firebaseKey) {
                    await db.ref('users/' + currentUser.firebaseKey).update({
                        isOnline: false,
                        inCall: false,
                        currentRoom: null,
                        lastSeen: new Date().toISOString()
                    });
                }

                if (auth) {
                    await auth.signOut();
                }

                isLoggedIn = false;
                currentUser = null;

                document.getElementById('authBtn').textContent = 'تسجيل الدخول';
                document.getElementById('authBtn').className = 'auth-btn';
                document.getElementById('matchBtn').disabled = true;
                document.getElementById('matchStatus').textContent = '🔒 يرجى تسجيل الدخول';
                document.getElementById('localName').textContent = 'غير مسجل';
                document.getElementById('localId').textContent = '000000';

                showToast('👋', 'تم تسجيل الخروج بنجاح');
                setTimeout(() => window.location.href = 'login-match.html', 1500);

            } catch (error) {
                console.error('Logout error:', error);
                showToast('❌', 'حدث خطأ أثناء تسجيل الخروج');
            }
        }

        // ============================================================
        // 🧭 التنقل بين الصفحات
        // ============================================================
        function showHome() {
            document.querySelectorAll('.bottom-nav .nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('navHome').classList.add('active');
            showToast('🏠', 'العودة إلى الرئيسية');
        }

        function showGames() {
            document.querySelectorAll('.bottom-nav .nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('navGames').classList.add('active');
            showToast('🎮', 'سيتم إضافة الألعاب قريباً');
        }

        function showMessages() {
            document.querySelectorAll('.bottom-nav .nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('navMessages').classList.add('active');
            showToast('💬', 'سيتم عرض الرسائل هنا');
        }

        // ============================================================
        // 🚀 التهيئة عند تحميل الصفحة
        // ============================================================
        window.onload = function() {
            initFirebase();

            setInterval(() => {
                if (isLoggedIn && currentUser?.firebaseKey && db) {
                    db.ref('users/' + currentUser.firebaseKey).update({
                        isOnline: true,
                        lastSeen: new Date().toISOString()
                    });
                }
            }, 30000);

            setInterval(() => {
                if (isLoggedIn) {
                    loadAvailableUsers();
                }
            }, 10000);

            console.log('🎙️ VIP Chat جاهز!');
            console.log('✅ تقسيم الشاشة بالطول (يمين/يسار)');
            console.log('✅ جميع بيانات المستخدم من Firebase مباشرة');
            console.log('✅ شريط الدردشة وأزرار التحكم في الأسفل');
            console.log('✅ عداد الوقت يعمل');
            console.log('✅ قائمة المستخدمين المتاحين جانبية');
        };
    </script>
</body>
</html>
