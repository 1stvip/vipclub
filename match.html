<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎯 كوكبة - المطابقة العشوائية</title>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        /* ===== أنماط خاصة بالمطابقة ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0a0a1a, #1a1040, #0f0c29);
            min-height: 100vh;
            color: white;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* ===== شريط التنقل ===== */
        .navbar {
            background: rgba(10, 10, 30, 0.95);
            backdrop-filter: blur(15px);
            padding: 0.6rem 4%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(255, 215, 0, 0.15);
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 65px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 800;
            color: #ffd700;
            text-decoration: none;
        }

        .logo i {
            font-size: 1.5rem;
        }

        .nav-icons {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nav-btn {
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: #f8fafc;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.8rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }

        .nav-btn:hover {
            background: #8b5cf6;
            border-color: #8b5cf6;
            transform: translateY(-2px);
        }

        .nav-btn.active {
            background: #8b5cf6;
            border-color: #8b5cf6;
        }

        .nav-btn .badge {
            background: #ef4444;
            color: white;
            font-size: 0.6rem;
            padding: 1px 6px;
            border-radius: 50%;
            min-width: 18px;
            text-align: center;
        }

        /* ===== المحتوى الرئيسي ===== */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 10px 15px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            gap: 10px;
            min-height: calc(100vh - 65px);
            padding-bottom: 30px;
        }

        /* ===== زر المطابقة الكبير (نصف الشاشة) ===== */
        .match-btn-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 10px;
            width: 100%;
            min-height: 50vh;
            transition: all 0.5s ease;
        }

        .match-btn-container.hidden {
            display: none;
        }

        .match-btn {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #8b5cf6, #4f46e5);
            color: white;
            font-size: 5rem;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 0 80px rgba(139, 92, 246, 0.3), inset 0 -4px 20px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        .match-btn::before {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            padding: 3px;
            background: conic-gradient(from 0deg, #ffd700, #8b5cf6, #ffd700, #8b5cf6, #ffd700);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .match-btn:hover::before {
            opacity: 1;
        }

        .match-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 100px rgba(139, 92, 246, 0.5);
        }

        .match-btn:active {
            transform: scale(0.95);
        }

        .match-btn .btn-icon {
            font-size: 5rem;
            display: block;
            animation: floatIcon 3s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .match-btn .btn-label {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .match-btn .btn-sub {
            font-size: 0.8rem;
            opacity: 0.7;
            font-weight: 400;
        }

        .match-btn .pulse-ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(255, 215, 0, 0.15);
            animation: pulseRing 2.5s ease-out infinite;
            pointer-events: none;
        }

        .match-btn .pulse-ring:nth-child(1) {
            width: 100%;
            height: 100%;
            animation-delay: 0s;
        }

        .match-btn .pulse-ring:nth-child(2) {
            width: 130%;
            height: 130%;
            animation-delay: 0.8s;
        }

        .match-btn .pulse-ring:nth-child(3) {
            width: 160%;
            height: 160%;
            animation-delay: 1.6s;
        }

        @keyframes pulseRing {
            0% {
                transform: scale(0.8);
                opacity: 1;
            }
            100% {
                transform: scale(1.6);
                opacity: 0;
            }
        }

        .match-btn.searching {
            animation: pulseSearch 1.2s ease-in-out infinite;
            background: linear-gradient(135deg, #f59e0b, #ef4444);
        }

        @keyframes pulseSearch {
            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 0 60px rgba(245, 158, 11, 0.3);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 100px rgba(245, 158, 11, 0.5);
            }
        }

        /* ===== فيديو المكالمة - شاشة مقسمة بالطول ===== */
        .video-container {
            display: none;
            width: 100%;
            max-width: 900px;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            min-height: 400px;
        }

        .video-container.active {
            display: flex;
        }

        .video-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            flex: 1;
            min-height: 350px;
        }

        .video-box {
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            border: 2px solid rgba(255, 255, 255, 0.05);
            position: relative;
            aspect-ratio: 4/3;
            min-height: 200px;
        }

        .video-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #111;
        }

        .video-box .video-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 0.65rem;
            color: #fff;
            backdrop-filter: blur(5px);
            z-index: 2;
        }

        .video-box .video-label.remote {
            left: auto;
            right: 10px;
        }

        .video-box .mute-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.5rem;
            color: #ef4444;
            display: none;
            z-index: 2;
        }

        .video-box .status-indicator {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.5rem;
            color: #10b981;
            display: none;
            z-index: 2;
        }

        .video-box .status-indicator.active {
            display: block;
        }

        .video-box .video-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1;
            gap: 8px;
        }

        .video-box .video-placeholder .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, #4f46e5, #8b5cf6);
        }

        .video-box .video-placeholder .name {
            font-size: 0.85rem;
            font-weight: 600;
            color: #94a3b8;
        }

        .video-box .video-placeholder .status-text {
            font-size: 0.7rem;
            color: #666;
        }

        .video-box .video-placeholder .status-text.connecting {
            color: #f59e0b;
            animation: blink 1s ease-in-out infinite;
        }

        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        /* ===== شات المكالمة ===== */
        .call-chat {
            display: none;
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
            max-height: 200px;
            flex-direction: column;
            flex-shrink: 0;
        }

        .call-chat.active {
            display: flex;
        }

        .call-chat .chat-header {
            padding: 6px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.7rem;
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .call-chat .chat-messages {
            flex: 1;
            padding: 6px 12px;
            overflow-y: auto;
            max-height: 120px;
            min-height: 50px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .call-chat .chat-messages .msg {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            max-width: 85%;
            word-wrap: break-word;
        }

        .call-chat .chat-messages .msg.own {
            background: rgba(139, 92, 246, 0.2);
            align-self: flex-end;
            border-radius: 8px 8px 4px 8px;
        }

        .call-chat .chat-messages .msg.other {
            background: rgba(255, 255, 255, 0.05);
            align-self: flex-start;
            border-radius: 8px 8px 8px 4px;
        }

        .call-chat .chat-messages .msg .sender {
            font-size: 0.55rem;
            color: #94a3b8;
            margin-bottom: 2px;
        }

        .call-chat .chat-messages .msg.system {
            text-align: center;
            color: #666;
            font-size: 0.6rem;
            align-self: center;
            background: transparent;
            max-width: 90%;
        }

        .call-chat .chat-input {
            display: flex;
            gap: 6px;
            padding: 4px 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }

        .call-chat .chat-input input {
            flex: 1;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            color: white;
            outline: none;
            font-size: 0.75rem;
        }

        .call-chat .chat-input input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .call-chat .chat-input button {
            padding: 6px 12px;
            background: #8b5cf6;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.7rem;
            transition: 0.3s;
        }

        .call-chat .chat-input button:hover {
            background: #7c3aed;
            transform: scale(1.05);
        }

        .call-chat .chat-input .gift-btn {
            background: rgba(255, 215, 0, 0.1);
            color: #ffd700;
            border: 1px solid rgba(255, 215, 0, 0.1);
        }

        .call-chat .chat-input .gift-btn:hover {
            background: rgba(255, 215, 0, 0.2);
        }

        /* ===== أزرار التحكم ===== */
        .call-controls {
            display: none;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 5px 0;
            flex-shrink: 0;
        }

        .call-controls.active {
            display: flex;
        }

        .call-btn {
            padding: 10px 18px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.75rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.05);
            min-width: 80px;
            justify-content: center;
        }

        .call-btn:hover {
            transform: translateY(-2px);
        }

        .call-btn.mic-btn {
            background: rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .call-btn.mic-btn.muted {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .call-btn.video-btn {
            background: rgba(59, 130, 246, 0.15);
            border-color: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
        }

        .call-btn.video-btn.off {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .call-btn.end-call {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }

        .call-btn.end-call:hover {
            background: #ef4444;
            color: white;
        }

        .call-btn.next-btn {
            background: rgba(139, 92, 246, 0.2);
            border-color: rgba(139, 92, 246, 0.3);
            color: #8b5cf6;
        }

        .call-btn.next-btn:hover {
            background: #8b5cf6;
            color: white;
        }

        .call-btn.chat-toggle-btn {
            background: rgba(139, 92, 246, 0.1);
            border-color: rgba(139, 92, 246, 0.1);
            color: #a78bfa;
        }

        .call-btn.chat-toggle-btn.active {
            background: rgba(139, 92, 246, 0.2);
            border-color: rgba(139, 92, 246, 0.2);
        }

        /* ===== إشعار المكالمة ===== */
        .incoming-call {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1a1a2e;
            border-radius: 24px;
            padding: 30px 40px;
            border: 2px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            z-index: 99999;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            min-width: 300px;
            max-width: 90%;
            animation: popIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .incoming-call.active {
            display: flex;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .incoming-call .caller-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .incoming-call .caller-info .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4f46e5, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
        }

        .incoming-call .caller-info .details {
            text-align: right;
        }

        .incoming-call .caller-info .details .name {
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
        }

        .incoming-call .caller-info .details .type {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .incoming-call .call-actions {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .incoming-call .call-actions button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 1.5rem;
            transition: all 0.3s ease;
        }

        .incoming-call .call-actions .accept-btn {
            background: #10b981;
            color: white;
        }

        .incoming-call .call-actions .accept-btn:hover {
            background: #059669;
            transform: scale(1.1);
        }

        .incoming-call .call-actions .reject-btn {
            background: #ef4444;
            color: white;
        }

        .incoming-call .call-actions .reject-btn:hover {
            background: #dc2626;
            transform: scale(1.1);
        }

        .incoming-call .call-timer {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        /* ===== هدايا المكالمة ===== */
        .gift-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1a1a2e;
            border-radius: 20px;
            padding: 25px;
            border: 2px solid rgba(255, 215, 0, 0.2);
            z-index: 99998;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            min-width: 280px;
            max-width: 90%;
            animation: popIn 0.3s ease;
        }

        .gift-popup.active {
            display: flex;
        }

        .gift-popup .gift-emoji-big {
            font-size: 4rem;
        }

        .gift-popup .gift-text {
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
        }

        .gift-popup .gift-sender {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        /* ===== مودال الهدايا ===== */
        #callGiftModal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1a1a2e;
            border-radius: 20px;
            padding: 25px;
            border: 2px solid rgba(255, 215, 0, 0.2);
            z-index: 99998;
            min-width: 280px;
            max-width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        #callGiftModal.active {
            display: block;
        }

        #callGiftModal h3 {
            color: #ffd700;
            text-align: center;
            margin-bottom: 15px;
        }

        #callGiftModal .gift-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 8px;
            margin-bottom: 15px;
        }

        #callGiftModal .gift-grid .gift-option {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #callGiftModal .gift-grid .gift-option:hover {
            border-color: #8b5cf6;
            transform: translateY(-2px);
        }

        #callGiftModal .gift-grid .gift-option.selected {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.08);
        }

        #callGiftModal .gift-grid .gift-option .emoji {
            font-size: 1.8rem;
            display: block;
        }

        #callGiftModal .gift-grid .gift-option .name {
            font-size: 0.55rem;
            color: #94a3b8;
        }

        #callGiftModal .gift-grid .gift-option .price {
            font-size: 0.5rem;
            color: #10b981;
            font-weight: 700;
        }

        #callGiftModal .gift-actions {
            display: flex;
            gap: 8px;
        }

        #callGiftModal .gift-actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.85rem;
        }

        #callGiftModal .gift-actions .btn-send {
            background: #8b5cf6;
            color: white;
        }

        #callGiftModal .gift-actions .btn-send:hover {
            background: #7c3aed;
            transform: translateY(-2px);
        }

        #callGiftModal .gift-actions .btn-close {
            background: rgba(255, 255, 255, 0.05);
            color: #94a3b8;
        }

        #callGiftModal .gift-actions .btn-close:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        #callGiftModal .balance-display {
            text-align: center;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 10px;
        }

        #callGiftModal .balance-display span {
            color: #10b981;
            font-weight: 700;
        }

        #callGiftOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 99997;
        }

        #callGiftOverlay.active {
            display: block;
        }

        /* ===== إشعار الهدية العائم ===== */
        .floating-notification {
            position: fixed;
            top: 80px;
            right: 20px;
            background: rgba(16, 185, 129, 0.95);
            backdrop-filter: blur(15px);

        // ============================================================

        function showToast(message, type = 'info') {
            const colors = {
                success: 'rgba(16,185,129,0.9)',
                error: 'rgba(239,68,68,0.9)',
                warning: 'rgba(245,158,11,0.9)',
                info: 'rgba(59,130,246,0.9)'
            };
            const old = document.querySelector('.toast');
            if (old) old.remove();
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.style.background = colors[type] || colors.info;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(30px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // ============================================================
        // 🔥 تهيئة Firebase
        // ============================================================
        async function initializeFirebase() {
            try {
                if (firebase.apps.length > 0) await firebase.app().delete();
                firebase.initializeApp(firebaseConfig);
                database = firebase.database();
                console.log('✅ Firebase initialized');
            } catch (error) {
                console.error('❌ Firebase error:', error);
            }
        }

        // ============================================================
        // 👤 المستخدم
        // ============================================================
        function getStoredUser() {
            try { return JSON.parse(localStorage.getItem('currentUser')); } catch (e) { return null; }
        }

        function isLoggedIn() { return getStoredUser() !== null; }

        function generateNumericId() { return Math.floor(100000 + Math.random() * 900000); }

        async function getCurrentUserFullData() {
            try {
                const stored = getStoredUser();
                if (!stored) return null;
                if (!database) return stored;
                const numericId = stored.numericId || generateNumericId();
                if (!stored.numericId) {
                    stored.numericId = numericId;
                    localStorage.setItem('currentUser', JSON.stringify(stored));
                }
                const snapshot = await database.ref('users')
                    .orderByChild('numericId')
                    .equalTo(numericId)
                    .once('value');
                if (snapshot.exists()) {
                    const userData = snapshot.val();
                    const firebaseKey = Object.keys(userData)[0];
                    const fullUser = userData[firebaseKey];
                    const merged = { ...stored, ...fullUser, numericId: numericId, firebaseKey: firebaseKey };
                    localStorage.setItem('currentUser', JSON.stringify(merged));
                    currentFirebaseUserId = firebaseKey;
                    return merged;
                }
                return stored;
            } catch (e) { return getStoredUser(); }
        }

            try {
                peer = new Peer(peerId, {
                    debug: 2,
                    config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
                });

                    debug: 2,
                    config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
                });
            }
            myPeerId = peer.id;
            peer.on('open', (id) => {
                myPeerId = id;
                console.log('✅ PeerJS ready:', id);
                listenForIncomingCalls();
            });
            peer.on('call', (call) => {
                handleIncomingCall(call);
            });
            peer.on('error', (err) => {
                console.error('Peer error:', err);
            });
        }

        // ============================================================
        // 📞 الاستماع للمكالمات الواردة
        // ============================================================
        function listenForIncomingCalls() {
            if (!database || !currentUser) return;
            database.ref('call_requests/' + currentUser.numericId).on('child_added', (snapshot) => {
                const data = snapshot.val();
                if (data && data.status === 'pending') {
                    showIncomingCall(snapshot.key, data);
                }
            });
        }

        // ============================================================
        // 📞 عرض إشعار المكالمة الواردة
        // ============================================================
        function showIncomingCall(callId, callData) {
            if (document.getElementById('incomingCall').classList.contains('active')) return;

            const callerName = callData.callerName || 'مستخدم';
            const type = callData.type || 'video';
            const typeText = type === 'video' ? '📹 مكالمة فيديو' : '🎧 مكالمة صوتية';

            document.getElementById('callerName').textContent = callerName;
            document.getElementById('callerType').textContent = typeText;
            document.getElementById('callerAvatar').textContent = callerName.charAt(0).toUpperCase();

            const incomingDiv = document.getElementById('incomingCall');
            incomingDiv.classList.add('active');
            incomingDiv.dataset.callId = callId;
            incomingDiv.dataset.callerId = callData.callerId;
            incomingDiv.dataset.callerPeerId = callData.peerId;
            incomingDiv.dataset.callType = type;

            playRingtone();

            let timer = 0;
            if (callTimerInterval) clearInterval(callTimerInterval);
            callTimerInterval = setInterval(() => {
                timer++;
                const mins = Math.floor(timer / 60);
                const secs = timer % 60;
                document.getElementById('callerTimer').textContent =
                    `⏱️ ${mins}:${secs.toString().padStart(2, '0')}`;
                if (timer > 60) {
                    rejectCall();
                }
            }, 1000);
        }

        // ============================================================
        // 🎵 رنين المكالمة
        // ============================================================
        function playRingtone() {
            try {
                const audio = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-phone-ringing-2874.mp3');
                audio.loop = true;
                audio.volume = 0.3;
                audio.play();
                window._ringtone = audio;
            } catch (e) {}
        }

        function stopRingtone() {
            try {
                if (window._ringtone) {
                    window._ringtone.pause();
                    window._ringtone = null;
                }
            } catch (e) {}
        }

        // ============================================================
        // ✅ قبول المكالمة
        // ============================================================
        function acceptCall() {
            const incomingDiv = document.getElementById('incomingCall');
            const callId = incomingDiv.dataset.callId;
            const callerId = incomingDiv.dataset.callerId;
            const callerPeerId = incomingDiv.dataset.callerPeerId;
            const type = incomingDiv.dataset.callType || 'video';

            stopRingtone();
            if (callTimerInterval) clearInterval(callTimerInterval);
            incomingDiv.classList.remove('active');

            database.ref('call_requests/' + currentUser.numericId + '/' + callId).update({
                status: 'accepted',
                acceptedAt: new Date().toISOString()
            });

            startCall(callerId, callerPeerId, type, false);
        }

        // ============================================================
        // ❌ رفض المكالمة
        // ============================================================
        function rejectCall() {
            const incomingDiv = document.getElementById('incomingCall');
            const callId = incomingDiv.dataset.callId;
            const callerId = incomingDiv.dataset.callerId;

            stopRingtone();
            if (callTimerInterval) clearInterval(callTimerInterval);
            incomingDiv.classList.remove('active');

            database.ref('call_requests/' + currentUser.numericId + '/' + callId).update({
                status: 'rejected',
                rejectedAt: new Date().toISOString()
            });

            setTimeout(() => {
                database.ref('call_requests/' + currentUser.numericId + '/' + callId).remove();
            }, 1000);

            showToast('❌ تم رفض المكالمة', 'warning');
        }

            isMatching = false;
            isWaitingForPartner = false;

            // إخفاء زر المطابقة
            document.getElementById('matchBtnContainer').classList.add('hidden');

            // إظهار واجهة المكالمة
            document.getElementById('videoContainer').classList.add('active');
            document.getElementById('callControls').classList.add('active');

            // جلب اسم الشريك
            database.ref('users')
                .orderByChild('numericId')
                .equalTo(parseInt(partnerId))
                .once('value')
                .then((snapshot) => {
                    if (snapshot.exists()) {
                        const userData = snapshot.val();
                        const userKey = Object.keys(userData)[0];
                        const user = userData[userKey];
                        callPartnerName = user.nickname || user.username || 'مستخدم';
                        document.getElementById('chatPartnerName').textContent = callPartnerName;
                        document.getElementById('remotePlaceholderName').textContent = callPartnerName;
                        document.getElementById('remotePlaceholderAvatar').textContent = callPartnerName.charAt(0)
                            .toUpperCase();
                    } else {
                        callPartnerName = 'مستخدم';
                        document.getElementById('chatPartnerName').textContent = callPartnerName;
                    }
                });

            // إخفاء البلاسهولدر المحلي
            document.getElementById('localPlaceholder').style.display = 'none';
            document.getElementById('localVideo').style.display = 'block';

            // إظهار حالة الاتصال
            document.getElementById('remotePlaceholder').style.display = 'flex';
            document.getElementById('remoteStatusText').textContent = '⏳ جاري الاتصال...';
            document.getElementById('remoteStatusText').className = 'status-text connecting';

            // الاتصال بالشريك
            if (peer && mediaStream) {
                const stream = mediaStream;
                if (type === 'audio') {
                    const videoTracks = stream.getVideoTracks();
                    videoTracks.forEach(t => t.enabled = false);
                }
                const call = peer.call(partnerPeerId, stream);
                call.on('stream', (remoteStream) => {
                    const remoteVideo = document.getElementById('remoteVideo');
                    remoteVideo.srcObject = remoteStream;
                    document.getElementById('remotePlaceholder').style.display = 'none';
                    remoteVideo.style.display = 'block';
                    document.getElementById('remoteStatus').classList.add('active');

                    document.getElementById('remoteStatusText').textContent = '🔴 جارية';
                    document.getElementById('remoteStatusText').className = 'status-text';
                });
                call.on('close', () => {
                    endCall();
                });
                call.on('error', (err) => {
                    console.error('Call error:', err);
                    showToast('❌ حدث خطأ في المكالمة', 'error');
                    endCall();
                });
                window._currentCall = call;
            }

            // بدء المؤقت
            callStartTime = Date.now();
            callDurationSeconds = 0;
            if (callTimerInterval) clearInterval(callTimerInterval);
            callTimerInterval = setInterval(() => {
                callDurationSeconds++;
                const mins = Math.floor(callDurationSeconds / 60);
                const secs = callDurationSeconds % 60;
                const timerDisplay = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                document.getElementById('chatTimer').textContent = timerDisplay;
            }, 1000);

            // فتح شات المكالمة
            if (!isCallChatOpen) {
                toggleCallChat();
            }

            // إضافة رسالة نظام
            addCallChatMessage('system', `🔗 تم الاتصال بـ ${callPartnerName || 'الشريك'}`);

            showToast(`✅ بدأت المكالمة مع ${callPartnerName || 'الشريك'}`, 'success');
        }

        // ============================================================
        // 🎯 بدء المطابقة العشوائية
        // ============================================================
        function startMatching() {
            if (isMatching || isCallActive) return;
            if (!isLoggedIn()) {
                showToast('⚠️ يرجى تسجيل الدخول أولاً', 'warning');
                return;
            }

            // التحقق من الرصيد
            if ((currentUser.balanceEGP || 0) < 10) {
                showToast('⚠️ رصيد غير كافٍ (تحتاج 10 ج.م للدقيقة)', 'warning');
                return;
            }

            isMatching = true;
            isWaitingForPartner = true;

            // تغيير شكل الزر
            const btn = document.getElementById('matchBtn');
            btn.classList.add('searching');
            btn.innerHTML = `
                <span class="btn-icon">🔍</span>
                <span class="btn-label">جاري البحث...</span>
                <span class="btn-sub">جارٍ العثور على شريك</span>
            `;

            // بدء مؤقت البحث
            matchStartTime = Date.now();
            if (matchCheckInterval) clearInterval(matchCheckInterval);
            matchCheckInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - matchStartTime) / 1000);
                if (elapsed > 30) {
                    clearInterval(matchCheckInterval);
                    showToast('⏰ لم يتم العثور على شريك، حاول مرة أخرى', 'warning');
                    resetMatchButton();
                    isMatching = false;
                    isWaitingForPartner = false;
                }
            }, 1000);

            // بدء البحث
            findRandomPartner();
        }

        // ============================================================
        // 🔍 البحث عن شريك عشوائي
        // ============================================================
        async function findRandomPartner() {
            if (!database || !currentUser || !isMatching) return;

            try {
                const snapshot = await database.ref('users').once('value');
                if (!snapshot.exists()) {
                    showToast('❌ لا يوجد مستخدمين متاحين', 'warning');
                    resetMatchButton();
                    isMatching = false;
                    isWaitingForPartner = false;
                    return;
                }

                const users = snapshot.val();
                const availableUsers = [];

                for (const key in users) {
                    const user = users[key];
                    const numericId = user.numericId;
                    if (numericId == currentUser.numericId) continue;
                    if (user.isBanned) continue;
                    const isOnline = user.isOnline === true;
                    const isInCall = user.inCall === true;
                    if (!isOnline || isInCall) continue;
                    const inCallSnapshot = await database.ref('active_calls/' + numericId).once('value');
                    if (inCallSnapshot.exists()) continue;

                    availableUsers.push({
                        numericId: numericId,
                        username: user.username,
                        nickname: user.nickname || user.username,
                        firebaseKey: key,
                        peerId: user.peerId || null
                    });
                }

                if (availableUsers.length === 0) {
                    showToast('❌ لا يوجد مستخدمين متاحين حالياً', 'warning');
                    resetMatchButton();
                    isMatching = false;
                    isWaitingForPartner = false;
                    return;
                }

                // اختيار مستخدم عشوائي
                const randomIndex = Math.floor(Math.random() * availableUsers.length);
                const partner = availableUsers[randomIndex];

                // التحقق من أن الشريك لا يزال متاحاً
                const partnerSnapshot = await database.ref('users')
                    .orderByChild('numericId')
                    .equalTo(partner.numericId)
                    .once('value');

                if (!partnerSnapshot.exists()) {
                    setTimeout(findRandomPartner, 1000);
                    return;
                }

                const partnerData = partnerSnapshot.val();
                const partnerKey = Object.keys(partnerData)[0];
                const partnerUser = partnerData[partnerKey];

                if (partnerUser.isBanned || partnerUser.inCall) {
                    setTimeout(findRandomPartner, 1000);
                    return;
                }

                // تحديث حالة المستخدم
                await database.ref('users/' + currentFirebaseUserId).update({
                    inCall: true,
                    callPartner: partner.numericId,
                    updatedAt: new Date().toISOString()
                });

                // إرسال طلب مكالمة مباشر بدون انتظار إشعار
                const callId = 'call_' + Date.now();
                const callType = 'video';

                // تسجيل المكالمة النشطة
                await database.ref('active_calls/' + currentUser.numericId).set({
                    partnerId: partner.numericId,
                    partnerName: partner.nickname || partner.username,
                    startTime: new Date().toISOString(),
                    callId: callId,
                    type: callType
                });

                // بدء المكالمة مباشرة
                document.getElementById('statusIcon').textContent = '📞';
                document.getElementById('statusText').textContent = 'جاري الاتصال...';
                document.getElementById('statusSub').textContent = `مع ${partner.nickname || partner.username}`;

                // بدء المكالمة مع الشريك
                startCall(partner.numericId, partnerUser.peerId || partner.peerId, callType, true);

                // تسجيل في سجل المكالمات
                await database.ref('call_history/' + currentUser.numericId).push({
                    partnerId: partner.numericId,
                    partnerName: partner.nickname || partner.username,
                    type: callType,
                    startTime: new Date().toISOString(),
                    status: 'initiated'
                });

                // تنظيف
                resetMatchButton();
                isMatching = false;
                isWaitingForPartner = false;

            } catch (error) {
                console.error('Find partner error:', error);
                showToast('❌ حدث خطأ', 'error');
                resetMatchButton();
                isMatching = false;
                isWaitingForPartner = false;
                await database.ref('users/' + currentFirebaseUserId).update({
                    inCall: false,
                    callPartner: null
                });
            }
        }

        // ============================================================
        // 📞 إنهاء المكالمة
        // ============================================================
        function endCall() {
            if (!isCallActive) {
                resetMatchButton();
                isMatching = false;
                isWaitingForPartner = false;
                document.getElementById('videoContainer').classList.remove('active');
                document.getElementById('callControls').classList.remove('active');
                document.getElementById('callChat').classList.remove('active');
                document.getElementById('matchBtnContainer').classList.remove('hidden');
                if (matchCheckInterval) clearInterval(matchCheckInterval);
                if (callTimerInterval) clearInterval(callTimerInterval);
                return;
            }

            isCallActive = false;
            isMatching = false;
            isWaitingForPartner = false;

            if (callTimerInterval) {
                clearInterval(callTimerInterval);
                callTimerInterval = null;
            }

            if (matchCheckInterval) {
                clearInterval(matchCheckInterval);
                matchCheckInterval = null;
            }

            stopRingtone();

            // حساب المدة والتكلفة
            const durationMinutes = Math.ceil(callDurationSeconds / 60);
            const cost = durationMinutes * 10;

            if (callDurationSeconds > 0 && currentUser) {
                const newBalance = (currentUser.balanceEGP || 0) - cost;
                if (newBalance >= 0) {
                    database.ref('users/' + currentFirebaseUserId + '/balanceEGP').set(newBalance);
                    currentUser.balanceEGP = newBalance;
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    showToast(`💰 تم خصم ${cost} جنيه مقابل ${durationMinutes} دقيقة`, 'info');
                }
            }

            if (window._currentCall) {
                try {
                    window._currentCall.close();
                } catch (e) {}
                window._currentCall = null;
            }

            if (database && currentFirebaseUserId) {
                database.ref('users/' + currentFirebaseUserId).update({
                    inCall: false,
                    callPartner: null,
                    isMuted: true,
                    isVideoOff: false,
                    updatedAt: new Date().toISOString()
                });
            }

            if (database && currentUser) {
                database.ref('active_calls/' + currentUser.numericId).remove();
            }

            if (database && currentUser && callPartnerId) {
                database.ref('call_history/' + currentUser.numericId).push({
                    partnerId: callPartnerId,
                    partnerName: callPartnerName || 'شريك',
                    type: callType || 'video',
                    duration: callDurationSeconds,
                    cost: cost,
                    endTime: new Date().toISOString(),
                    status: 'completed'
                });
            }

            // إعادة تعيين المتغيرات
            callPartnerId = null;
            callPartnerPeerId = null;
            callPartnerName = null;
            callDurationSeconds = 0;

            // إخفاء واجهة المكالمة
            document.getElementById('videoContainer').classList.remove('active');
            document.getElementById('callControls').classList.remove('active');
            document.getElementById('callChat').classList.remove('active');
            document.getElementById('matchBtnContainer').classList.remove('hidden');

            // إعادة تعيين حالة الفيديو
            document.getElementById('localVideo').style.display = 'block';
            document.getElementById('localPlaceholder').style.display = 'none';
            document.getElementById('remoteVideo').style.display = 'none';
            document.getElementById('remotePlaceholder').style.display = 'flex';
            document.getElementById('remoteStatusText').textContent = '🔍 جاري البحث...';
            document.getElementById('remoteStatusText').className = 'status-text';
            document.getElementById('remoteStatus').classList.remove('active');

            // إعادة ضبط أزرار
            document.getElementById('micBtn').className = 'call-btn mic-btn';
            document.getElementById('micBtn').innerHTML = '<i class="fas fa-microphone"></i> ميكروفون';
            document.getElementById('videoBtn').className = 'call-btn video-btn';
            document.getElementById('videoBtn').innerHTML = '<i class="fas fa-video"></i> كاميرا';
            document.getElementById('localMuteIndicator').style.display = 'none';
            document.getElementById('chatTimer').textContent = '00:00';

            resetMatchButton();

            // إعادة تهيئة PeerJS
            setTimeout(() => {
                if (mediaStream) {
                    mediaStream.getTracks().forEach(t => t.stop());
                    mediaStream = null;
                }
                initMedia();
                initPeerJS();
            }, 1000);

            showToast('📞 تم إنهاء المكالمة', 'info');
        }

        function toggleCallChat() {
            isCallChatOpen = !isCallChatOpen;
            const chat = document.getElementById('callChat');
            const btn = document.getElementById('chatToggleBtn');
            if (isCallChatOpen) {
                chat.classList.add('active');
                btn.classList.add('active');
                btn.innerHTML = '<i class="fas fa-comment"></i> شات';
                setTimeout(scrollChatToBottom, 100);
            } else {
                chat.classList.remove('active');
                btn.classList.remove('active');
            }

        function scrollChatToBottom() {
            const container = document.getElementById('callChatMessages');
            if (container) {
                container.scrollTop = container.scrollHeight;
            }
        }

        function addCallChatMessage(type, text, sender = null) {
            const container = document.getElementById('callChatMessages');
            const msg = document.createElement('div');
            msg.className = `msg ${type === 'own' ? 'own' : type === 'other' ? 'other' : 'system'}`;

            if (type === 'system') {
                msg.textContent = text;
            } else {
                const senderName = type === 'own' ? 'أنت' : (sender || callPartnerName || 'شريك');
                msg.innerHTML = `
                    <div class="sender">${senderName}</div>
                    <div>${text}</div>
                `;
            }

            container.appendChild(msg);
            scrollChatToBottom();
        }

        function sendCallChatMessage() {
            const input = document.getElementById('callChatInput');
            const text = input.value.trim();
            if (!text || !isCallActive) return;

            addCallChatMessage('own', text);
            input.value = '';

            if (database && callPartnerId) {
                const chatRef = database.ref('chat_messages/' + callPartnerId);
                chatRef.push({
                    senderId: currentUser.numericId,
                    senderName: currentUser.nickname || currentUser.username || 'مستخدم',
                    text: text,
                    type: 'call_chat',
                    timestamp: new Date().toISOString()
                });
            }
        }

        function listenForCallChatMessages() {
            if (!database || !currentUser) return;

            database.ref('chat_messages/' + currentUser.numericId).on('child_added', (snapshot) => {
                const msg = snapshot.val();
                if (msg && msg.senderId != currentUser.numericId && isCallActive) {
                    addCallChatMessage('other', msg.text, msg.senderName);
                }
            });
        }

        function selectCallGift(giftId) {
            document.querySelectorAll('.gift-option').forEach(el => el.classList.remove('selected'));
            const selected = document.querySelector(`.gift-option[data-gift-id="${giftId}"]`);
            if (selected) {

                selectedCallGift = CALL_GIFTS.find(g => g.id === giftId);

        async function sendCallGift() {
            if (!selectedCallGift) {
                showToast('⚠️ اختر هدية أولاً', 'warning');
                return;
            }

            if (!currentUser) {
                showToast('⚠️ يرجى تسجيل الدخول', 'warning');
                return;
            }

            if (currentUser.balanceEGP < selectedCallGift.price) {
                showToast(`⚠️ رصيد غير كافٍ (تحتاج ${selectedCallGift.price} ج.م)`, 'warning');
                return;
            }

            if (!callPartnerId) {
                showToast('❌ لا يوجد شريك في المكالمة', 'error');
                return;
            }

            try {
                const newBalance = (currentUser.balanceEGP || 0) - selectedCallGift.price;
                await database.ref('users/' + currentFirebaseUserId + '/balanceEGP').set(newBalance);
                currentUser.balanceEGP = newBalance;
                localStorage.setItem('currentUser', JSON.stringify(currentUser));

                await database.ref('users')
                    .orderByChild('numericId')
                    .equalTo(parseInt(callPartnerId))
                    .once('value')
                    .then(async (snapshot) => {
                        if (snapshot.exists()) {
                            const userData = snapshot.val();
                            const userKey = Object.keys(userData)[0];
                            const user = userData[userKey];

                            const giftsList = user.giftsList || [];
                            const giftEntry = {
                                senderId: currentUser.numericId,
                                senderName: currentUser.nickname || currentUser.username || 'مستخدم',
                                giftType: selectedCallGift.id,
                                giftName: selectedCallGift.name,
                                giftEmoji: selectedCallGift.emoji,
                                value: selectedCallGift.price,
                                date: new Date().toLocaleString('ar-EG'),
                                timestamp: new Date().toISOString(),
                                fromCall: true,
                                _shown: false
                            };
                            giftsList.push(giftEntry);

                            await database.ref('users/' + userKey).update({
                                giftsList: giftsList,
                                gifts: (user.gifts || 0) + 1,
                                updatedAt: new Date().toISOString()
                            });

                            // إرسال إشعار للشريك (عبر push notification)
                            await database.ref('users/' + userKey + '/notifications').push({
                                id: Date.now(),
                                text: `🎁 تلقيت ${selectedCallGift.emoji} ${selectedCallGift.name} من ${currentUser.nickname || currentUser.username} أثناء المكالمة! 💰 ${selectedCallGift.price} ج.م`,
                                read: false,
                                date: new Date().toLocaleString('ar-EG'),
                                type: 'gift_received',
                                createdAt: new Date().toISOString(),
                                giftEmoji: selectedCallGift.emoji,
                                giftName: selectedCallGift.name,
                                giftPrice: selectedCallGift.price,
                                senderName: currentUser.nickname || currentUser.username || 'مستخدم'
                            });

                            // عرض الهدية للشريك فوراً
                            showFloatingNotification({
                                emoji: selectedCallGift.emoji,
                                name: selectedCallGift.name,
                                price: selectedCallGift.price,
                                senderName: currentUser.nickname || currentUser.username || 'مستخدم'
                            });
                        }
                    });

                showToast(`✅ تم إرسال ${selectedCallGift.emoji} ${selectedCallGift.name}`, 'success');
                addCallChatMessage('system', `🎁 ${currentUser.nickname || currentUser.username} أرسل ${selectedCallGift.emoji} ${selectedCallGift.name}`);

                closeCallGiftModal();

            } catch (error) {
                console.error('Send gift error:', error);
                showToast('❌ حدث خطأ', 'error');
            }
        }

        // ============================================================
        // 🎁 إشعار الهدية العائم (يظهر مرة واحدة فقط)
        // ============================================================
        function showFloatingNotification(giftData) {
            // إنشاء معرف فريد للهدية
            const giftId = `${giftData.senderName}_${giftData.name}_${Date.now()}`;

            // التحقق من عدم ظهور هذه الهدية من قبل
            if (shownGiftIds.has(giftId)) {
                console.log('⚠️ هذه الهدية ظهرت من قبل، تم تجاهلها');
                return;
            }

            // إضافة المعرف إلى القائمة
            shownGiftIds.add(giftId);

            const notif = document.getElementById('floatingNotif');
            document.getElementById('notifBody').innerHTML = `
                <span class="gift-emoji">${giftData.emoji || '🎁'}</span>
                تلقيت <span class="gift-name">${giftData.name || 'هدية'}</span>
                بقيمة <span class="gift-value">${giftData.price || 0}</span> ج.م
                من <span style="font-weight:700;color:#ffd700;">${giftData.senderName || 'مستخدم'}</span>
            `;
            document.getElementById('notifTime').textContent = new Date().toLocaleTimeString('ar-EG');

            notif.classList.add('active');

            // اختفاء تلقائي بعد 6 ثواني
            setTimeout(() => {
                closeFloatingNotif();
            }, 6000);
        }

        function closeFloatingNotif() {
            document.getElementById('floatingNotif').classList.remove('active');
        }

        // ============================================================
        // 📨 الاستماع للهدايا الواردة (من Firebase)
        // ============================================================
        function listenForIncomingGifts() {
            if (!database || !currentUser) return;

            database.ref('users/' + currentFirebaseUserId + '/giftsList').on('child_added', (snapshot) => {
                const gift = snapshot.val();
                // التحقق من أن الهدية من مكالمة ولم تظهر من قبل
                if (gift && gift.fromCall && !gift._shown) {
                    // تحديث الحالة في Firebase لمنع التكرار
                    const giftKey = snapshot.key;
                    database.ref('users/' + currentFirebaseUserId + '/giftsList/' + giftKey + '/_shown').set(true);

                    // عرض الإشعار
                    showFloatingNotification({
                        emoji: gift.giftEmoji || '🎁',
                        name: gift.giftName || 'هدية',
                        price: gift.value || 0,
                        senderName: gift.senderName || 'مستخدم'
                    });
                }
            });
        }

        // ============================================================
        // 🎙️ تهيئة الصوت والفيديو
        // ============================================================
        async function initMedia() {
            try {
                const constraints = {
                    audio: { echoCancellation: true, noiseSuppression: true },
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }
                };

                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                mediaStream = stream;

                const localVideo = document.getElementById('localVideo');
                localVideo.srcObject = stream;

                stream.getAudioTracks().forEach(track => track.enabled = false);
                isMicMuted = true;

                document.getElementById('micBtn').className = 'call-btn mic-btn muted';
                document.getElementById('micBtn').innerHTML = '<i class="fas fa-microphone-slash"></i> مكتوم';
                document.getElementById('localMuteIndicator').style.display = 'block';

                document.getElementById('localPlaceholder').style.display = 'none';
                document.getElementById('localVideo').style.display = 'block';

                console.log('✅ Media initialized');
                return true;
            } catch (error) {
                console.error('❌ Media error:', error);
                showToast('⚠️ تعذر الوصول إلى الكاميرا أو الميكروفون', 'warning');

                try {
                    const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaStream = audioStream;
                    const localVideo = document.getElementById('localVideo');
                    localVideo.srcObject = audioStream;
                    audioStream.getAudioTracks().forEach(track => track.enabled = false);
                    isMicMuted = true;
                    document.getElementById('micBtn').className = 'call-btn mic-btn muted';
                    document.getElementById('micBtn').innerHTML = '<i class="fas fa-microphone-slash"></i> مكتوم';
                    document.getElementById('localMuteIndicator').style.display = 'block';
                    document.getElementById('videoBtn').style.display = 'none';
                    document.getElementById('localPlaceholder').style.display = 'none';
                    document.getElementById('localVideo').style.display = 'block';
                    return true;
                } catch (e2) {
                    showToast('❌ لا يمكن الوصول إلى الميكروفون', 'error');
                    return false;
                }
            }
        }

        // ============================================================
        // 🚪 تسجيل الخروج
        // ============================================================
        async function logout() {
            if (isCallActive) endCall();
            try { if (firebase.auth) await firebase.auth().signOut(); } catch (e) {}
            localStorage.removeItem('currentUser');
            window.location.reload();
        }

        // ============================================================
        // 👥 تحديث طلبات الصداقة
        // ============================================================
        async function updateFriendRequestsBadge() {
            if (!database || !currentUser) return;

            try {
                const snapshot = await database.ref('users/' + currentFirebaseUserId + '/friendRequests').once('value');
                let count = 0;
                if (snapshot.exists()) {
                    const requests = snapshot.val();
                    for (const key in requests) {
                        if (requests[key].status === 'pending') count++;
                    }
                }
                document.getElementById('friendRequestsBadge').textContent = count;
                document.getElementById('bottomFriendBadge').textContent = count;
            } catch (e) {}
        }

        // ============================================================
        // 🚀 التهيئة
        // ============================================================
        window.onload = async function() {
            await initializeFirebase();

            const user = await getCurrentUserFullData();
            if (user) {
                currentUser = user;
                currentFirebaseUserId = user.firebaseKey;
                console.log('✅ User loaded:', user.nickname || user.username);

                if (database && currentFirebaseUserId) {
                    database.ref('users/' + currentFirebaseUserId).update({
                        isOnline: true,
                        lastActive: new Date().toISOString()
                    });

                    window.addEventListener('beforeunload', function() {
                        database.ref('users/' + currentFirebaseUserId).update({
                            isOnline: false
                        });
                        if (isCallActive) endCall();
                    });
                }
            } else {
                showToast('⚠️ يرجى تسجيل الدخول أولاً', 'warning');
                setTimeout(() => window.location.href = 'login.html', 2000);
                return;
            }

            const mediaReady = await initMedia();

            if (mediaReady) {
                initPeerJS();
                listenForCallChatMessages();
                listenForIncomingGifts();
                updateFriendRequestsBadge();

                document.getElementById('matchBtnContainer').classList.remove('hidden');
            }

            if (window.innerWidth <= 768) {
                document.getElementById('bottomNav').style.display = 'flex';
            }
        };

        // ============================================================
        // 🧹 تنظيف عند الخروج
        // ============================================================
        window.addEventListener('beforeunload', function() {
            if (isCallActive) endCall();
            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
            }
            if (database && currentFirebaseUserId) {
                database.ref('users/' + currentFirebaseUserId).update({
                    isOnline: false,
                    inCall: false
                });
            }
            if (peer) {
                try { peer.destroy(); } catch (e) {}
            }
            stopRingtone();
        });
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js">
    </script>
</body>
