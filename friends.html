<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👥 الأصدقاء - كوكبة</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <style>
        /* ===== أنماط خاصة بصفحة الأصدقاء ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0a0a1a, #1a1040, #0f0c29);
            min-height: 100vh;
            color: white;
            display: flex;
            flex-direction: column;
        }

        /* ===== شريط التنقل ===== */
        .navbar {
            background: rgba(10, 10, 30, 0.95);
            backdrop-filter: blur(15px);
            padding: 0.6rem 4%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(255, 215, 0, 0.15);
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 65px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 800;
            color: #ffd700;
            text-decoration: none;
        }

        .logo i {
            font-size: 1.5rem;
        }

        .nav-icons {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nav-btn {
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: #f8fafc;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.8rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }

        .nav-btn:hover {
            background: #8b5cf6;
            border-color: #8b5cf6;
            transform: translateY(-2px);
        }

        .nav-btn.active {
            background: #8b5cf6;
            border-color: #8b5cf6;
        }

        .nav-btn .badge {
            background: #ef4444;
            color: white;
            font-size: 0.6rem;
            padding: 1px 6px;
            border-radius: 50%;
            min-width: 18px;
            text-align: center;
        }

        /* ===== المحتوى الرئيسي ===== */
        .main-container {
            flex: 1;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        /* ===== التبويبات ===== */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 15px;
        }

        .tab-btn {
            padding: 10px 24px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.02);
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        .tab-btn.active {
            background: rgba(139, 92, 246, 0.2);
            border-color: rgba(139, 92, 246, 0.3);
            color: #a78bfa;
        }

        .tab-btn .count {
            background: rgba(255, 255, 255, 0.1);
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 0.7rem;
            color: #94a3b8;
        }

        .tab-btn.active .count {
            background: rgba(139, 92, 246, 0.3);
            color: #a78bfa;
        }

        /* ===== محتوى التبويبات ===== */
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== بطاقات المستخدمين ===== */
        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }

        .user-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 18px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s ease;
        }

        .user-card:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(139, 92, 246, 0.2);
            transform: translateY(-2px);
        }

        .user-card .avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
            background: linear-gradient(135deg, #4f46e5, #8b5cf6);
        }

        .user-card .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .user-card .info {
            flex: 1;
            min-width: 0;
        }

        .user-card .info .name {
            font-weight: 700;
            font-size: 1rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .user-card .info .name .vip-badge {
            font-size: 0.6rem;
            background: linear-gradient(135deg, #ffd700, #f59e0b);
            color: #1a1a2e;
            padding: 1px 6px;
            border-radius: 6px;
            font-weight: 700;
        }

        .user-card .info .username {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 2px;
        }

        .user-card .info .status {
            font-size: 0.65rem;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .user-card .info .status.online {
            color: #10b981;
        }

        .user-card .info .status.offline {
            color: #666;
        }

        .user-card .actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .user-card .actions button {
            padding: 6px 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .user-card .actions .btn-accept {
            background: #10b981;
            color: white;
        }

        .user-card .actions .btn-accept:hover {
            background: #059669;
            transform: scale(1.05);
        }

        .user-card .actions .btn-reject {
            background: #ef4444;
            color: white;
        }

        .user-card .actions .btn-reject:hover {
            background: #dc2626;
            transform: scale(1.05);
        }

        .user-card .actions .btn-add {
            background: #8b5cf6;
            color: white;
        }

        .user-card .actions .btn-add:hover {
            background: #7c3aed;
            transform: scale(1.05);
        }

        .user-card .actions .btn-add.added {
            background: #10b981;
            cursor: default;
        }

        .user-card .actions .btn-add.added:hover {
            transform: none;
        }

        .user-card .actions .btn-remove {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.1);
        }

        .user-card .actions .btn-remove:hover {
            background: rgba(239, 68, 68, 0.25);
            transform: scale(1.05);
        }

        .user-card .actions .btn-call {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.1);
        }

        .user-card .actions .btn-call:hover {
            background: rgba(16, 185, 129, 0.25);
            transform: scale(1.05);
        }

        .user-card .actions .btn-chat {
            background: rgba(59, 130, 246, 0.15);
            color: #3b82f6;
            border: 1px solid rgba(59, 130, 246, 0.1);
        }

        .user-card .actions .btn-chat:hover {
            background: rgba(59, 130, 246, 0.25);
            transform: scale(1.05);
        }

        /* ===== رسالة فارغة ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }

        .empty-state .icon {
            font-size: 4rem;
            margin-bottom: 15px;
            display: block;
            opacity: 0.3;
        }

        .empty-state h3 {
            color: #fff;
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 0.9rem;
        }

        /* ===== شريط البحث ===== */
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-bar input {
            flex: 1;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            color: white;
            font-size: 0.9rem;
            outline: none;
            min-width: 200px;
        }

        .search-bar input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .search-bar input:focus {
            border-color: rgba(139, 92, 246, 0.3);
        }

        .search-bar .filter-btns {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .search-bar .filter-btns button {
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.02);
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .search-bar .filter-btns button:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        .search-bar .filter-btns button.active {
            background: rgba(139, 92, 246, 0.2);
            border-color: rgba(139, 92, 246, 0.3);
            color: #a78bfa;
        }

        /* ===== توست ===== */
        .toast {
            position: fixed;
            top: 80px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            z-index: 100000;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            animation: slideIn 0.3s ease;
            max-width: 320px;
            font-size: 0.85rem;
            backdrop-filter: blur(10px);
        }

        .toast.success {
            background: rgba(16, 185, 129, 0.9);
        }
        .toast.error {
            background: rgba(239, 68, 68, 0.9);
        }
        .toast.warning {
            background: rgba(245, 158, 11, 0.9);
        }
        .toast.info {
            background: rgba(59, 130, 246, 0.9);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* ===== تحميل ===== */
        .loading-spinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 40px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.03);
            border-top: 3px solid #8b5cf6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        /* ===== استجابة ===== */
        @media (max-width: 768px) {
            .navbar {
                padding: 0.6rem 2%;
            }
            .logo {
                font-size: 0.9rem;
            }
            .logo i {
                font-size: 1.2rem;
            }
            .nav-btn {
                padding: 6px 12px;
                font-size: 0.7rem;
            }
            .tabs {
                gap: 6px;
            }
            .tab-btn {
                padding: 8px 14px;
                font-size: 0.75rem;
            }
            .users-grid {
                grid-template-columns: 1fr;
            }
            .user-card {
                padding: 14px;
                flex-wrap: wrap;
            }
            .user-card .actions {
                width: 100%;
                justify-content: flex-start;
            }
            .search-bar {
                flex-direction: column;
            }
            .search-bar .filter-btns {
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .user-card .avatar {
                width: 45px;
                height: 45px;
                font-size: 1.2rem;
            }
            .user-card .info .name {
                font-size: 0.85rem;
            }
            .user-card .actions button {
                padding: 4px 10px;
                font-size: 0.6rem;
            }
            .tab-btn {
                padding: 6px 10px;
                font-size: 0.65rem;
            }
        }

        /* ===== شريط التنقل السفلي ===== */
        .bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 10, 30, 0.95);
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255, 215, 0, 0.1);
            padding: 8px;
            justify-content: space-around;
            z-index: 99;
        }

        .bottom-nav .nav-btn {
            flex: 1;
            justify-content: center;
            padding: 8px 0;
            font-size: 0.7rem;
            flex-direction: column;
            gap: 2px;
        }

        .bottom-nav .nav-btn i {
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            .bottom-nav {
                display: flex;
            }
            .main-container {
                padding-bottom: 80px;
            }
        }
    </style>
</head>
<body>
    <!-- ===== شريط التنقل ===== -->
    <nav class="navbar">
        <a href="index.html" class="logo">
            <i class="fas fa-comet"></i>
            كوكبة
        </a>
        <div class="nav-icons">
            <a href="match.html" class="nav-btn">
                <i class="fas fa-random"></i> مطابقة
            </a>
            <a href="friends.html" class="nav-btn active">
                <i class="fas fa-user-friends"></i> أصدقاء
                <span class="badge" id="friendRequestsBadge">0</span>
            </a>
            <a href="profile.html" class="nav-btn">
                <i class="fas fa-user-circle"></i> حسابي
            </a>
            <button class="nav-btn" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </nav>

    <!-- ===== المحتوى الرئيسي ===== -->
    <div class="main-container">
        <!-- ===== التبويبات ===== -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('friends')" id="tabFriends">
                <i class="fas fa-user-friends"></i> الأصدقاء
                <span class="count" id="friendsCount">0</span>
            </button>
            <button class="tab-btn" onclick="switchTab('requests')" id="tabRequests">
                <i class="fas fa-user-plus"></i> طلبات الصداقة
                <span class="count" id="requestsCount">0</span>
            </button>
            <button class="tab-btn" onclick="switchTab('suggestions')" id="tabSuggestions">
                <i class="fas fa-users"></i> اقتراحات
                <span class="count" id="suggestionsCount">0</span>
            </button>
            <button class="tab-btn" onclick="switchTab('blocked')" id="tabBlocked">
                <i class="fas fa-ban"></i> المحظورين
                <span class="count" id="blockedCount">0</span>
            </button>
        </div>

        <!-- ===== شريط البحث ===== -->
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 ابحث عن مستخدم..." oninput="filterUsers()">
            <div class="filter-btns">
                <button class="active" onclick="setFilter('all')" data-filter="all">الكل</button>
                <button onclick="setFilter('online')" data-filter="online">🟢 متصل</button>
                <button onclick="setFilter('offline')" data-filter="offline">⚪ غير متصل</button>
            </div>
        </div>

        <!-- ===== تبويب الأصدقاء ===== -->
        <div class="tab-content active" id="friendsTab">
            <div id="friendsList">
                <div class="loading-spinner">
                    <div class="spinner"></div>
                    <p style="color:#94a3b8;">جاري تحميل الأصدقاء...</p>
                </div>
            </div>
        </div>

        <!-- ===== تبويب الطلبات ===== -->
        <div class="tab-content" id="requestsTab">
            <div id="requestsList">
                <div class="loading-spinner">
                    <div class="spinner"></div>
                    <p style="color:#94a3b8;">جاري تحميل الطلبات...</p>
                </div>
            </div>
        </div>

        <!-- ===== تبويب الاقتراحات ===== -->
        <div class="tab-content" id="suggestionsTab">
            <div id="suggestionsList">
                <div class="loading-spinner">
                    <div class="spinner"></div>
                    <p style="color:#94a3b8;">جاري تحميل الاقتراحات...</p>
                </div>
            </div>
        </div>

        <!-- ===== تبويب المحظورين ===== -->
        <div class="tab-content" id="blockedTab">
            <div id="blockedList">
                <div class="loading-spinner">
                    <div class="spinner"></div>
                    <p style="color:#94a3b8;">جاري تحميل المحظورين...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== شريط التنقل السفلي ===== -->
    <div class="bottom-nav">
        <a href="match.html" class="nav-btn">
            <i class="fas fa-random"></i>
            مطابقة
        </a>
        <a href="friends.html" class="nav-btn active">
            <i class="fas fa-user-friends"></i>
            أصدقاء
            <span class="badge" id="bottomFriendBadge">0</span>
        </a>
        <a href="profile.html" class="nav-btn">
            <i class="fas fa-user-circle"></i>
            حسابي
        </a>
    </div>

    <script>
        // ============================================================
        // 🔥 FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAX0jz_yOGagteO5R5ZHji1ZG44fk--Zvs",
            authDomain: "stvipclub.firebaseapp.com",
            databaseURL: "https://stvipclub-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "stvipclub",
            storageBucket: "stvipclub.firebasestorage.app",
            messagingSenderId: "526607326044",
            appId: "1:526607326044:web:6af53db123ae02c7193f99",
            measurementId: "G-QZQMQCH9N9"
        };

        // ============================================================
        // 📋 المتغيرات العامة
        // ============================================================
        let database;
        let currentUser = null;
        let currentFirebaseUserId = null;
        let allFriends = [];
        let allRequests = [];
        let allSuggestions = [];
        let allBlocked = [];
        let currentFilter = 'all';
        let searchQuery = '';

        // ============================================================
        // 🍞 توست
        // ============================================================
        function showToast(message, type = 'info') {
            const colors = {
                success: 'rgba(16,185,129,0.9)',
                error: 'rgba(239,68,68,0.9)',
                warning: 'rgba(245,158,11,0.9)',
                info: 'rgba(59,130,246,0.9)'
            };
            const old = document.querySelector('.toast');
            if (old) old.remove();
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.style.background = colors[type] || colors.info;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(30px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // ============================================================
        // 🔥 تهيئة Firebase
        // ============================================================
        async function initializeFirebase() {
            try {
                if (firebase.apps.length > 0) await firebase.app().delete();
                firebase.initializeApp(firebaseConfig);
                database = firebase.database();
                console.log('✅ Firebase initialized');
            } catch (error) {
                console.error('❌ Firebase error:', error);
            }
        }

        // ============================================================
        // 👤 المستخدم
        // ============================================================
        function getStoredUser() {
            try { return JSON.parse(localStorage.getItem('currentUser')); } catch (e) { return null; }
        }

        function isLoggedIn() { return getStoredUser() !== null; }

        function generateNumericId() { return Math.floor(100000 + Math.random() * 900000); }

        async function getCurrentUserFullData() {
            try {
                const stored = getStoredUser();
                if (!stored) return null;
                if (!database) return stored;
                const numericId = stored.numericId || generateNumericId();
                if (!stored.numericId) {
                    stored.numericId = numericId;
                    localStorage.setItem('currentUser', JSON.stringify(stored));
                }
                const snapshot = await database.ref('users')
                    .orderByChild('numericId')
                    .equalTo(numericId)
                    .once('value');
                if (snapshot.exists()) {
                    const userData = snapshot.val();
                    const firebaseKey = Object.keys(userData)[0];
                    const fullUser = userData[firebaseKey];
                    const merged = { ...stored, ...fullUser, numericId: numericId, firebaseKey: firebaseKey };
                    localStorage.setItem('currentUser', JSON.stringify(merged));
                    currentFirebaseUserId = firebaseKey;
                    return merged;
                }
                return stored;
            } catch (e) { return getStoredUser(); }
        }

        // ============================================================
        // 📊 تحميل البيانات
        // ============================================================
        async function loadAllData() {
            if (!database || !currentUser) return;

            try {
                // تحميل الأصدقاء
                await loadFriends();
                // تحميل الطلبات
                await loadRequests();
                // تحميل الاقتراحات
                await loadSuggestions();
                // تحميل المحظورين
                await loadBlocked();

                // تحديث العدادات

                const snapshot = await database.ref('users/' + currentFirebaseUserId + '/friends').once('value');

                    const friendsData = snapshot.val();
                    for (const key in friendsData) {

                        if (userSnapshot.exists()) {
                            const userData = userSnapshot.val();

                            allFriends.push({

        // ============================================================
        // 💡 تحميل الاقتراحات
        // ============================================================
        async function loadSuggestions() {
            try {
                // جلب جميع المستخدمين
                const snapshot = await database.ref('users').once('value');
                allSuggestions = [];

                if (snapshot.exists()) {
                    const usersData = snapshot.val();
                    const friendIds = allFriends.map(f => f.numericId);
                    const blockedIds = allBlocked.map(b => b.numericId);

                    for (const key in usersData) {
                        const user = usersData[key];
                        const numericId = user.numericId;

                        // تجاهل المستخدم نفسه
                        if (numericId == currentUser.numericId) continue;
                        // تجاهل الأصدقاء
                        if (friendIds.includes(numericId)) continue;
                        // تجاهل المحظورين
                        if (blockedIds.includes(numericId)) continue;
                        // تجاهل المستخدمين المحظورين
                        if (user.isBanned) continue;

                        allSuggestions.push({
                            numericId: numericId,
                            username: user.username || 'مستخدم',
                            nickname: user.nickname || user.username || 'مستخدم',
                            avatar: user.avatar || null,
                            isOnline: user.isOnline || false,
                            vip: user.vip || null,
                            firebaseKey: key,
                            isFriend: false,
                            hasPendingRequest: false
                        });
                    }

                    // التحقق من الطلبات المعلقة
                    const requestIds = allRequests.map(r => r.numericId);
                    allSuggestions = allSuggestions.map(s => {
                        s.hasPendingRequest = requestIds.includes(s.numericId);
                        return s;
                    });

                    // ترتيب عشوائي
                    allSuggestions = allSuggestions.sort(() => Math.random() - 0.5);
                }

            } catch (error) {
                console.error('Error loading suggestions:', error);
            }
        }

            // إظهار المختار
            document.getElementById(tab + 'Tab').classList.add('active');
            document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');

            // تحديث البيانات إذا لزم الأمر
            if (tab === 'requests') {
                loadRequests().then(() => {
                    renderRequests();
                    updateCounts();
                });
            } else if (tab === 'suggestions') {
                loadSuggestions().then(() => {
                    renderSuggestions();
                    updateCounts();
                });
            } else if (tab === 'blocked') {
                loadBlocked().then(() => {
                    renderBlocked();
                    updateCounts();
                });

        // ============================================================
        // 👤 إرسال طلب صداقة
        // ============================================================
        async function sendFriendRequest(targetId) {
            if (!database || !currentUser) {
                showToast('⚠️ يرجى تسجيل الدخول أولاً', 'warning');
                return;
            }

            try {
                // التحقق من أن المستخدم موجود
                const targetSnapshot = await database.ref('users')
                    .orderByChild('numericId')
                    .equalTo(parseInt(targetId))
                    .once('value');

                if (!targetSnapshot.exists()) {
                    showToast('❌ المستخدم غير موجود', 'error');
                    return;
                }

                const targetData = targetSnapshot.val();
                const targetKey = Object.keys(targetData)[0];
                const targetUser = targetData[targetKey];

                if (targetUser.isBanned) {
                    showToast('⚠️ هذا المستخدم محظور', 'warning');
                    return;
                }

                // التحقق من أن المستخدم ليس صديقاً بالفعل
                const friendCheck = await database.ref('users/' + currentFirebaseUserId + '/friends/' + targetId).once('value');
                if (friendCheck.exists()) {
                    showToast('⚠️ هذا المستخدم صديق بالفعل', 'warning');
                    return;
                }

                // التحقق من وجود طلب مسبق
                const requestCheck = await database.ref('users/' + targetKey + '/friendRequests/' + currentUser.numericId).once('value');
                if (requestCheck.exists()) {
                    const requestData = requestCheck.val();
                    if (requestData.status === 'pending') {
                        showToast('⏳ تم إرسال طلب صداقة مسبقاً', 'info');
                        return;
                    }
                }

                // إرسال الطلب
                await database.ref('users/' + targetKey + '/friendRequests/' + currentUser.numericId).set({
                    status: 'pending',
                    requestedAt: new Date().toISOString(),
                    message: '',
                    senderName: currentUser.nickname || currentUser.username || 'مستخدم',
                    senderId: currentUser.numericId
                });

                // إضافة إشعار للمستقبل
                await database.ref('users/' + targetKey + '/notifications').push({
                    id: Date.now(),
                    text: `👤 ${currentUser.nickname || currentUser.username} أرسل لك طلب صداقة!`,
                    read: false,
                    date: new Date().toLocaleString('ar-EG'),
                    type: 'friend_request',
                    createdAt: new Date().toISOString()
                });

                showToast('✅ تم إرسال طلب الصداقة', 'success');

                // تحديث القوائم
                await loadSuggestions();
                renderSuggestions();
                updateCounts();

            } catch (error) {
                console.error('Error sending friend request:', error);
                showToast('❌ حدث خطأ', 'error');
            }
        }

        // ============================================================
        // ✅ قبول طلب صداقة
        // ============================================================
        async function acceptFriendRequest(senderId) {
            if (!database || !currentUser) return;

            try {
                // جلب بيانات المرسل
                const senderSnapshot = await database.ref('users')
                    .orderByChild('numericId')
                    .equalTo(parseInt(senderId))
                    .once('value');

                if (!senderSnapshot.exists()) {
                    showToast('❌ المستخدم غير موجود', 'error');
                    return;
                }

                const senderData = senderSnapshot.val();
                const senderKey = Object.keys(senderData)[0];
                const senderUser = senderData[senderKey];

                // إضافة الصديقين لبعضهما البعض
                await database.ref('users/' + currentFirebaseUserId + '/friends/' + senderId).set({
                    addedAt: new Date().toISOString()
                });

                await database.ref('users/' + senderKey + '/friends/' + currentUser.numericId).set({
                    addedAt: new Date().toISOString()
                });

                // حذف الطلب
                await database.ref('users/' + currentFirebaseUserId + '/friendRequests/' + senderId).remove();

                // إشعار للمرسل
                await database.ref('users/' + senderKey + '/notifications').push({
                    id: Date.now(),
                    text: `✅ ${currentUser.nickname || currentUser.username} قبل طلب صداقتك!`,
                    read: false,
                    date: new Date().toLocaleString('ar-EG'),
                    type: 'friend_accepted',
                    createdAt: new Date().toISOString()
                });

                showToast(`✅ أصبح ${senderUser.nickname || senderUser.username} صديقاً`, 'success');

                // تحديث البيانات
                await loadAllData();

            } catch (error) {
                console.error('Error accepting friend request:', error);
                showToast('❌ حدث خطأ', 'error');
            }
        }

                // تحديث البيانات

                renderRequests();
                updateCounts();

            } catch (error) {
                console.error('Error rejecting friend request:', error);
                showToast('❌ حدث خطأ', 'error');
            }
        }

        // ============================================================
        // 🗑️ حذف صديق
        // ============================================================
        async function removeFriend(friendId) {
            if (!confirm('هل تريد حذف هذا الصديق؟')) return;
            if (!database || !currentUser) return;

            try {
                // جلب بيانات الصديق
                const friendSnapshot = await database.ref('users')
                    .orderByChild('numericId')
                    .equalTo(parseInt(friendId))
                    .once('value');

                if (!friendSnapshot.exists()) {
                    showToast('❌ المستخدم غير موجود', 'error');
                    return;
                }

                const friendData = friendSnapshot.val();
                const friendKey = Object.keys(friendData)[0];

                // حذف من الطرفين
                await database.ref('users/' + currentFirebaseUserId + '/friends/' + friendId).remove();
                await database.ref('users/' + friendKey + '/friends/' + currentUser.numericId).remove();

                showToast('🗑️ تم حذف الصديق', 'info');

                // تحديث البيانات
                await loadAllData();

            } catch (error) {
                console.error('Error removing friend:', error);
                showToast('❌ حدث خطأ', 'error');
            }
        }

        // ============================================================
        // 🚫 حظر مستخدم
        // ============================================================
        async function blockUser(targetId) {
            const reason = prompt('سبب الحظر (اختياري):');
            if (reason === null) return;

            if (!database || !currentUser) return;

            try {
                // جلب بيانات المستخدم
                const targetSnapshot = await database.ref('users')
                    .orderByChild('numericId')
                    .equalTo(parseInt(targetId))
                    .once('value');

                if (!targetSnapshot.exists()) {
                    showToast('❌ المستخدم غير موجود', 'error');
                    return;
                }

                const targetData = targetSnapshot.val();
                const targetKey = Object.keys(targetData)[0];

                // إضافة إلى قائمة المحظورين
                await database.ref('users/' + currentFirebaseUserId + '/blocked/' + targetId).set({
                    blockedAt: new Date().toISOString(),
                    reason: reason || ''
                });

                // حذف من الأصدقاء إذا كان موجوداً
                await database.ref('users/' + currentFirebaseUserId + '/friends/' + targetId).remove();
                await database.ref('users/' + targetKey + '/friends/' + currentUser.numericId).remove();

                // حذف الطلبات المعلقة
                await database.ref('users/' + currentFirebaseUserId + '/friendRequests/' + targetId).remove();
                await database.ref('users/' + targetKey + '/friendRequests/' + currentUser.numericId).remove();

                showToast(`🚫 تم حظر المستخدم${reason ? ' (سبب: ' + reason + ')' : ''}`, 'warning');

                // تحديث البيانات
                await loadAllData();

            } catch (error) {
                console.error('Error blocking user:', error);
                showToast('❌ حدث خطأ', 'error');
            }
        }

        // ============================================================
        // 🔓 إلغاء حظر مستخدم
        // ============================================================
        async function unblockUser(targetId) {
            if (!confirm('هل تريد إلغاء حظر هذا المستخدم؟')) return;
            if (!database || !currentUser) return;

            try {
                await database.ref('users/' + currentFirebaseUserId + '/blocked/' + targetId).remove();
                showToast('✅ تم إلغاء الحظر', 'success');

                // تحديث البيانات
                await loadBlocked();
                renderBlocked();
                updateCounts();

            } catch (error) {
                console.error('Error unblocking user:', error);
                showToast('❌ حدث خطأ', 'error');
            }
        }

        // ============================================================
        // 💬 بدء شات مع صديق
        // ============================================================
        function startChat(friendId) {
            // توجيه إلى صفحة الشات الخاص
            window.location.href = `chat-private.html?user=${friendId}`;
        }

        // ============================================================
        // 📞 الاتصال بصديق
        // ============================================================
        function callFriend(friendId) {
            // فتح صفحة المكالمة مع الصديق
            window.location.href = `call.html?user=${friendId}&type=video`;
        }

        // ============================================================
        // 🚪 تسجيل الخروج
        // ============================================================
        async function logout() {
            try { if (firebase.auth) await firebase.auth().signOut(); } catch (e) {}
            localStorage.removeItem('currentUser');
            window.location.reload();
        }

        // ============================================================
        // 🚀 التهيئة
        // ============================================================
        window.onload = async function() {
            await initializeFirebase();

            const user = await getCurrentUserFullData();
            if (user) {
                currentUser = user;
                currentFirebaseUserId = user.firebaseKey;
                console.log('✅ User loaded:', user.nickname || user.username);

                // تحديث حالة المستخدم
                if (database && currentFirebaseUserId) {
                    database.ref('users/' + currentFirebaseUserId).update({
                        isOnline: true,
                        lastActive: new Date().toISOString()
                    });

                    window.addEventListener('beforeunload', function() {
                        database.ref('users/' + currentFirebaseUserId).update({
                            isOnline: false
                        });
                    });
                }

                // تحميل البيانات
                await loadAllData();

                // الاستماع للتحديثات في الوقت الفعلي
                listenForRealtimeUpdates();

            } else {
                showToast('⚠️ يرجى تسجيل الدخول أولاً', 'warning');
                setTimeout(() => window.location.href = 'login.html', 2000);
            }

            // إظهار التنقل السفلي للجوال
            if (window.innerWidth <= 768) {
                document.querySelector('.bottom-nav').style.display = 'flex';
            }
        };

        // ============================================================
        // 🔄 الاستماع للتحديثات في الوقت الفعلي
        // ============================================================
        function listenForRealtimeUpdates() {
            if (!database || !currentUser) return;

            // الاستماع للأصدقاء
            database.ref('users/' + currentFirebaseUserId + '/friends').on('value', () => {
                loadFriends().then(() => {
                    renderFriends();
                    updateCounts();
                });
            });

            // الاستماع للطلبات
            database.ref('users/' + currentFirebaseUserId + '/friendRequests').on('value', () => {
                loadRequests().then(() => {
                    renderRequests();
                    updateCounts();
                });
            });

            // الاستماع للمحظورين
            database.ref('users/' + currentFirebaseUserId + '/blocked').on('value', () => {
                loadBlocked().then(() => {
                    renderBlocked();
                    updateCounts();
                });
            });
        }

        // ============================================================
        // 🧹 تنظيف عند الخروج
        // ============================================================
        window.addEventListener('beforeunload', function() {
            if (database && currentFirebaseUserId) {
                database.ref('users/' + currentFirebaseUserId).update({
                    isOnline: false
                });
            }
        });
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js">
    </script>
</body>
</html>
