<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎲 VipClub · Games</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background: #0b1120;
      color: #f0f4ff;
      min-height: 100vh;
      padding-bottom: 30px;
    }
    .navbar {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      height: 70px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid #2d3a52;
      position: sticky;
      top: 0;
      z-index: 999;
    }
    .logo { font-weight: 800; font-size: 1.5rem; color: #8b5cf6; letter-spacing: 1px; }
    .nav-icons { display: flex; gap: 12px; align-items: center; }
    .icon-btn {
      font-size: 1.4rem;
      color: #f0f4ff;
      cursor: pointer;
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      transition: 0.2s;
      background: rgba(255,255,255,0.04);
      text-decoration: none;
    }
    .icon-btn:hover { background: #8b5cf6; color: #fff; transform: translateY(-3px); }
    .relative { position: relative; }

    .container { max-width: 1300px; margin: 0 auto; padding: 20px; }
    .section-title { font-size: 1.8rem; margin: 30px 0 20px; border-right: 6px solid #8b5cf6; padding-right: 15px; }

    /* floating notifications (banners) */
    .floating-banners {
      position: fixed;
      top: 80px;
      right: 20px;
      width: 340px;
      max-height: 70vh;
      overflow-y: auto;
      z-index: 777;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    .banner-item {
      background: #1e293b;
      border-right: 6px solid #fbbf24;
      padding: 14px 18px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      animation: slideIn 0.4s ease;
      pointer-events: auto;
      font-size: 0.9rem;
      border: 1px solid #334155;
      color: #e2e8f0;
    }
    .banner-item i { margin-left: 10px; color: #fbbf24; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(40px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* game grid */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      margin: 20px 0 40px;
    }
    .game-card {
      background: #111c2e;
      border-radius: 28px;
      padding: 20px 16px 20px;
      text-align: center;
      border: 1px solid #2a3a52;
      transition: 0.3s;
      cursor: pointer;
    }
    .game-card:hover { transform: translateY(-8px); border-color: #8b5cf6; box-shadow: 0 12px 30px rgba(139,92,246,0.2); }
    .game-icon { font-size: 3.2rem; margin: 10px 0; }
    .game-card h3 { margin: 8px 0; }
    .game-price { font-size: 1.2rem; font-weight: bold; color: #10b981; margin: 8px 0; }
    .game-detail {
      background: #0a1422;
      border-radius: 16px;
      padding: 12px;
      margin: 12px 0;
      font-size: 0.85rem;
      color: #cbd5e1;
      border: 1px solid #1e3145;
      text-align: right;
    }
    .game-detail strong { color: #facc15; }
    .btn-game {
      background: #8b5cf6;
      border: none;
      padding: 12px 20px;
      border-radius: 60px;
      font-weight: 700;
      color: white;
      width: 100%;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 6px;
    }
    .btn-game:hover { background: #7c3aed; transform: scale(1.02); }
    .btn-game:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* ===== GAME MODAL ===== */
    .game-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(12px);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .game-modal.active { display: flex; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .game-modal-content {
      background: #111c2e;
      border-radius: 40px;
      padding: 35px;
      max-width: 550px;
      width: 100%;
      border: 1px solid #2a3a52;
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
    }
    .game-modal-content .close-btn {
      position: absolute;
      top: 15px;
      left: 20px;
      font-size: 1.8rem;
      color: #94a3b8;
      cursor: pointer;
      transition: 0.3s;
      background: none;
      border: none;
    }
    .game-modal-content .close-btn:hover { color: #ef4444; transform: rotate(90deg); }
    .game-modal-content .game-icon-big { font-size: 4rem; text-align: center; margin: 10px 0; }
    .game-modal-content h2 { text-align: center; margin: 10px 0; }
    .game-modal-content .game-rules {
      background: #0a1422;
      border-radius: 16px;
      padding: 15px;
      margin: 15px 0;
      border: 1px solid #1e3145;
      font-size: 0.95rem;
      line-height: 1.8;
    }
    .game-modal-content .game-rules strong { color: #facc15; }
    .game-modal-content .bet-section {
      display: flex;
      gap: 15px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      margin: 20px 0;
    }
    .game-modal-content .bet-section input {
      background: #0f1a2b;
      border: 1px solid #3a4d6a;
      color: white;
      padding: 12px 20px;
      border-radius: 40px;
      width: 150px;
      text-align: center;
      font-size: 1.2rem;
    }
    .game-modal-content .bet-section .min-bet {
      font-size: 0.8rem;
      color: #94a3b8;
    }
    .btn-play-modal {
      background: #facc15;
      color: #0b1120;
      border: none;
      padding: 14px 40px;
      border-radius: 60px;
      font-weight: 800;
      font-size: 1.2rem;
      cursor: pointer;
      transition: 0.2s;
      width: 100%;
      margin-top: 10px;
    }
    .btn-play-modal:hover { background: #fde047; transform: scale(1.02); }
    .btn-play-modal:disabled { opacity: 0.5; cursor: not-allowed; }

    .result-display {
      text-align: center;
      padding: 15px;
      border-radius: 16px;
      margin: 15px 0;
      font-size: 1.3rem;
      font-weight: bold;
      display: none;
    }
    .result-display.win { display: block; background: rgba(16, 185, 129, 0.2); border: 1px solid #10b981; color: #4ade80; }
    .result-display.lose { display: block; background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #f87171; }

    /* lottery specific - محسن */
    .lottery-reels {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin: 25px 0;
      perspective: 600px;
    }
    .lottery-reels .reel-modal {
      background: linear-gradient(145deg, #1a2940, #0f1a2b);
      width: 90px;
      height: 110px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      box-shadow: 
        inset 0 -5px 0 #3b4e6b,
        0 10px 30px rgba(0,0,0,0.5);
      transition: all 0.3s ease;
      border: 2px solid #2a3a52;
      position: relative;
    }
    .lottery-reels .reel-modal::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(180deg, 
        rgba(255,255,255,0.1) 0%, 
        transparent 30%, 
        transparent 70%, 
        rgba(0,0,0,0.2) 100%);
      border-radius: 20px;
      pointer-events: none;
    }
    .lottery-reels .reel-modal.spinning {
      animation: reelSpin 0.15s ease-in-out infinite;
      border-color: #facc15;
      box-shadow: 
        0 0 30px rgba(250, 204, 21, 0.3),
        inset 0 -5px 0 #facc15;
    }
    @keyframes reelSpin {
      0% { transform: rotateY(0deg) scale(1); }
      50% { transform: rotateY(15deg) scale(1.05); }
      100% { transform: rotateY(0deg) scale(1); }
    }
    .lottery-reels .reel-modal.win-reel {
      border-color: #4ade80;
      box-shadow: 0 0 40px rgba(74, 222, 128, 0.4);
      animation: winPulse 0.6s ease;
    }
    @keyframes winPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    /* lottery stats */
    .lottery-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 15px 0;
      padding: 15px;
      background: #0a1422;
      border-radius: 16px;
      border: 1px solid #1e3145;
    }
    .lottery-stat-item {
      text-align: center;
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .lottery-stat-item span {
      display: block;
      font-size: 1.2rem;
      font-weight: bold;
      color: #facc15;
    }

    .history-panel {
      background: #0d1627;
      border-radius: 24px;
      padding: 18px;
      margin-top: 30px;
      max-height: 400px;
      overflow-y: auto;
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 12px;
      border-bottom: 1px solid #1e3145;
      font-size: 0.9rem;
    }
    .win { color: #4ade80; }
    .lose { color: #f87171; }

    /* responsive */
    @media(max-width:600px){
      .floating-banners { width: 90%; right: 5%; top: 75px; }
      .game-modal-content { padding: 20px; }
      .lottery-reels .reel-modal { width: 70px; height: 90px; font-size: 3rem; }
      .lottery-stats { grid-template-columns: 1fr; }
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0b1120; }
    ::-webkit-scrollbar-thumb { background: #4b5b78; border-radius: 10px; }

    .hidden { display: none !important; }
    
    /* Firebase alert */
    .firebase-alert {
      position: fixed;
      top: 80px;
      left: 20px;
      padding: 12px 18px;
      border-radius: 12px;
      z-index: 99999;
      animation: slideInRight 0.3s ease;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      max-width: 400px;
      backdrop-filter: blur(10px);
    }
    .firebase-success { background: rgba(16, 185, 129, 0.9); color: white; }
    .firebase-error { background: rgba(239, 68, 68, 0.9); color: white; }
    .firebase-warning { background: rgba(245, 158, 11, 0.9); color: white; }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(-40px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* jackpot animation */
    .jackpot-effect {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 99999;
      display: none;
    }
    .jackpot-effect.active {
      display: block;
      animation: jackpotFlash 0.5s ease 3;
    }
    @keyframes jackpotFlash {
      0%, 100% { background: transparent; }
      50% { background: rgba(250, 204, 21, 0.1); }
    }
    .confetti-piece {
      position: absolute;
      width: 10px;
      height: 10px;
      animation: confettiFall linear forwards;
    }
    @keyframes confettiFall {
      0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav class="navbar">
  <div class="logo">👑 VipClub · Games</div>
  <div class="nav-icons">
    <a href="Games.html" class="icon-btn relative" title="الرئيسية"><i class="fas fa-dice"></i></a>
    <a href="Wallet.html" class="icon-btn relative" title="المحفظة"><i class="fas fa-wallet"></i></a>
    <div class="icon-btn relative" onclick="openProfile()"><i class="fas fa-user-circle"></i></div>
  </div>
</nav>

<!-- Jackpot Effect -->
<div class="jackpot-effect" id="jackpotEffect"></div>

<!-- Firebase Alert -->
<div id="firebaseAlert" class="firebase-alert" style="display: none;"></div>

<!-- floating banners -->
<div id="bannerContainer" class="floating-banners"></div>

<div class="container">

  <!-- profile quick -->
  <div id="profileCard" style="background:#111c2e; border-radius:30px; padding:12px 20px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; border:1px solid #2a3a52; margin-bottom:20px;">
    <div><i class="fas fa-user-circle" style="font-size:1.8rem; color:#8b5cf6;"></i> <span id="pName">زائر</span>  <span id="pId" style="background:#1e2a44; padding:4px 14px; border-radius:30px; margin-right:10px; font-family:monospace;">000000</span></div>
    <div><span>💰 EGP: <span id="pEgp" style="color:#4ade80;">0</span>  |  💵 USD: <span id="pUsd" style="color:#60a5fa;">0</span></span></div>
  </div>

  <!-- GAMES GRID -->
  <h2 class="section-title"><i class="fas fa-gamepad" style="margin-left:10px;"></i> ألعاب الحظ</h2>
  <div class="games-grid" id="gamesGrid"></div>

  <!-- HISTORY -->
  <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; margin-top:30px;">
    <h2 class="section-title" style="margin:0;"><i class="fas fa-clock-rotate-left"></i> سجل الألعاب</h2>
    <button class="btn-game" style="width:auto; padding:6px 20px; background:#334155;" onclick="clearHistory()">مسح السجل</button>
  </div>
  <div class="history-panel" id="historyPanel">
    <div class="history-item" style="color:#64748b;">لا توجد جولات بعد</div>
  </div>

</div>

<!-- ===== GAME MODAL ===== -->
<div class="game-modal" id="gameModal">
  <div class="game-modal-content">
    <button class="close-btn" onclick="closeGameModal()"><i class="fas fa-times"></i></button>
    
    <div class="game-icon-big" id="modalIcon">⚡</div>
    <h2 id="modalTitle">أوليمبوس</h2>
    
    <div class="game-rules" id="modalRules">
      <strong>شرح اللعبة:</strong><br>
      مضاعف عشوائي يتراوح بين <strong>1x</strong> و <strong>4x</strong><br>
      احتمال الفوز <strong>40%</strong>
    </div>

    <!-- منطقة اللعب الخاصة بكل لعبة -->
    <div id="gamePlayArea">
      <!-- سيتم ملؤها بواسطة JavaScript حسب نوع اللعبة -->
    </div>

    <div class="result-display" id="resultDisplay"></div>

    <div class="bet-section">
      <input type="number" id="modalBetAmount" value="5" min="5" step="1">
      <span class="min-bet">الحد الأدنى 5 ج.م</span>
    </div>
    
    <button class="btn-play-modal" id="playBtn" onclick="executeGame()">🎮 لعب</button>
  </div>
</div>

<script>
  // ===== Firebase Config =====
  const firebaseConfig = {
    apiKey: "AIzaSyAX0jz_yOGagteO5R5ZHji1ZG44fk--Zvs",
    authDomain: "stvipclub.firebaseapp.com",
    databaseURL: "https://stvipclub-default-rtdb.europe-west1.firebasedatabase.app/",
    projectId: "stvipclub",
    storageBucket: "stvipclub.firebasestorage.app",
    messagingSenderId: "526607326044",
    appId: "1:526607326044:web:6af53db123ae02c7193f99"
  };

  let firebaseApp, database, auth;
  let currentUserData = null;
  let currentGame = null;
  let isPlaying = false;

  // ===== Initialize Firebase =====
  function initFirebase() {
    try {
      if (firebase.apps.length > 0) {
        firebase.app().delete();
      }
      firebaseApp = firebase.initializeApp(firebaseConfig);
      database = firebase.database();
      auth = firebase.auth();

      auth.onAuthStateChanged(async (user) => {
        if (user) {
          await loadUserData(user.uid);
        } else {
          currentUserData = null;
          updateUI();
        }
      });
    } catch (error) {
      console.error('Firebase init error:', error);
    }
  }

  // ===== Load user data from Firebase =====
  async function loadUserData(uid) {
    try {
      const snapshot = await database.ref('users/' + uid).once('value');
      if (snapshot.exists()) {
        currentUserData = snapshot.val();
        currentUserData.uid = uid;
        localStorage.setItem('currentUser', JSON.stringify(currentUserData));
        updateUI();
      } else {
        const newUser = {
          nickname: 'لاعب',
          username: 'player_' + Date.now(),
          balanceEGP: 0,
          balanceUSD: 0,
          numericId: Math.floor(100000 + Math.random() * 900000),
          createdAt: new Date().toISOString()
        };
        await database.ref('users/' + uid).set(newUser);
        currentUserData = { ...newUser, uid };
        localStorage.setItem('currentUser', JSON.stringify(currentUserData));
        updateUI();
      }
    } catch (error) {
      console.error('Load user error:', error);
      showFirebaseAlert('❌ خطأ في تحميل البيانات', 'error');
    }
  }

  // ===== Get current user =====
  function getUser() {
    if (currentUserData) return currentUserData;
    try {
      const local = JSON.parse(localStorage.getItem('currentUser'));
      if (local) return local;
    } catch (e) {}
    return null;
  }

  // ===== Save user to Firebase =====
  async function saveUserToFirebase(userData) {
    if (!userData || !userData.uid) return false;
    try {
      await database.ref('users/' + userData.uid).update({
        balanceEGP: userData.balanceEGP || 0,
        balanceUSD: userData.balanceUSD || 0,
        nickname: userData.nickname || userData.username,
        updatedAt: new Date().toISOString()
      });
      localStorage.setItem('currentUser', JSON.stringify(userData));
      return true;
    } catch (error) {
      console.error('Save user error:', error);
      showFirebaseAlert('❌ خطأ في حفظ البيانات', 'error');
      return false;
    }
  }

  // ===== Show Firebase Alert =====
  function showFirebaseAlert(message, type) {
    const alertDiv = document.getElementById('firebaseAlert');
    alertDiv.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i> ${message}`;
    alertDiv.className = `firebase-alert firebase-${type}`;
    alertDiv.style.display = 'flex';
    setTimeout(() => { alertDiv.style.display = 'none'; }, 4000);
  }

  // ===== Game State =====
  let gameHistory = [];
  let totalRounds = 0;
  let totalBet = 0;
  let totalWinAmount = 0;
  let bannerMessages = [];

  // ===== Load game stats from Firebase =====
  async function loadGameStats() {
    try {
      const snapshot = await database.ref('gameStats').once('value');
      if (snapshot.exists()) {
        const stats = snapshot.val();
        totalRounds = stats.totalRounds || 0;
        totalBet = stats.totalBet || 0;
        totalWinAmount = stats.totalWinAmount || 0;
        gameHistory = stats.gameHistory || [];
        bannerMessages = stats.bannerMessages || [];
      }
    } catch (error) {
      console.error('Load stats error:', error);
    }
  }

  // ===== Save game stats to Firebase =====
  async function saveGameStats() {
    try {
      await database.ref('gameStats').set({
        totalRounds,
        totalBet,
        totalWinAmount,
        gameHistory: gameHistory.slice(0, 200),
        bannerMessages: bannerMessages.slice(0, 30),
        updatedAt: new Date().toISOString()
      });
    } catch (error) {
      console.error('Save stats error:', error);
    }
  }

  // ===== Update UI =====
  function updateUI() {
    const user = getUser();
    document.getElementById('pName').innerText = user?.nickname || user?.username || 'زائر';
    document.getElementById('pId').innerText = user?.numericId ? String(user.numericId).padStart(6, '0') : '000000';
    document.getElementById('pEgp').innerText = (user?.balanceEGP || 0).toFixed(2);
    document.getElementById('pUsd').innerText = (user?.balanceUSD || 0).toFixed(2);
    renderHistory();
    renderBanners();
  }

  // ===== Games Data =====
  const games = [
    {
      id: 'olympus',
      name: '⚡ أوليمبوس',
      icon: 'fa-bolt',
      price: 5,
      minBet: 5,
      currency: 'EGP',
      rules: '🔹 مضاعف عشوائي يتراوح بين <strong>1x</strong> و <strong>4x</strong><br>🔹 احتمال الفوز <strong>40%</strong><br>🔹 كلما زاد المضاعف زادت المخاطرة',
      playHTML: `<div style="text-align:center; padding:10px;">
        <div style="font-size:3rem; margin:10px 0;">⚡</div>
        <p style="color:#94a3b8;">اضغط "لعب" لتدور العجلة وتحصل على مضاعف عشوائي</p>
      </div>`
    },
    {
      id: 'plinko',
      name: '🟡 بلينكو',
      icon: 'fa-circle-dot',
      price: 5,
      minBet: 5,
      currency: 'EGP',
      rules: '🔹 مخاطرة <strong>50%</strong> ربح أو خسارة<br>🔹 الربح يكون <strong>2x</strong> المبلغ<br>🔹 لعبة سريعة تعتمد على الحظ',
      playHTML: `<div style="text-align:center; padding:10px;">
        <div style="font-size:3rem; margin:10px 0;">🟡</div>
        <p style="color:#94a3b8;">اختر: سقوط الكرة يمين أو يسار — فرصة 50% للفوز</p>
      </div>`
    },
    {
      id: 'dice',
      name: '🎲 زهر النرد',
      icon: 'fa-dice',
      price: 5,
      minBet: 5,
      currency: 'EGP',
      rules: '🔹 تخمين الرقم بين 1-6<br>🔹 ربح <strong>3x</strong> في حال التخمين الصحيح<br>🔹 احتمال الفوز <strong>16.6%</strong>',
      playHTML: `<div style="text-align:center; padding:10px;">
        <div style="font-size:3rem; margin:10px 0;">🎲</div>
        <p style="color:#94a3b8;">اختر رقم من 1 إلى 6 — إذا ظهر ربحت 3x</p>
      </div>`
    },
    {
      id: 'roulette',
      name: '🎡 روليت',
      icon: 'fa-rotate',
      price: 5,
      minBet: 5,
      currency: 'EGP',
      rules: '🔹 اختر لون أحمر أو أسود<br>🔹 ربح <strong>2x</strong> المبلغ<br>🔹 احتمال الفوز <strong>~47%</strong> (باستثناء الصفر)',
      playHTML: `<div style="text-align:center; padding:10px;">
        <div style="font-size:3rem; margin:10px 0;">🎡</div>
        <p style="color:#94a3b8;">اختر لون: أحمر 🔴 أو أسود ⚫ — ربح 2x</p>
      </div>`
    },
    {
      id: 'lottery',
      name: '🎰 ماكينة الحظ',
      icon: 'fa-slot-machine',
      price: 5,
      minBet: 5,
      currency: 'EGP',
      rules: '🔹 3 رموز متطابقة: ربح <strong>3x</strong><br>🔹 2 رموز متطابقة: ربح <strong>1.8x</strong><br>🔹 بونص حظ 30%: ربح <strong>2.5x</strong><br>🎯 فرصة الجائزة الكبرى 5%',
      playHTML: `<div style="text-align:center;">
        <div class="lottery-reels" id="lotteryReelsModal">
          <div class="reel-modal" id="modalReel1">🍒</div>
          <div class="reel-modal" id="modalReel2">🍋</div>
          <div class="reel-modal" id="modalReel3">🍊</div>
        </div>
        <div class="lottery-stats" id="lotteryStats">
          <div class="lottery-stat-item">
            🎯 الجائزة الكبرى
            <span>3x</span>
          </div>
          <div class="lottery-stat-item">
            🔄 رمزان متطابقان
            <span>1.8x</span>
          </div>
          <div class="lottery-stat-item">
            🎁 بونص الحظ
            <span>2.5x</span>
          </div>
        </div>
        <p style="color:#94a3b8; margin-top:10px;">✨ اضغط "لعب" لتدور البكرات</p>
      </div>`
    }
  ];

  // ===== Lottery Symbols =====
  const lotterySymbols = ['🍒', '🍋', '🍊', '🍇', '🔔', '💎', '7️⃣', '⭐', '🎰'];

  // ===== Render Games =====
  function renderGames() {
    const grid = document.getElementById('gamesGrid');
    grid.innerHTML = games.map(g => `
      <div class="game-card" onclick="openGameModal('${g.id}')">
        <div class="game-icon"><i class="fas ${g.icon}"></i></div>
        <h3>${g.name}</h3>
        <div class="game-detail">${g.rules}</div>
        <div class="game-price">الحد الأدنى ${g.minBet} ${g.currency}</div>
        <button class="btn-game">🎮 العب</button>
      </div>
    `).join('');
  }

  // ===== Open Game Modal =====
  function openGameModal(gameId) {
    const user = getUser();
    if (!user) { showFirebaseAlert('يرجى تسجيل الدخول أولاً', 'warning'); return; }

    const game = games.find(g => g.id === gameId);
    if (!game) return;
    currentGame = game;

    document.getElementById('modalIcon').innerHTML = `<i class="fas ${game.icon}"></i>`;
    document.getElementById('modalTitle').innerText = game.name;
    document.getElementById('modalRules').innerHTML = `<strong>شرح اللعبة:</strong><br>${game.rules}`;
    document.getElementById('gamePlayArea').innerHTML = game.playHTML;
    document.getElementById('modalBetAmount').value = game.minBet;
    document.getElementById('modalBetAmount').min = game.minBet;
    document.getElementById('resultDisplay').className = 'result-display';
    document.getElementById('resultDisplay').style.display = 'none';
    document.getElementById('resultDisplay').innerHTML = '';

    document.getElementById('gameModal').classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  // ===== Close Game Modal =====
  function closeGameModal() {
    document.getElementById('gameModal').classList.remove('active');
    document.body.style.overflow = 'auto';
    currentGame = null;
    isPlaying = false;
  }

  // ===== Execute Game =====
  async function executeGame() {
    if (!currentGame || isPlaying) return;
    
    const user = getUser();
    if (!user) { showFirebaseAlert('تسجيل الدخول مطلوب', 'warning'); return; }

    const bet = parseFloat(document.getElementById('modalBetAmount').value) || 0;
    const minBet = currentGame.minBet || 5;
    
    if (bet < minBet) { showFirebaseAlert(`الحد الأدنى للعب هو ${minBet} ج.م`, 'error'); return; }
    if (bet <= 0) { showFirebaseAlert('أدخل مبلغ صحيح', 'error'); return; }

    const bal = parseFloat(user.balanceEGP) || 0;
    if (bal < bet) { showFirebaseAlert('⚠️ رصيد غير كافٍ', 'error'); return; }

    isPlaying = true;
    const btn = document.getElementById('playBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جارٍ...';

    const resultDisplay = document.getElementById('resultDisplay');
    resultDisplay.className = 'result-display';
    resultDisplay.style.display = 'none';

    let win = false;
    let winAmount = 0;
    let resultText = '';

    // ===== LOTTERY GAME (محسن) =====
    if (currentGame.id === 'lottery') {
      const reels = [
        document.getElementById('modalReel1'),
        document.getElementById('modalReel2'),
        document.getElementById('modalReel3')
      ];
      
      // Start spinning animation
      reels.forEach((reel, index) => {
        reel.classList.add('spinning');
        // تغيير الرموز بسرعة
        let interval = setInterval(() => {
          const randomSymbol = lotterySymbols[Math.floor(Math.random() * lotterySymbols.length)];
          reel.textContent = randomSymbol;
        }, 50);
        reel.dataset.interval = interval;
      });

      // انتظار 2 ثانية
      await new Promise(resolve => setTimeout(resolve, 2000));

      // النتائج النهائية
      const finalResults = [];
      for (let i = 0; i < 3; i++) {
        const idx = Math.floor(Math.random() * lotterySymbols.length);
        finalResults.push(lotterySymbols[idx]);
      }

      // إيقاف المؤقتات وعرض النتائج
      reels.forEach((reel, index) => {
        clearInterval(parseInt(reel.dataset.interval));
        reel.classList.remove('spinning');
        reel.textContent = finalResults[index];
      });

      // حساب النتيجة
      const allSame = finalResults[0] === finalResults[1] && finalResults[1] === finalResults[2];
      const twoSame = finalResults[0] === finalResults[1] || finalResults[1] === finalResults[2] || finalResults[0] === finalResults[2];
      
      // جائزة إضافية عشوائية
      const bonusChance = Math.random();
      
      if (allSame) {
        win = true;
        winAmount = bet * 3.0;
        resultText = `🎉🎊 جائزة كبرى! ${finalResults.join(' ')} — ربحت ${winAmount} EGP (×3)`;
        // تأثير خاص للجائزة الكبرى
        showJackpotEffect();
        addBanner(`🎰 ${user.nickname || user.username} فاز بالجائزة الكبرى ${winAmount} EGP!`);
      } else if (twoSame) {
        win = true;
        winAmount = bet * 1.8;
        resultText = `🎉 فوز! ${finalResults.join(' ')} — ربحت ${winAmount} EGP (×1.8)`;
        reels.forEach(r => {
          if (r.textContent === finalResults[0] || r.textContent === finalResults[1]) {
            r.classList.add('win-reel');
          }
        });
      } else if (bonusChance < 0.30) {
        // بونص حظ
        win = true;
        winAmount = bet * 2.5;
        resultText = `🎁 بونص حظ! ${finalResults.join(' ')} — ربحت ${winAmount} EGP (×2.5)`;
        reels.forEach(r => r.classList.add('win-reel'));
        addBanner(`🎁 ${user.nickname || user.username} ربح بونص ${winAmount} EGP!`);
      } else {
        win = false;
        winAmount = 0;
        resultText = `😞 خسارة! ${finalResults.join(' ')} — حاول مرة أخرى`;
      }

      // إزالة تأثيرات الفوز بعد 1.5 ثانية
      setTimeout(() => {
        reels.forEach(r => r.classList.remove('win-reel'));
      }, 1500);

    } else {
      // ===== OTHER GAMES =====
      const winChance = 0.40;
      win = Math.random() < winChance;
      
      if (currentGame.id === 'dice') {
        const guess = Math.floor(Math.random() * 6) + 1;
        const roll = Math.floor(Math.random() * 6) + 1;
        win = guess === roll;
        winAmount = win ? bet * 3 : 0;
        resultText = win ? `🎉 فوز! الرقم ${roll} صحيح — ربحت ${winAmount} EGP` : `😞 خسارة — الرقم كان ${roll}`;
      } else if (currentGame.id === 'plinko') {
        win = Math.random() < 0.5;
        winAmount = win ? bet * 2 : 0;
        resultText = win ? `🎉 فوز! ربحت ${winAmount} EGP` : '😞 خسارة';
      } else if (currentGame.id === 'roulette') {
        const colors = ['🔴', '⚫'];
        const chosen = colors[Math.floor(Math.random() * 2)];
        const result = colors[Math.floor(Math.random() * 2)];
        win = chosen === result;
        winAmount = win ? bet * 2 : 0;
        resultText = win ? `🎉 فوز! ${result} — ربحت ${winAmount} EGP` : `😞 خسارة — النتيجة ${result}`;
      } else {
        // olympus
        const multiplier = win ? (1 + Math.random() * 3) : 0;
        winAmount = win ? Math.round(bet * multiplier) : 0;
        resultText = win ? `🎉 فوز! مضاعف ${multiplier.toFixed(1)}x — ربحت ${winAmount} EGP` : '😞 خسارة';
      }
    }

    // ===== Update Balance =====
    const delta = win ? winAmount - bet : -bet;
    user.balanceEGP = bal + delta;
    await saveUserToFirebase(user);

    // ===== Save History =====
    const entry = {
      game: currentGame.name,
      bet: bet,
      result: win ? `ربح ${winAmount}` : 'خسارة',
      amount: delta,
      time: new Date().toLocaleString('ar-EG'),
      win: win,
      winAmount: winAmount,
      player: user.nickname || user.username
    };
    gameHistory.unshift(entry);
    if (gameHistory.length > 200) gameHistory = gameHistory.slice(0, 200);

    totalRounds++;
    totalBet += bet;
    if (win) totalWinAmount += winAmount;
    await saveGameStats();

    // ===== Show Result =====
    resultDisplay.innerHTML = resultText;
    resultDisplay.className = `result-display ${win ? 'win' : 'lose'}`;
    resultDisplay.style.display = 'block';

    updateUI();
    showFirebaseAlert(win ? `🎉 فوز! ربحت ${winAmount} EGP` : `😞 خسارة ${bet} EGP`, win ? 'success' : 'error');

    isPlaying = false;
    btn.disabled = false;
    btn.innerHTML = '🎮 لعب';
  }

  // ===== Jackpot Effect =====
  function showJackpotEffect() {
    const effect = document.getElementById('jackpotEffect');
    effect.classList.add('active');
    
    // Create confetti
    for (let i = 0; i < 50; i++) {
      const confetti = document.createElement('div');
      confetti.className = 'confetti-piece';
      confetti.style.left = Math.random() * 100 + '%';
      confetti.style.top = '-10px';
      confetti.style.background = `hsl(${Math.random() * 360}, 80%, 60%)`;
      confetti.style.width = (Math.random() * 10 + 5) + 'px';
      confetti.style.height = (Math.random() * 10 + 5) + 'px';
      confetti.style.animationDuration = (Math.random() * 2 + 1) + 's';
      confetti.style.animationDelay = (Math.random() * 0.5) + 's';
      effect.appendChild(confetti);
    }
    
    setTimeout(() => {
      effect.classList.remove('active');
      effect.innerHTML = '';
    }, 3000);
  }

  // ===== Banners =====
  function addBanner(msg) {
    bannerMessages.unshift({ text: msg, time: Date.now() });
    if (bannerMessages.length > 30) bannerMessages = bannerMessages.slice(0, 30);
    saveGameStats();
    renderBanners();
  }

  function renderBanners() {
    const container = document.getElementById('bannerContainer');
    container.innerHTML = bannerMessages.slice(0, 8).map(b => `
      <div class="banner-item"><i class="fas fa-trophy"></i> ${b.text}</div>
    `).join('');
  }

  // ===== History =====
  function renderHistory() {
    const panel = document.getElementById('historyPanel');
    if (!gameHistory.length) {
      panel.innerHTML = '<div class="history-item" style="color:#64748b;">لا توجد جولات بعد</div>';
      return;
    }
    panel.innerHTML = gameHistory.slice(0, 50).map(h => `
      <div class="history-item">
        <span>${h.game} · ${h.time}</span>
        <span class="${h.win ? 'win' : 'lose'}">${h.result} (${h.amount > 0 ? '+' : ''}${h.amount} EGP)</span>
      </div>
    `).join('');
  }

  function clearHistory() {
    if (!confirm('مسح سجل الألعاب؟')) return;
    gameHistory = [];
    saveGameStats();
    renderHistory();
  }

  // ===== Profile =====
  function openProfile() {
    const user = getUser();
    if (!user) { showFirebaseAlert('تسجيل الدخول مطلوب', 'warning'); return; }
    alert(`👤 ${user.nickname || user.username}\n🆔 ${user.numericId?.toString().padStart(6, '0')}\n💰 EGP: ${user.balanceEGP}\n💵 USD: ${user.balanceUSD}`);
  }

  // ===== Close modal on ESC =====
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeGameModal();
  });

  // ===== Init =====
  async function init() {
    renderGames();
    await loadGameStats();
    initFirebase();
    updateUI();

    if (bannerMessages.length === 0) {
      addBanner('🎯 مرحباً في ألعاب VipClub! حظ سعيد');
      setTimeout(() => addBanner('💎 جرب حظك في ماكينة الحظ'), 3000);
    }

    setInterval(async () => {
      await loadGameStats();
      updateUI();
    }, 30000);
  }

  document.addEventListener('DOMContentLoaded', init);
</script>
