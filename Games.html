<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 VipClub · ماكينة الحظ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: #0b1120;
            color: #f0f4ff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Navbar */
        .navbar {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid #2d3a52;
            position: sticky;
            top: 0;
            z-index: 999;
        }
        .logo { font-weight: 800; font-size: 1.5rem; color: #8b5cf6; letter-spacing: 1px; }
        .logo span { color: #facc15; }
        .nav-icons { display: flex; gap: 12px; align-items: center; }
        .icon-btn {
            font-size: 1.4rem;
            color: #f0f4ff;
            cursor: pointer;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            transition: 0.2s;
            background: rgba(255,255,255,0.04);
            text-decoration: none;
            position: relative;
        }
        .icon-btn:hover { background: #8b5cf6; color: #fff; transform: translateY(-3px); }
        .badge {
            position: absolute; top: -4px; right: -4px;
            background: #ef4444; color: white;
            font-size: 0.7rem; padding: 2px 7px;
            border-radius: 30px;
        }
        .hidden-guest { display: none !important; }

        /* Main Container */
        .container {
            flex: 1;
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            width: 100%;
        }

        /* Profile Card */
        .profile-card {
            background: #111c2e;
            border-radius: 30px;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border: 1px solid #2a3a52;
            margin-bottom: 30px;
        }
        .profile-card .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .profile-card .user-info i { font-size: 1.8rem; color: #8b5cf6; }
        .profile-card .user-info .name { font-weight: bold; }
        .profile-card .user-info .id {
            background: #1e2a44;
            padding: 4px 14px;
            border-radius: 30px;
            font-family: monospace;
            font-size: 0.9rem;
        }
        .profile-card .balances {
            display: flex;
            gap: 20px;
        }
        .profile-card .balances span { font-weight: bold; }
        .balance-egp { color: #4ade80; }
        .balance-usd { color: #60a5fa; }

        /* Slot Machine */
        .slot-container {
            background: linear-gradient(145deg, #1a2940, #0f1a2b);
            border-radius: 50px;
            padding: 40px 30px;
            border: 2px solid #2d3f5a;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            text-align: center;
        }
        .slot-title {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #facc15;
        }
        .slot-title i { margin-left: 15px; }

        .reels-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
            padding: 20px;
            background: #0b1422;
            border-radius: 40px;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.6);
        }
        .reel {
            width: 120px;
            height: 140px;
            background: linear-gradient(180deg, #1a2940, #0f1a2b);
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4.5rem;
            box-shadow: inset 0 -8px 0 #3b4e6b, 0 8px 25px rgba(0,0,0,0.4);
            transition: 0.2s;
            border: 2px solid #2d3f5a;
            user-select: none;
        }
        .reel.spinning {
            animation: reelSpin 0.15s ease-in-out infinite;
        }
        @keyframes reelSpin {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(5deg) scale(1.05); }
            100% { transform: rotate(0deg) scale(1); }
        }
        .reel.winner {
            border-color: #facc15;
            box-shadow: 0 0 30px rgba(250, 204, 21, 0.4), inset 0 0 30px rgba(250, 204, 21, 0.1);
        }

        /* Controls */
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }
        .bet-section {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .bet-section label {
            font-size: 1rem;
            color: #94a3b8;
        }
        .bet-input {
            background: #0f1a2b;
            border: 2px solid #3a4d6a;
            color: white;
            padding: 12px 20px;
            border-radius: 40px;
            width: 150px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .bet-input:focus { outline: none; border-color: #8b5cf6; }

        .btn-spin {
            background: linear-gradient(135deg, #facc15, #f59e0b);
            color: #0b1120;
            border: none;
            padding: 16px 50px;
            border-radius: 60px;
            font-weight: 800;
            font-size: 1.3rem;
            cursor: pointer;
            transition: 0.3s;
            min-width: 180px;
            box-shadow: 0 8px 25px rgba(250, 204, 21, 0.3);
        }
        .btn-spin:hover { transform: scale(1.05); box-shadow: 0 12px 35px rgba(250, 204, 21, 0.5); }
        .btn-spin:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Result Display */
        .result-box {
            margin-top: 25px;
            padding: 20px;
            border-radius: 20px;
            font-size: 1.4rem;
            font-weight: bold;
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .result-box.win {
            display: block;
            background: rgba(16, 185, 129, 0.15);
            border: 2px solid #10b981;
            color: #4ade80;
        }
        .result-box.lose {
            display: block;
            background: rgba(239, 68, 68, 0.15);
            border: 2px solid #ef4444;
            color: #f87171;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Multiplier Guide */
        .guide {
            margin-top: 25px;
            padding: 15px;
            background: #0a1422;
            border-radius: 20px;
            border: 1px solid #1e3145;
            font-size: 0.9rem;
            color: #94a3b8;
        }
        .guide-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        .guide-item {
            background: #111c2e;
            padding: 8px 12px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #2a3a52;
        }
        .guide-item .symbol { font-size: 1.5rem; }
        .guide-item .multiplier { color: #facc15; font-weight: bold; }

        /* History */
        .history-section {
            margin-top: 30px;
            background: #0d1627;
            border-radius: 24px;
            padding: 18px;
            max-height: 300px;
            overflow-y: auto;
        }
        .history-section h3 {
            margin-bottom: 15px;
            color: #94a3b8;
            font-size: 1rem;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            border-bottom: 1px solid #1e3145;
            font-size: 0.9rem;
        }
        .history-item .win-text { color: #4ade80; }
        .history-item .lose-text { color: #f87171; }

        /* Floating Banners */
        .floating-banners {
            position: fixed;
            top: 80px;
            right: 20px;
            width: 320px;
            max-height: 70vh;
            overflow-y: auto;
            z-index: 777;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }
        .banner-item {
            background: #1e293b;
            border-right: 6px solid #fbbf24;
            padding: 12px 16px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            animation: slideIn 0.4s ease;
            pointer-events: auto;
            font-size: 0.85rem;
            border: 1px solid #334155;
            color: #e2e8f0;
        }
        .banner-item i { margin-left: 10px; color: #fbbf24; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Firebase Alert */
        .firebase-alert {
            position: fixed;
            top: 80px;
            left: 20px;
            padding: 12px 18px;
            border-radius: 12px;
            z-index: 9999;
            animation: slideInLeft 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            max-width: 400px;
            backdrop-filter: blur(10px);
        }
        .firebase-success { background: rgba(16, 185, 129, 0.9); color: white; }
        .firebase-error { background: rgba(239, 68, 68, 0.9); color: white; }
        .firebase-warning { background: rgba(245, 158, 11, 0.9); color: white; }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Responsive */
        @media(max-width:600px){
            .reel { width: 80px; height: 100px; font-size: 3rem; }
            .reels-container { gap: 10px; padding: 15px; }
            .profile-card { flex-direction: column; gap: 10px; }
            .floating-banners { width: 90%; right: 5%; top: 75px; }
            .container { padding: 10px; }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0b1120; }
        ::-webkit-scrollbar-thumb { background: #4b5b78; border-radius: 10px; }

        /* Footer */
        .footer {
            text-align: center;
            padding: 30px 20px;
            color: #475569;
            border-top: 1px solid #1e2a44;
            margin-top: 30px;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
    <div class="logo">🎰 <span>VIP</span>Club</div>
    <div class="nav-icons">
        <a href="Wallet.html" class="icon-btn auth-only hidden-guest" title="المحفظة">
            <i class="fas fa-wallet"></i>
        </a>
        <div class="icon-btn auth-only hidden-guest" onclick="openProfile()" title="الملف الشخصي">
            <i class="fas fa-user-circle"></i>
        </div>
        <div class="icon-btn auth-only hidden-guest" onclick="openNotifications()" title="الإشعارات">
            <i class="fas fa-bell"></i>
            <span class="badge" id="notifBadge">0</span>
        </div>
    </div>
</nav>

<!-- Floating Banners -->
<div id="bannerContainer" class="floating-banners"></div>

<!-- Firebase Alert -->
<div id="firebaseAlert" class="firebase-alert" style="display: none;"></div>

<div class="container">
    <!-- Profile Card -->
    <div class="profile-card">
        <div class="user-info">
            <i class="fas fa-user-circle"></i>
            <span class="name" id="pName">زائر</span>
            <span class="id" id="pId">000000</span>
        </div>
        <div class="balances">
            <span>💰 EGP: <span class="balance-egp" id="pEgp">0.00</span></span>
            <span>💵 USD: <span class="balance-usd" id="pUsd">0.00</span></span>
        </div>
    </div>

    <!-- Slot Machine -->
    <div class="slot-container">
        <h1 class="slot-title"><i class="fas fa-slot-machine"></i> ماكينة الحظ</h1>

        <div class="reels-container">
            <div class="reel" id="reel1">🍒</div>
            <div class="reel" id="reel2">🍒</div>
            <div class="reel" id="reel3">🍒</div>
        </div>

        <div class="controls">
            <div class="bet-section">
                <label>💰 الرهان:</label>
                <input type="number" id="betAmount" class="bet-input" value="5" min="1" step="1">
            </div>
            <button class="btn-spin" id="spinBtn" onclick="spinSlot()">
                <i class="fas fa-play"></i> سحب
            </button>
        </div>

        <div class="result-box" id="resultDisplay"></div>

        <!-- Multiplier Guide -->
        <div class="guide">
            <div style="font-weight:bold; color:#e2e8f0; margin-bottom:8px;">📊 مضاعفات المكسب:</div>
            <div class="guide-grid">
                <div class="guide-item"><span class="symbol">👑</span><br>3x <span class="multiplier">×5</span></div>
                <div class="guide-item"><span class="symbol">💎</span><br>3x <span class="multiplier">×4</span></div>
                <div class="guide-item"><span class="symbol">7️⃣</span><br>3x <span class="multiplier">×3</span></div>
                <div class="guide-item"><span class="symbol">🔔</span><br>3x <span class="multiplier">×2.5</span></div>
                <div class="guide-item"><span class="symbol">🍒🍋🍊</span><br>3x متطابقة <span class="multiplier">×3</span></div>
                <div class="guide-item"><span class="symbol">🍒🍒</span><br>2x متطابقة <span class="multiplier">×1.8</span></div>
            </div>
        </div>
    </div>

    <!-- History -->
    <div class="history-section">
        <h3>📋 سجل اللعب</h3>
        <div id="historyPanel">
            <div class="history-item" style="color:#64748b;">لا توجد جولات بعد</div>
        </div>
    </div>
</div>

<footer class="footer">
    &copy; 2026 <b>VipClub</b> - جميع الحقوق محفوظة
</footer>

<script>
    // ===== Firebase Config =====
    const firebaseConfig = {
        apiKey: "AIzaSyAVSzkDLqi1G-hpfEPqvBMmuyYRfEuaTKk",
        authDomain: "vipclub-1d04a.firebaseapp.com",
        databaseURL: "https://vipclub-1d04a-default-rtdb.firebaseio.com",
        projectId: "vipclub-1d04a",
        storageBucket: "vipclub-1d04a.firebasestorage.app",
        messagingSenderId: "120667552740",
        appId: "1:120667552740:web:02085765fd43eb0080e5f1"
    };

    let database, auth;
    let currentUser = null;
    let gameHistory = [];
    let bannerMessages = [];
    let isSpinning = false;

    // ===== Symbols =====
    const SYMBOLS = ['🍒', '🍋', '🍊', '🍇', '🔔', '💎', '7️⃣', '👑'];
    const MULTIPLIERS = {
        '👑': 5,
        '💎': 4,
        '7️⃣': 3,
        '🔔': 2.5
    };

    // ===== Initialize Firebase =====
    function initFirebase() {
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            database = firebase.database();
            auth = firebase.auth();

            auth.onAuthStateChanged(async (user) => {
                if (user) {
                    await loadUserData(user.uid);
                } else {
                    currentUser = null;
                    updateUI();
                }
            });
        } catch (error) {
            console.error('Firebase init error:', error);
        }
    }

    // ===== Load User Data =====
    async function loadUserData(uid) {
        try {
            const snapshot = await database.ref('users/' + uid).once('value');
            if (snapshot.exists()) {
                currentUser = snapshot.val();
                currentUser.uid = uid;
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                updateUI();
                loadGameHistory();
                listenNotifications();
            } else {
                const newUser = {
                    nickname: 'لاعب',
                    username: 'player_' + Date.now(),
                    balanceEGP: 0,
                    balanceUSD: 0,
                    numericId: Math.floor(100000 + Math.random() * 900000),
                    createdAt: new Date().toISOString()
                };
                await database.ref('users/' + uid).set(newUser);
                currentUser = { ...newUser, uid };
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                updateUI();
            }
        } catch (error) {
            console.error('Load user error:', error);
        }
    }

    function getUser() {
        if (currentUser) return currentUser;
        try {
            return JSON.parse(localStorage.getItem('currentUser'));
        } catch { return null; }
    }

    function isLoggedIn() {
        return getUser() !== null;
    }

    // ===== Save User to Firebase =====
    async function saveUserToFirebase(userData) {
        if (!userData || !userData.uid) return false;
        try {
            await database.ref('users/' + userData.uid).update({
                balanceEGP: userData.balanceEGP || 0,
                balanceUSD: userData.balanceUSD || 0,
                nickname: userData.nickname || userData.username,
                updatedAt: new Date().toISOString()
            });
            localStorage.setItem('currentUser', JSON.stringify(userData));
            currentUser = userData;
            return true;
        } catch (error) {
            console.error('Save user error:', error);
            return false;
        }
    }

    // ===== Load Game History =====
    async function loadGameHistory() {
        try {
            const snapshot = await database.ref('gameHistory').once('value');
            if (snapshot.exists()) {
                gameHistory = snapshot.val() || [];
            }
            renderHistory();
        } catch (error) {
            console.error('Load history error:', error);
        }
    }

    async function saveGameHistory() {
        try {
            await database.ref('gameHistory').set(gameHistory.slice(0, 100));
        } catch (error) {
            console.error('Save history error:', error);
        }
    }

    // ===== Notifications =====
    function listenNotifications() {
        if (!database || !currentUser || !currentUser.uid) return;
        const notifRef = database.ref('users/' + currentUser.uid + '/notifications');
        notifRef.on('value', (snapshot) => {
            let unread = 0;
            if (snapshot.exists()) {
                for (const key in snapshot.val()) {
                    if (!snapshot.val()[key].read) unread++;
                }
            }
            document.getElementById('notifBadge').textContent = unread;
        });
    }

    function openNotifications() {
        if (!isLoggedIn()) { alert('يرجى تسجيل الدخول'); return; }
        alert('📬 الإشعارات:\n' + (gameHistory.length ? 'آخر جولة: ' + gameHistory[0].result : 'لا توجد إشعارات'));
    }

    function openProfile() {
        const user = getUser();
        if (!user) { alert('يرجى تسجيل الدخول'); return; }
        alert(`👤 ${user.nickname || user.username}\n🆔 ${String(user.numericId).padStart(6, '0')}\n💰 EGP: ${(user.balanceEGP || 0).toFixed(2)}\n💵 USD: ${(user.balanceUSD || 0).toFixed(2)}`);
    }

    // ===== UI Update =====
    function updateUI() {
        const user = getUser();
        document.getElementById('pName').textContent = user?.nickname || user?.username || 'زائر';
        document.getElementById('pId').textContent = user?.numericId ? String(user.numericId).padStart(6, '0') : '000000';
        document.getElementById('pEgp').textContent = (user?.balanceEGP || 0).toFixed(2);
        document.getElementById('pUsd').textContent = (user?.balanceUSD || 0).toFixed(2);

        document.querySelectorAll('.auth-only').forEach(el => {
            el.classList.toggle('hidden-guest', !isLoggedIn());
        });
    }

    // ===== Render History =====
    function renderHistory() {
        const panel = document.getElementById('historyPanel');
        if (!gameHistory.length) {
            panel.innerHTML = '<div class="history-item" style="color:#64748b;">لا توجد جولات بعد</div>';
            return;
        }
        panel.innerHTML = gameHistory.slice(0, 30).map(h => `
            <div class="history-item">
                <span>${h.time || ''}</span>
                <span class="${h.win ? 'win-text' : 'lose-text'}">${h.result} (${h.win ? '+' : ''}${h.amount} EGP)</span>
            </div>
        `).join('');
    }

    // ===== Add Banner =====
    function addBanner(msg) {
        bannerMessages.unshift({ text: msg, time: Date.now() });
        if (bannerMessages.length > 30) bannerMessages = bannerMessages.slice(0, 30);
        renderBanners();
    }

    function renderBanners() {
        const container = document.getElementById('bannerContainer');
        container.innerHTML = bannerMessages.slice(0, 5).map(b => `
            <div class="banner-item"><i class="fas fa-trophy"></i> ${b.text}</div>
        `).join('');
    }

    // ===== Show Alert =====
    function showAlert(message, type) {
        const alertDiv = document.getElementById('firebaseAlert');
        alertDiv.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i> ${message}`;
        alertDiv.className = `firebase-alert firebase-${type}`;
        alertDiv.style.display = 'flex';
        setTimeout(() => { alertDiv.style.display = 'none'; }, 4000);
    }

    // ===== SLOT MACHINE =====
    function getRandomSymbol() {
        return SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
    }

    function calculateWin(symbols, bet) {
        const [s1, s2, s3] = symbols;
        // All three same
        if (s1 === s2 && s2 === s3) {
            const multiplier = MULTIPLIERS[s1] || 3;
            return { win: true, amount: bet * multiplier, multiplier: multiplier };
        }
        // Two same
        if (s1 === s2 || s2 === s3 || s1 === s3) {
            return { win: true, amount: bet * 1.8, multiplier: 1.8 };
        }
        return { win: false, amount: 0, multiplier: 0 };
    }

    async function spinSlot() {
        if (!isLoggedIn()) { showAlert('يرجى تسجيل الدخول أولاً', 'warning'); return; }
        if (isSpinning) return;

        const user = getUser();
        const bet = parseFloat(document.getElementById('betAmount').value) || 5;
        if (bet <= 0) { showAlert('أدخل مبلغ صحيح', 'error'); return; }

        const bal = parseFloat(user.balanceEGP) || 0;
        if (bal < bet) { showAlert('⚠️ رصيد غير كافٍ', 'error'); return; }

        isSpinning = true;
        const btn = document.getElementById('spinBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جارٍ...';

        const reels = [
            document.getElementById('reel1'),
            document.getElementById('reel2'),
            document.getElementById('reel3')
        ];

        // Remove winner class
        reels.forEach(r => r.classList.remove('winner'));

        // Spin animation
        let spinCount = 0;
        const maxSpins = 10 + Math.floor(Math.random() * 8);
        const interval = setInterval(() => {
            reels.forEach(r => {
                r.textContent = getRandomSymbol();
                r.classList.add('spinning');
            });
            spinCount++;
            if (spinCount >= maxSpins) {
                clearInterval(interval);
                reels.forEach(r => r.classList.remove('spinning'));

                // Final result
                const results = reels.map(r => r.textContent);
                const result = calculateWin(results, bet);
                const delta = result.win ? result.amount - bet : -bet;
                const newBal = bal + delta;

                // Update user balance
                user.balanceEGP = newBal;
                await saveUserToFirebase(user);

                // Update UI
                updateUI();

                // Show result
                const resultDisplay = document.getElementById('resultDisplay');
                if (result.win) {
                    reels.forEach(r => r.classList.add('winner'));
                    resultDisplay.className = 'result-box win';
                    resultDisplay.innerHTML = `🎉 فوز! ${results.join(' ')} — ربحت ${result.amount.toFixed(2)} EGP (×${result.multiplier})`;
                    const msg = `🎰 ${user.nickname || user.username} ربح ${result.amount.toFixed(2)} EGP في ماكينة الحظ!`;
                    addBanner(msg);
                    showAlert(`🎉 فوز! ربحت ${result.amount.toFixed(2)} EGP`, 'success');
                } else {
                    resultDisplay.className = 'result-box lose';
                    resultDisplay.innerHTML = `😞 خسارة — ${results.join(' ')} (${bet.toFixed(2)} EGP)`;
                    showAlert(`😞 خسارة ${bet.toFixed(2)} EGP`, 'error');
                }

                // Add to history
                const entry = {
                    symbols: results.join(' '),
                    bet: bet,
                    result: result.win ? `ربح ${result.amount.toFixed(2)}` : 'خسارة',
                    amount: delta,
                    win: result.win,
                    time: new Date().toLocaleString('ar-EG')
                };
                gameHistory.unshift(entry);
                if (gameHistory.length > 100) gameHistory = gameHistory.slice(0, 100);
                await saveGameHistory();
                renderHistory();

                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-play"></i> سحب';
                isSpinning = false;
            }
        }, 80);
    }

    // ===== Init =====
    function init() {
        initFirebase();
        updateUI();
        loadGameHistory();

        // Auto-update every 10 seconds
        setInterval(() => {
            const user = getUser();
            if (user) updateUI();
        }, 10000);
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
