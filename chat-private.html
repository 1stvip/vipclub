<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💬 الشات الخاص - كوكبة</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        /* ===== أنماط خاصة بالشات الخاص ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0a0a1a, #1a1040, #0f0c29);
            min-height: 100vh;
            color: white;
            display: flex;
            flex-direction: column;
        }

        /* ===== شريط التنقل ===== */
        .navbar {
            background: rgba(10, 10, 30, 0.95);
            backdrop-filter: blur(15px);
            padding: 0.6rem 4%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(255, 215, 0, 0.15);
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 65px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 800;
            color: #ffd700;
            text-decoration: none;
        }

        .logo i {
            font-size: 1.5rem;
        }

        .nav-icons {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nav-btn {
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: #f8fafc;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.8rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }

        .nav-btn:hover {
            background: #8b5cf6;
            border-color: #8b5cf6;
            transform: translateY(-2px);
        }

        .nav-btn.active {
            background: #8b5cf6;
            border-color: #8b5cf6;
        }

        .nav-btn .badge {
            background: #ef4444;
            color: white;
            font-size: 0.6rem;
            padding: 1px 6px;
            border-radius: 50%;
            min-width: 18px;
            text-align: center;
        }

        .back-btn {
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: #f8fafc;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.8rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }

        .back-btn:hover {
            background: #8b5cf6;
            border-color: #8b5cf6;
            transform: translateY(-2px);
        }

        /* ===== المحتوى الرئيسي ===== */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            padding: 10px 15px;
            height: calc(100vh - 75px);
            max-height: calc(100vh - 75px);
        }

        /* ===== رأس الشات ===== */
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .chat-header .partner-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header .partner-info .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, #4f46e5, #8b5cf6);
        }

        .chat-header .partner-info .details .name {
            font-weight: 700;
            font-size: 1rem;
            color: #fff;
        }

        .chat-header .partner-info .details .status {
            font-size: 0.7rem;
            color: #94a3b8;
        }

        .chat-header .partner-info .details .status.online {
            color: #10b981;
        }

        .chat-header .actions {
            display: flex;
            gap: 6px;
        }

        .chat-header .actions button {
            padding: 6px 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(255, 255, 255, 0.05);
            color: #94a3b8;
        }

        .chat-header .actions button:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .chat-header .actions .btn-call {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
        }

        .chat-header .actions .btn-call:hover {
            background: rgba(16, 185, 129, 0.25);
        }

        .chat-header .actions .btn-video-call {
            background: rgba(59, 130, 246, 0.15);
            color: #3b82f6;
        }

        .chat-header .actions .btn-video-call:hover {
            background: rgba(59, 130, 246, 0.25);
        }

        .chat-header .actions .btn-block {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }

        .chat-header .actions .btn-block:hover {
            background: rgba(239, 68, 68, 0.25);
        }

        /* ===== رسائل الشات ===== */
        .chat-messages {
            flex: 1;
            padding: 10px 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: rgba(255, 255, 255, 0.01);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            min-height: 0;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 215, 0, 0.12);
            border-radius: 10px;
        }

        /* ===== رسالة ===== */
        .message-wrapper {
            display: flex;
            flex-direction: column;
            animation: fadeInMsg 0.3s ease;
            max-width: 85%;
        }

        .message-wrapper.own {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message-wrapper.other {
            align-self: flex-start;
            align-items: flex-start;
        }

        @keyframes fadeInMsg {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-bubble {
            padding: 8px 14px;
            border-radius: 14px;
            font-size: 0.9rem;
            line-height: 1.5;
            word-wrap: break-word;
            max-width: 100%;
            position: relative;
        }

        .message-wrapper.own .message-bubble {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.25), rgba(118, 75, 162, 0.2));
            border: 1px solid rgba(102, 126, 234, 0.1);
            border-radius: 14px 14px 4px 14px;
        }

        .message-wrapper.other .message-bubble {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 14px 14px 14px 4px;
        }

        .message-wrapper .message-time {
            font-size: 0.55rem;
            color: #666;
            margin-top: 2px;
            padding: 0 4px;
        }

        .message-wrapper.own .message-time {
            text-align: left;
        }

        .message-wrapper.other .message-time {
            text-align: right;
        }

        .message-wrapper .message-sender {
            font-size: 0.65rem;
            color: #94a3b8;
            margin-bottom: 2px;
            font-weight: 600;
        }

        .message-wrapper.own .message-sender {
            display: none;
        }

        /* ===== رسالة نظام ===== */
        .system-message {
            text-align: center;
            font-size: 0.7rem;
            color: #666;
            padding: 4px 12px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            align-self: center;
            max-width: 80%;
        }

        /* ===== رسالة مكالمة ===== */
        .call-message {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.1);
            border-radius: 12px;
            align-self: center;
            max-width: 90%;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .call-message .call-icon {
            font-size: 1.2rem;
        }

        .call-message .call-icon.missed {
            color: #ef4444;
        }

        .call-message .call-icon.answered {
            color: #10b981;
        }

        /* ===== رسالة هدية ===== */
        .gift-message {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255, 215, 0, 0.06);
            border: 1px solid rgba(255, 215, 0, 0.08);
            border-radius: 12px;
            align-self: center;
            max-width: 90%;
            font-size: 0.85rem;
        }

        .gift-message .gift-emoji {
            font-size: 1.5rem;
        }

        .gift-message .gift-text {
            color: #ffd700;
        }

        /* ===== مدخل الشات ===== */
        .chat-input-area {
            display: flex;
            gap: 8px;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 10px;
            flex-shrink: 0;
            align-items: center;
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            color: white;
            outline: none;
            font-size: 0.9rem;
        }

        .chat-input-area input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .chat-input-area input:focus {
            border-color: rgba(139, 92, 246, 0.3);
        }

        .chat-input-area .send-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .chat-input-area .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.3);
        }

        .chat-input-area .gift-btn {
            padding: 10px 14px;
            background: rgba(255, 215, 0, 0.1);
            color: #ffd700;
            border: 1px solid rgba(255, 215, 0, 0.1);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .chat-input-area .gift-btn:hover {
            background: rgba(255, 215, 0, 0.2);
            transform: scale(1.05);
        }

        .chat-input-area .call-btn-input {
            padding: 10px 14px;
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.1);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .chat-input-area .call-btn-input:hover {
            background: rgba(16, 185, 129, 0.2);
            transform: scale(1.05);
        }

        /* ===== زر التمرير للأسفل ===== */
        .scroll-down-btn {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(102, 126, 234, 0.3);
            border: 1px solid rgba(102, 126, 234, 0.15);
            color: white;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.3s;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50;
            backdrop-filter: blur(10px);
        }

        .scroll-down-btn.visible {
            display: flex;
            animation: fadeInBtn 0.3s ease;
        }

        @keyframes fadeInBtn {
            from {
                opacity: 0;
                transform: translateX(-50%) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) scale(1);
            }
        }

        .scroll-down-btn:hover {
            background: rgba(102, 126, 234, 0.5);
            transform: translateX(-50%) scale(1.1);
        }

        .chat-messages-container {
            position: relative;
            flex: 1;
            min-height: 0;
        }

        /* ===== توست ===== */
        .toast {
            position: fixed;
            top: 80px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            z-index: 100000;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            animation: slideIn 0.3s ease;
            max-width: 320px;
            font-size: 0.85rem;
            backdrop-filter: blur(10px);
        }

        .toast.success {
            background: rgba(16, 185, 129, 0.9);
        }
        .toast.error {
            background: rgba(239, 68, 68, 0.9);
        }
        .toast.warning {
            background: rgba(245, 158, 11, 0.9);
        }
        .toast.info {
            background: rgba(59, 130, 246, 0.9);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* ===== مودال الهدايا ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #1a1a2e;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 25px;
            max-width: 450px;
            width: 95%;
            max-height: 90vh;
            overflow-y: auto;
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal h3 {
            color: #ffd700;
            margin-bottom: 15px;
            text-align: center;
        }

        .modal .gift-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px;
            margin-bottom: 15px;
        }

        .modal .gift-grid .gift-option {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal .gift-grid .gift-option:hover {
            border-color: #8b5cf6;
            transform: translateY(-2px);
        }

        .modal .gift-grid .gift-option.selected {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.08);
        }

        .modal .gift-grid .gift-option .emoji {
            font-size: 2rem;
            display: block;
        }

        .modal .gift-grid .gift-option .name {
            font-size: 0.65rem;
            color: #94a3b8;
        }

        .modal .gift-grid .gift-option .price {
            font-size: 0.6rem;
            color: #10b981;
            font-weight: 700;
        }

        .modal .modal-actions {
            display: flex;
            gap: 10px;
        }

        .modal .modal-actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.9rem;
        }

        .modal .modal-actions .btn-send {
            background: #8b5cf6;
            color: white;
        }

        .modal .modal-actions .btn-send:hover {
            background: #7c3aed;
            transform: translateY(-2px);
        }

        .modal .modal-actions .btn-cancel {
            background: rgba(255, 255, 255, 0.05);
            color: #94a3b8;
        }

        .modal .modal-actions .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* ===== مودال المكالمة ===== */
        .call-modal {
            background: #1a1a2e;
            border: 2px solid rgba(255, 215, 0, 0.2);
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 95%;
            text-align: center;
            animation: popIn 0.3s ease;
        }

        .call-modal .caller-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, #4f46e5, #8b5cf6);
            margin: 0 auto 15px;
        }

        .call-modal .caller-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
        }

        .call-modal .call-type {
            font-size: 0.9rem;
            color: #94a3b8;
            margin: 5px 0 15px;
        }

        .call-modal .call-timer {
            font-size: 2rem;
            font-weight: 700;
            color: #ffd700;
            font-family: 'Courier New', monospace;
            margin: 10px 0;
        }

        .call-modal .call-actions {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .call-modal .call-actions button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .call-modal .call-actions .btn-end-call {
            background: #ef4444;
            color: white;
        }

        .call-modal .call-actions .btn-end-call:hover {
            background: #dc2626;
            transform: scale(1.1);
        }

        .call-modal .call-actions .btn-mute-call {
            background: rgba(255, 255, 255, 0.05);
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .call-modal .call-actions .btn-mute-call:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .call-modal .call-actions .btn-mute-call.muted {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.2);
        }

        /* ===== إشعار مكالمة واردة ===== */
        .incoming-call-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 99999;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .incoming-call-overlay.active {
            display: flex;
        }

        .incoming-call-box {
            background: #1a1a2e;
            border: 2px solid rgba(255, 215, 0, 0.2);
            border-radius: 24px;
            padding: 35px 40px;
            max-width: 380px;
            width: 95%;
            text-align: center;
            animation: popIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .incoming-call-box .caller-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, #4f46e5, #8b5cf6);
            margin: 0 auto 15px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.4);
            }
            50% {
                box-shadow: 0 0 0 20px rgba(139, 92, 246, 0);
            }
        }

        .incoming-call-box .caller-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
        }

        .incoming-call-box .call-type {
            font-size: 0.9rem;
            color: #94a3b8;
            margin: 5px 0 20px;
        }

        .incoming-call-box .call-actions {
            display: flex;
            gap: 30px;
            justify-content: center;
        }

        .incoming-call-box .call-actions button {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .incoming-call-box .call-actions .btn-accept {
            background: #10b981;
            color: white;
        }

        .incoming-call-box .call-actions .btn-accept:hover {
            background: #059669;
            transform: scale(1.1);
        }

        .incoming-call-box .call-actions .btn-reject {
            background: #ef4444;
            color: white;
        }

        .incoming-call-box .call-actions .btn-reject:hover {
            background: #dc2626;
            transform: scale(1.1);
        }

        /* ===== استجابة ===== */
        @media (max-width: 768px) {
            .navbar {
                padding: 0.6rem 2%;
            }
            .logo {
                font-size: 0.9rem;
            }
            .logo i {
                font-size: 1.2rem;
            }
            .nav-btn {
                padding: 6px 12px;

    <script>
        // ============================================================

        const firebaseConfig = {
            apiKey: "AIzaSyAX0jz_yOGagteO5R5ZHji1ZG44fk--Zvs",
            authDomain: "stvipclub.firebaseapp.com",
            databaseURL: "https://stvipclub-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "stvipclub",

            messagingSenderId: "526607326044",

            measurementId: "G-QZQMQCH9N9"
        };

        // ============================================================
        // 📋 المتغيرات العامة
        // ============================================================
        let database;
        let currentUser = null;
        let currentFirebaseUserId = null;
        let partnerId = null;
        let partnerData = null;
        let chatMessages = [];
        let chatListener = null;
        let isCallActive = false;
        let isCaller = false;
        let callPartnerId = null;
        let callStartTime = null;
        let callTimerInterval = null;
        let callDurationSeconds = 0;
        let peer = null;
        let myPeerId = null;

        let isCallMuted = false;
        let incomingCallData = null;
        let callType = 'audio';

        // الهدايا
        const GIFT_TYPES = [
            { id: 'rose', name: 'وردة', emoji: '🌹', price: 10 },
            { id: 'heart', name: 'قلب', emoji: '❤️', price: 15 },
            { id: 'chain', name: 'سلسلة', emoji: '🔗', price: 30 },
            { id: 'silver_ring', name: 'خاتم فضي', emoji: '💍', price: 200 },
            { id: 'diamond_ring', name: 'خاتم ألماس', emoji: '💎', price: 500 },
            { id: 'gold_ring', name: 'خاتم ذهب', emoji: '👑', price: 2500 }
        ];

        let selectedGift = null;

        // ============================================================
        // 🍞 توست
        // ============================================================
        function showToast(message, type = 'info') {
            const colors = {
                success: 'rgba(16,185,129,0.9)',
                error: 'rgba(239,68,68,0.9)',
                warning: 'rgba(245,158,11,0.9)',
                info: 'rgba(59,130,246,0.9)'
            };
            const old = document.querySelector('.toast');
            if (old) old.remove();
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.style.background = colors[type] || colors.info;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(30px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // ============================================================
        // 🔥 تهيئة Firebase
        // ============================================================
        async function initializeFirebase() {
            try {
                if (firebase.apps.length > 0) await firebase.app().delete();
                firebase.initializeApp(firebaseConfig);
                database = firebase.database();
                console.log('✅ Firebase initialized');
            } catch (error) {
                console.error('❌ Firebase error:', error);
            }
        }

        // ============================================================
        // 👤 المستخدم
        // ============================================================
        function getStoredUser() {
            try { return JSON.parse(localStorage.getItem('currentUser')); } catch (e) { return null; }
        }

        function isLoggedIn() { return getStoredUser() !== null; }

        function generateNumericId() { return Math.floor(100000 + Math.random() * 900000); }

        async function getCurrentUserFullData() {
            try {
                const stored = getStoredUser();
                if (!stored) return null;
                if (!database) return stored;
                const numericId = stored.numericId || generateNumericId();
                if (!stored.numericId) {
                    stored.numericId = numericId;
                    localStorage.setItem('currentUser', JSON.stringify(stored));
                }
                const snapshot = await database.ref('users')
                    .orderByChild('numericId')
                    .equalTo(numericId)
                    .once('value');
                if (snapshot.exists()) {
                    const userData = snapshot.val();
                    const firebaseKey = Object.keys(userData)[0];
                    const fullUser = userData[firebaseKey];
                    const merged = { ...stored, ...fullUser, numericId: numericId, firebaseKey: firebaseKey };
                    localStorage.setItem('currentUser', JSON.stringify(merged));
                    currentFirebaseUserId = firebaseKey;
                    return merged;
                }
                return stored;
            } catch (e) { return getStoredUser(); }
        }

        // ============================================================
        // 🔗 الحصول على معرف الشريك
        // ============================================================
        function getPartnerIdFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('user');
        }

        // ============================================================
        // 📊 تحميل بيانات الشريك
        // ============================================================
        async function loadPartnerData() {
            const partnerIdParam = getPartnerIdFromURL();
            if (!partnerIdParam) {
                showToast('❌ لم يتم تحديد المستخدم', 'error');
                setTimeout(() => window.location.href = 'friends.html', 2000);
                return;
            }

            partnerId = parseInt(partnerIdParam);

            try {
                const snapshot = await database.ref('users')
                    .orderByChild('numericId')
                    .equalTo(partnerId)
                    .once('value');

                if (!snapshot.exists()) {
                    showToast('❌ المستخدم غير موجود', 'error');
                    setTimeout(() => window.location.href = 'friends.html', 2000);
                    return;
                }

                const userData = snapshot.val();
                const userKey = Object.keys(userData)[0];
                partnerData = userData[userKey];
                partnerData.firebaseKey = userKey;

                // تحديث الواجهة
                document.getElementById('partnerName').textContent = partnerData.nickname || partnerData.username ||
                'مستخدم';
                document.getElementById('partnerAvatar').textContent = (partnerData.nickname || partnerData.username || 'U')
                    .charAt(0).toUpperCase();

                if (partnerData.isOnline) {
                    document.getElementById('partnerStatus').textContent = '🟢 متصل';
                    document.getElementById('partnerStatus').className = 'status online';
                } else {
                    document.getElementById('partnerStatus').textContent = '⚪ غير متصل';
                    document.getElementById('partnerStatus').className = 'status';
                }

                // التحقق من الحظر
                const blockedSnapshot = await database.ref('users/' + currentFirebaseUserId + '/blocked/' + partnerId)
                    .once('value');
                if (blockedSnapshot.exists()) {
                    document.querySelector('.actions .btn-block').textContent = '🔓 إلغاء الحظر';
                    document.querySelector('.actions .btn-block').onclick = unblockUser;
                }

                // تحميل الرسائل
                await loadChatMessages();

                // الاستماع للرسائل الجديدة
                listenForNewMessages();

                // تحديث حالة القراءة
                await markMessagesAsRead();

                // الاستماع لتحديثات حالة الشريك
                listenForPartnerStatus();

            } catch (error) {
                console.error('Error loading partner:', error);
                showToast('❌ حدث خطأ', 'error');
            }
        }

        // ============================================================
        // 💬 تحميل رسائل الشات
        // ============================================================
        async function loadChatMessages() {
            if (!database || !currentUser || !partnerId) return;

            try {
                const chatId = getChatId();
                const snapshot = await database.ref('chats/' + chatId + '/messages')
                    .orderByChild('timestamp')
                    .limitToLast(50)
                    .once('value');

                chatMessages = [];

                if (snapshot.exists()) {
                    const messagesData = snapshot.val();
                    for (const key in messagesData) {
                        chatMessages.push({
                            key: key,
                            ...messagesData[key]
                        });
                    }
                }

                // ترتيب من الأقدم للأحدث
                chatMessages.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

                renderMessages();

                // التمرير للأسفل
                setTimeout(scrollToBottom, 100);

            } catch (error) {
                console.error('Error loading messages:', error);
            }
        }

        // ============================================================
        // 🆔 معرف الشات
        // ============================================================
        function getChatId() {
            if (!currentUser || !partnerId) return null;
            const ids = [currentUser.numericId, partnerId].sort((a, b) => a - b);
            return 'chat_' + ids.join('_');
        }

        // ============================================================
        // 📝 عرض الرسائل
        // ============================================================
        function renderMessages() {
            const container = document.getElementById('chatMessages');

            if (chatMessages.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center;padding:30px 10px;color:#666;font-size:0.85rem;">
                        <div style="font-size:2rem;margin-bottom:10px;">💬</div>
                        <p>لا توجد رسائل بعد</p>
                        <p style="font-size:0.7rem;color:#444;">ابدأ المحادثة الآن</p>
                    </div>
                `;
                return;
            }

            let html = '';

            for (const msg of chatMessages) {
                const isOwn = msg.senderId == currentUser.numericId;

                if (msg.type === 'system') {
                    html += `
                        <div class="system-message">${msg.text}</div>
                    `;
                    continue;
                }

                if (msg.type === 'call') {
                    const icon = msg.callStatus === 'missed' ? 'missed' : 'answered';
                    const iconClass = msg.callStatus === 'missed' ? 'missed' : 'answered';
                    const iconEmoji = msg.callStatus === 'missed' ? '📞❌' : '📞✅';
                    html += `
                        <div class="call-message">
                            <span class="call-icon ${iconClass}">${iconEmoji}</span>
                            <span>${msg.text}</span>
                            <span style="font-size:0.6rem;color:#666;">${formatTime(msg.timestamp)}</span>
                        </div>
                    `;
                    continue;
                }

                if (msg.type === 'gift') {
                    html += `
                        <div class="gift-message">
                            <span class="gift-emoji">${msg.giftEmoji || '🎁'}</span>
                            <span class="gift-text">${msg.text}</span>
                            <span style="font-size:0.6rem;color:#666;">${formatTime(msg.timestamp)}</span>
                        </div>
                    `;
                    continue;
                }

                html += `
                    <div class="message-wrapper ${isOwn ? 'own' : 'other'}">
                        ${!isOwn ? `<div class="message-sender">${partnerData?.nickname || partnerData?.username || 'مستخدم'}</div>` : ''}
                        <div class="message-bubble">${msg.text}</div>
                        <div class="message-time">${formatTime(msg.timestamp)}</div>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        // ============================================================
        // ⏱️ تنسيق الوقت
        // ============================================================
        function formatTime(timestamp) {
            if (!timestamp) return '';
            const date = new Date(timestamp);
            return date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        }

        // ============================================================
        // 📨 الاستماع للرسائل الجديدة
        // ============================================================
        function listenForNewMessages() {
            if (!database || !currentUser || !partnerId) return;

            const chatId = getChatId();
            if (!chatId) return;

            if (chatListener) {
                database.ref('chats/' + chatId + '/messages').off();
            }

            chatListener = database.ref('chats/' + chatId + '/messages')
                .orderByChild('timestamp')
                .startAt(Date.now() - 1000)
                .on('child_added', (snapshot) => {
                    const msg = snapshot.val();
                    if (msg && msg.senderId != currentUser.numericId) {
                        // رسالة جديدة من الشريك
                        chatMessages.push({
                            key: snapshot.key,
                            ...msg
                        });
                        renderMessages();
                        scrollToBottom();

                        // تحديث حالة القراءة
                        if (!msg.read) {
                            database.ref('chats/' + chatId + '/messages/' + snapshot.key + '/read').set(true);
                        }
                    }
                });
        }

        // ============================================================
        // ✅ تحديث حالة القراءة
        // ============================================================
        async function markMessagesAsRead() {
            if (!database || !currentUser || !partnerId) return;

            const chatId = getChatId();
            if (!chatId) return;

            try {
                const snapshot = await database.ref('chats/' + chatId + '/messages')
                    .orderByChild('senderId')
                    .equalTo(partnerId)
                    .once('value');

                if (snapshot.exists()) {
                    const updates = {};
                    const messages = snapshot.val();
                    for (const key in messages) {
                        if (!messages[key].read) {
                            updates[key + '/read'] = true;
                        }
                    }
                    if (Object.keys(updates).length > 0) {
                        await database.ref('chats/' + chatId + '/messages').update(updates);
                    }
                }
            } catch (error) {
                console.error('Error marking messages as read:', error);
            }
        }

        // ============================================================
        // 🔄 الاستماع لحالة الشريك
        // ============================================================
        function listenForPartnerStatus() {
            if (!database || !partnerData) return;

            database.ref('users/' + partnerData.firebaseKey).on('value', (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    partnerData.isOnline = data.isOnline || false;
                    partnerData.isBanned = data.isBanned || false;

                    if (partnerData.isBanned) {
                        document.getElementById('partnerStatus').textContent = '🚫 محظور';
                        document.getElementById('partnerStatus').className = 'status';
                    } else if (partnerData.isOnline) {
                        document.getElementById('partnerStatus').textContent = '🟢 متصل';
                        document.getElementById('partnerStatus').className = 'status online';
                    } else {
                        document.getElementById('partnerStatus').textContent = '⚪ غير متصل';
                        document.getElementById('partnerStatus').className = 'status';
                    }
                }
            });
        }

        // ============================================================
        // 📤 إرسال رسالة
        // ============================================================
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            if (!currentUser || !partnerId) {
                showToast('❌ خطأ في البيانات', 'error');
                return;
            }

            try {
                const chatId = getChatId();
                if (!chatId) return;

                const msg = {
                    senderId: currentUser.numericId,
                    senderName: currentUser.nickname || currentUser.username || 'مستخدم',
                    text: text,
                    timestamp: Date.now(),
                    read: false,
                    type: 'text'
                };

                await database.ref('chats/' + chatId + '/messages').push(msg);

                // إضافة الرسالة محلياً
                chatMessages.push(msg);
                renderMessages();
                scrollToBottom();

                input.value = '';
                input.focus();

            } catch (error) {
                console.error('Error sending message:', error);

        function selectGift(giftId) {
            document.querySelectorAll('.gift-option').forEach(el => el.classList.remove('selected'));
            const selected = document.querySelector(`.gift-option[data-gift-id="${giftId}"]`);
            if (selected) {

                selectedGift = GIFT_TYPES.find(g => g.id === giftId);

        async function sendGift() {
            if (!selectedGift) {
                showToast('⚠️ اختر هدية أولاً', 'warning');
                return;
            }

            if (!currentUser || !partnerId) {
                showToast('⚠️ يرجى تسجيل الدخول', 'warning');
                return;
            }

            if (currentUser.balanceEGP < selectedGift.price) {
                showToast(`⚠️ رصيد غير كافٍ (تحتاج ${selectedGift.price} ج.م)`, 'warning');
                return;
            }

            try {
                // خصم الرصيد
                const newBalance = (currentUser.balanceEGP || 0) - selectedGift.price;
                await database.ref('users/' + currentFirebaseUserId + '/balanceEGP').set(newBalance);
                currentUser.balanceEGP = newBalance;
                localStorage.setItem('currentUser', JSON.stringify(currentUser));

                // إضافة الهدية لقائمة هدايا الشريك
                const partnerSnapshot = await database.ref('users')
                    .orderByChild('numericId')
                    .equalTo(partnerId)
                    .once('value');

                if (partnerSnapshot.exists()) {
                    const partnerData = partnerSnapshot.val();
                    const partnerKey = Object.keys(partnerData)[0];
                    const partnerUser = partnerData[partnerKey];

                    const giftsList = partnerUser.giftsList || [];
                    giftsList.push({
                        senderId: currentUser.numericId,
                        senderName: currentUser.nickname || currentUser.username || 'مستخدم',
                        giftType: selectedGift.id,
                        giftName: selectedGift.name,
                        giftEmoji: selectedGift.emoji,
                        value: selectedGift.price,
                        date: new Date().toLocaleString('ar-EG'),
                        timestamp: new Date().toISOString(),
                        fromChat: true
                    });

                    await database.ref('users/' + partnerKey).update({
                        giftsList: giftsList,
                        gifts: (partnerUser.gifts || 0) + 1,
                        updatedAt: new Date().toISOString()
                    });

                    // إشعار للشريك
                    await database.ref('users/' + partnerKey + '/notifications').push({
                        id: Date.now(),
                        text: `🎁 تلقيت ${selectedGift.emoji} ${selectedGift.name} من ${currentUser.nickname || currentUser.username} في الشات! 💰 ${selectedGift.price} ج.م`,
                        read: false,
                        date: new Date().toLocaleString('ar-EG'),
                        type: 'gift_received',
                        createdAt: new Date().toISOString()
                    });
                }

                // رسالة هدية في الشات
                const chatId = getChatId();
                if (chatId) {
                    const giftMsg = {
                        senderId: currentUser.numericId,
                        senderName: currentUser.nickname || currentUser.username || 'مستخدم',
                        text: `🎁 أرسل ${selectedGift.emoji} ${selectedGift.name} 💰 ${selectedGift.price} ج.م`,
                        giftEmoji: selectedGift.emoji,
                        giftName: selectedGift.name,
                        giftPrice: selectedGift.price,
                        timestamp: Date.now(),
                        read: false,
                        type: 'gift'
                    };
                    await database.ref('chats/' + chatId + '/messages').push(giftMsg);
                    chatMessages.push(giftMsg);
                    renderMessages();
                    scrollToBottom();
                }

                showToast(`✅ تم إرسال ${selectedGift.emoji} ${selectedGift.name}`, 'success');
                closeGiftModal();

            } catch (error) {
                console.error('Error sending gift:', error);
                showToast('❌ حدث خطأ', 'error');
            }
        }

        // ============================================================
        // 📞 نظام المكالمات (مع PeerJS)
        // ============================================================
        async function initPeerJS() {
            if (!currentUser) return;

            try {
                const peerId = 'chat_' + currentUser.numericId + '_' + Date.now();
                peer = new Peer(peerId, {
                    debug: 2,
                    config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
                });

                myPeerId = peer.id;

                peer.on('open', (id) => {
                    myPeerId = id;
                    console.log('✅ PeerJS ready:', id);
                });

                peer.on('call', (call) => {
                    handleIncomingCall(call);
                });

                peer.on('error', (err) => {
                    console.error('Peer error:', err);
                });

            } catch (error) {
                console.error('Error initializing PeerJS:', error);
            }
        }

        // ============================================================
        // 📞 بدء المكالمة
        // ============================================================
        async function initiateCall(type) {
            try {
                isCaller = true;

                // الحصول على وسائط الصوت والفيديو
                const constraints = {
                    audio: { echoCancellation: true, noiseSuppression: true }
                };

                if (type === 'video') {
                    constraints.video = { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } };
                }

                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                mediaStream = stream;
                isCallMuted = false;

                // إنشاء Peer إذا لم يكن موجوداً
                if (!peer) {
                    await initPeerJS();
                }

                // إرسال طلب مكالمة
                const callId = 'call_' + Date.now();

                await database.ref('call_requests/' + partnerId + '/' + callId).set({
                    callerId: currentUser.numericId,
                    callerName: currentUser.nickname || currentUser.username || 'مستخدم',
                    callerPeerId: myPeerId,
                    type: type,
                    status: 'pending',
                    createdAt: new Date().toISOString(),
                    expiresAt: new Date(Date.now() + 60000).toISOString()
                });

                // عرض واجهة المكالمة
                showCallUI(type);

                // انتظار قبول المكالمة
                let accepted = false;
                let attempts = 0;

                const checkInterval = setInterval(async () => {
                    attempts++;
                    try {
                        const statusSnapshot = await database.ref('call_requests/' + partnerId + '/' + callId)
                            .once('value');
                        const statusData = statusSnapshot.val();

                        if (!statusData || statusData.status === 'rejected' || statusData.status === 'expired') {
                            clearInterval(checkInterval);
                            showToast('❌ لم يقبل الشريك المكالمة', 'warning');
                            endCall();
                            return;
                        }

                        if (statusData.status === 'accepted') {
                            clearInterval(checkInterval);
                            accepted = true;

                            // بدء المكالمة مع PeerJS
                            const call = peer.call(partnerData.peerId || statusData.callerPeerId, stream);
                            if (call) {
                                call.on('stream', (remoteStream) => {
                                    // يمكن عرض الفيديو البعيد في نافذة منفصلة
                                    console.log('✅ Stream received');
                                });
                                call.on('close', () => {
                                    endCall();
                                });
                                window._currentCall = call;
                            }

                            // تحديث حالة المكالمة
                            isCallActive = true;
                            callPartnerId = partnerId;

                            // بدء المؤقت
                            callStartTime = Date.now();
                            callDurationSeconds = 0;
                            if (callTimerInterval) clearInterval(callTimerInterval);
                            callTimerInterval = setInterval(() => {
                                callDurationSeconds++;
                                const mins = Math.floor(callDurationSeconds / 60);
                                const secs = callDurationSeconds % 60;
                                document.getElementById('callTimer').textContent =
                                    `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                            }, 1000);

                            // حذف طلب المكالمة
                            database.ref('call_requests/' + partnerId + '/' + callId).remove();

                            // إضافة رسالة نظام
                            addCallMessage('📞 بدأت المكالمة');

                            showToast('✅ تم الاتصال', 'success');
                        }

                        if (attempts > 30) {
                            clearInterval(checkInterval);
                            if (!accepted) {
                                database.ref('call_requests/' + partnerId + '/' + callId).update({
                                    status: 'expired',
                                    expiredAt: new Date().toISOString()
                                });
                                showToast('⏰ انتهت مهلة الانتظار', 'warning');
                                endCall();
                            }
                        }
                    } catch (e) {
                        console.error('Check error:', e);
                    }
                }, 2000);

            } catch (error) {
                console.error('Error initiating call:', error);
                showToast('❌ حدث خطأ في بدء المكالمة', 'error');
                endCall();
            }
        }

        // ============================================================
        // 📞 معالجة مكالمة واردة
        // ============================================================
        function handleIncomingCall(call) {
            // يتم التعامل مع المكالمات عبر Firebase
            // لكن نضيف هذه الدالة للتوافق مع PeerJS
            if (call) {
                console.log('📞 Incoming call from:', call.peer);
            }
        }

        // ============================================================
        // 📞 الاستماع لطلبات المكالمات
        // ============================================================
        function listenForCallRequests() {
            if (!database || !currentUser) return;

            database.ref('call_requests/' + currentUser.numericId).on('child_added', (snapshot) => {
                const callData = snapshot.val();
                if (callData && callData.status === 'pending') {
                    showIncomingCall(snapshot.key, callData);
                }
            });
        }

        // ============================================================
        // 📞 عرض إشعار المكالمة الواردة
        // ============================================================
        function showIncomingCall(callId, callData) {
            if (document.getElementById('incomingCallOverlay').classList.contains('active')) return;

            incomingCallData = {
                callId: callId,
                callerId: callData.callerId,
                callerName: callData.callerName || 'مستخدم',
                callerPeerId: callData.callerPeerId,
                type: callData.type || 'audio'
            };

            document.getElementById('incomingCallerAvatar').textContent = incomingCallData.callerName.charAt(0)
            .toUpperCase();
            document.getElementById('incomingCallerName').textContent = incomingCallData.callerName;
            document.getElementById('incomingCallType').textContent =
                incomingCallData.type === 'video' ? '📹 مكالمة فيديو' : '🎧 مكالمة صوتية';

            document.getElementById('incomingCallOverlay').classList.add('active');

            // تشغيل صوت الرنين
            playRingtone();
        }

        // ============================================================
        // 🎵 رنين المكالمة
        // ============================================================
        function playRingtone() {
            try {
                const audio = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-phone-ringing-2874.mp3');
                audio.loop = true;
                audio.volume = 0.3;
                audio.play();
                window._ringtone = audio;
            } catch (e) {}
        }

        function stopRingtone() {
            try {
                if (window._ringtone) {
                    window._ringtone.pause();
                    window._ringtone = null;
                }
            } catch (e) {}
        }

        // ============================================================
        // ✅ قبول المكالمة الواردة
        // ============================================================
        async function acceptIncomingCall() {
            if (!incomingCallData) return;

            stopRingtone();
            document.getElementById('incomingCallOverlay').classList.remove('active');

            try {
                isCaller = false;
                callType = incomingCallData.type;

                // الحصول على وسائط الصوت والفيديو
                const constraints = {
                    audio: { echoCancellation: true, noiseSuppression: true }
                };

                if (callType === 'video') {
                    constraints.video = { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } };
                }

                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                mediaStream = stream;
                isCallMuted = false;

                // إنشاء Peer إذا لم يكن موجوداً
                if (!peer) {
                    await initPeerJS();
                }

                // الاتصال بالمستدعي
                const call = peer.call(incomingCallData.callerPeerId, stream);
                if (call) {
                    call.on('stream', (remoteStream) => {
                        console.log('✅ Stream received');
                    });
                    call.on('close', () => {
                        endCall();
                    });
                    window._currentCall = call;
                }

                // تحديث حالة المكالمة في Firebase
                await database.ref('call_requests/' + currentUser.numericId + '/' + incomingCallData.callId).update({
                    status: 'accepted',
                    acceptedAt: new Date().toISOString()
                });

                // تحديث حالة المكالمة
                isCallActive = true;
                callPartnerId = incomingCallData.callerId;

                // عرض واجهة المكالمة
                showCallUI(callType);

                // بدء المؤقت
                callStartTime = Date.now();
                callDurationSeconds = 0;
                if (callTimerInterval) clearInterval(callTimerInterval);
                callTimerInterval = setInterval(() => {
                    callDurationSeconds++;
                    const mins = Math.floor(callDurationSeconds / 60);
                    const secs = callDurationSeconds % 60;
                    document.getElementById('callTimer').textContent =
                        `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                }, 1000);

                // إضافة رسالة نظام
                addCallMessage('📞 بدأت المكالمة');

                showToast('✅ تم الاتصال', 'success');

                // حذف طلب المكالمة بعد فترة
                setTimeout(() => {
                    database.ref('call_requests/' + currentUser.numericId + '/' + incomingCallData.callId)
                        .remove();
                }, 5000);

            } catch (error) {
                console.error('Error accepting call:', error);
                showToast('❌ حدث خطأ', 'error');
                endCall();
            }
        }

        // ============================================================
        // ❌ رفض المكالمة الواردة
        // ============================================================
        function rejectIncomingCall() {
            if (!incomingCallData) return;

            stopRingtone();
            document.getElementById('incomingCallOverlay').classList.remove('active');

            // تحديث حالة المكالمة
            database.ref('call_requests/' + currentUser.numericId + '/' + incomingCallData.callId).update({
                status: 'rejected',
                rejectedAt: new Date().toISOString()
            });

            // حذف طلب المكالمة
            setTimeout(() => {
                database.ref('call_requests/' + currentUser.numericId + '/' + incomingCallData.callId).remove();
            }, 1000);

            // إضافة رسالة في الشات
            const chatId = getChatId();
            if (chatId) {
                const msg = {
                    senderId: 'system',
                    text: `📞 ❌ لم يقبل ${incomingCallData.callerName} المكالمة`,
                    timestamp: Date.now(),
                    type: 'call',
                    callStatus: 'missed'
                };
                database.ref('chats/' + chatId + '/messages').push(msg);
            }

            showToast('❌ تم رفض المكالمة', 'warning');
            incomingCallData = null;
        }

        // ============================================================
        // 📱 عرض واجهة المكالمة
        // ============================================================
        function showCallUI(type) {
            document.getElementById('callModal').classList.add('active');
            document.getElementById('callPartnerNameDisplay').textContent = partnerData?.nickname || partnerData?.username ||
                'مستخدم';
            document.getElementById('callTypeDisplay').textContent =
                type === 'video' ? '📹 مكالمة فيديو' : '🎧 مكالمة صوتية';
            document.getElementById('callAvatar').textContent = (partnerData?.nickname || partnerData?.username || 'U')
                .charAt(0).toUpperCase();
            document.getElementById('callTimer').textContent = '00:00';
            document.getElementById('callMuteBtn').className = 'btn-mute-call';
            document.getElementById('callMuteBtn').innerHTML = '<i class="fas fa-microphone"></i>';
        }

        // ============================================================
        // 🎤 كتم/فك كتم الميكروفون في المكالمة
        // ============================================================
        function toggleCallMute() {
            if (!mediaStream) return;

            isCallMuted = !isCallMuted;
            mediaStream.getAudioTracks().forEach(track => track.enabled = !isCallMuted);

            const btn = document.getElementById('callMuteBtn');
            if (isCallMuted) {
                btn.className = 'btn-mute-call muted';
                btn.innerHTML = '<i class="fas fa-microphone-slash"></i>';
            } else {
                btn.className = 'btn-mute-call';
                btn.innerHTML = '<i class="fas fa-microphone"></i>';
            }
        }

        // ============================================================
        // 📞 إنهاء المكالمة
        // ============================================================
        function endCall() {
            if (!isCallActive && !isCaller) {
                // إذا لم تكن المكالمة نشطة، فقط أغلق الواجهة
                closeCallUI();
                return;
            }

            isCallActive = false;

            // إيقاف المؤقت
            if (callTimerInterval) {
                clearInterval(callTimerInterval);
                callTimerInterval = null;
            }

            stopRingtone();

            // حساب المدة والتكلفة
            const durationMinutes = Math.ceil(callDurationSeconds / 60);
            const cost = durationMinutes * 10; // 10 جنيه للدقيقة

            // خصم الرصيد إذا كانت المكالمة أطول من 0 ثانية وكان المستخدم هو المتصل
            if (callDurationSeconds > 0 && isCaller && currentUser) {
                const newBalance = (currentUser.balanceEGP || 0) - cost;
                if (newBalance >= 0) {
                    database.ref('users/' + currentFirebaseUserId + '/balanceEGP').set(newBalance);
                    currentUser.balanceEGP = newBalance;
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    showToast(`💰 تم خصم ${cost} جنيه مقابل ${durationMinutes} دقيقة`, 'info');
                }
            }

            // إغلاق الاتصال
            if (window._currentCall) {
                try {
                    window._currentCall.close();
                } catch (e) {}
                window._currentCall = null;
            }

            // إغلاق الوسائط
            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
                mediaStream = null;
            }

            // إضافة رسالة نظام
            if (callDurationSeconds > 0) {
                addCallMessage(`📞 انتهت المكالمة (${durationMinutes} دقيقة)`);
            } else {
                addCallMessage('📞 انتهت المكالمة');
            }

            // تحديث حالة المستخدم
            if (database && currentFirebaseUserId) {
                database.ref('users/' + currentFirebaseUserId).update({
                    inCall: false,
                    callPartner: null,
                    updatedAt: new Date().toISOString()
                });
            }

            // حذف المكالمة النشطة
            if (database && currentUser) {
                database.ref('active_calls/' + currentUser.numericId).remove();
            }

            // إغلاق واجهة المكالمة
            closeCallUI();

            showToast('📞 تم إنهاء المكالمة', 'info');
        }

        // ============================================================
        // ❌ إغلاق واجهة المكالمة
        // ============================================================
        function closeCallUI() {
            document.getElementById('callModal').classList.remove('active');
            document.getElementById('incomingCallOverlay').classList.remove('active');

            isCallActive = false;
            isCaller = false;
            callPartnerId = null;
            callDurationSeconds = 0;
            incomingCallData = null;
        }

        // ============================================================
        // 📝 إضافة رسالة مكالمة في الشات
        // ============================================================
        function addCallMessage(text) {
            const chatId = getChatId();
            if (!chatId) return;

            const msg = {
                senderId: 'system',
                text: text,
                timestamp: Date.now(),
                type: 'call',
                callStatus: 'answered'
            };

            database.ref('chats/' + chatId + '/messages').push(msg);
            chatMessages.push(msg);
            renderMessages();
            scrollToBottom();
        }

        // ============================================================
        // 🚫 حظر المستخدم
        // ============================================================
        async function blockUser() {
            if (!partnerId) return;

            const reason = prompt('سبب الحظر (اختياري):');
            if (reason === null) return;

            try {
                await database.ref('users/' + currentFirebaseUserId + '/blocked/' + partnerId).set({
                    blockedAt: new Date().toISOString(),
                    reason: reason || ''
                });

                // حذف من الأصدقاء
                await database.ref('users/' + currentFirebaseUserId + '/friends/' + partnerId).remove();

                showToast('🚫 تم حظر المستخدم', 'warning');

                // تحديث الواجهة
                document.querySelector('.actions .btn-block').textContent = '🔓 إلغاء الحظر';
                document.querySelector('.actions .btn-block').onclick = unblockUser;

            } catch (error) {
                console.error('Error blocking user:', error);
                showToast('❌ حدث خطأ', 'error');
            }
        }

        // ============================================================
        // 🔓 إلغاء حظر المستخدم
        // ============================================================
        async function unblockUser() {
            if (!partnerId) return;

            try {
                await database.ref('users/' + currentFirebaseUserId + '/blocked/' + partnerId).remove();
                showToast('✅ تم إلغاء الحظر', 'success');

                // تحديث الواجهة
                document.querySelector('.actions .btn-block').textContent = '🚫 حظر';
                document.querySelector('.actions .btn-block').onclick = blockUser;

            } catch (error) {
                console.error('Error unblocking user:', error);
                showToast('❌ حدث خطأ', 'error');
            }
        }

        // ============================================================
        // 🚪 تسجيل الخروج
        // ============================================================
        async function logout() {
            if (isCallActive) endCall();
            try { if (firebase.auth) await firebase.auth().signOut(); } catch (e) {}
            localStorage.removeItem('currentUser');
            window.location.reload();
        }

        // ============================================================
        // 🚀 التهيئة
        // ============================================================
        window.onload = async function() {
            await initializeFirebase();

            const user = await getCurrentUserFullData();
            if (user) {
                currentUser = user;
                currentFirebaseUserId = user.firebaseKey;
                console.log('✅ User loaded:', user.nickname || user.username);

                // تحديث حالة المستخدم
                if (database && currentFirebaseUserId) {
                    database.ref('users/' + currentFirebaseUserId).update({
                        isOnline: true,
                        lastActive: new Date().toISOString()
                    });

                    window.addEventListener('beforeunload', function() {
                        if (isCallActive) endCall();
                        database.ref('users/' + currentFirebaseUserId).update({
                            isOnline: false,
                            inCall: false
                        });
                    });
                }

                // تحميل بيانات الشريك
                await loadPartnerData();

                // تهيئة PeerJS
                await initPeerJS();

                // الاستماع لطلبات المكالمات
                listenForCallRequests();

                // تحديث شارات الأصدقاء
                updateFriendRequestsBadge();

                // إظهار التنقل السفلي للجوال
                if (window.innerWidth <= 768) {
                    document.querySelector('.bottom-nav').style.display = 'flex';
                }

            } else {
                showToast('⚠️ يرجى تسجيل الدخول أولاً', 'warning');
                setTimeout(() => window.location.href = 'login.html', 2000);
            }
        };

        // ============================================================
        // 👥 تحديث طلبات الصداقة
        // ============================================================
        async function updateFriendRequestsBadge() {
            if (!database || !currentUser) return;

            try {
                const snapshot = await database.ref('users/' + currentFirebaseUserId + '/friendRequests').once('value');
                let count = 0;
                if (snapshot.exists()) {
                    const requests = snapshot.val();
                    for (const key in requests) {
                        if (requests[key].status === 'pending') count++;
                    }
                }
                document.getElementById('friendRequestsBadge').textContent = count;
                document.getElementById('bottomFriendBadge').textContent = count;
            } catch (e) {}
        }

        // ============================================================
        // 🧹 تنظيف عند الخروج
        // ============================================================
        window.addEventListener('beforeunload', function() {
            if (isCallActive) endCall();
            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
            }
            if (peer) {
                try { peer.destroy(); } catch (e) {}
            }
            stopRingtone();
            if (database && currentFirebaseUserId) {
                database.ref('users/' + currentFirebaseUserId).update({
                    isOnline: false,
                    inCall: false
                });
            }
        });
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js">
    </script>
</body>
</html>
